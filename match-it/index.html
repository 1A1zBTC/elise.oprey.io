<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Match It</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/shared/game.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E&L Games">
  <link rel="icon" href="/icons/favicon.png">
  <script src="/pwa.js" defer></script>
  <style>
    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      justify-content: flex-start; /* leak-reset: shared body sets center; orig was top-aligned */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    @media (min-width: 768px) {
      body { justify-content: center; }
    }

    .topbar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* ---------- Scoreboard ---------- */
    .scorebar {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .player {
      flex: 1 1 0;
      min-width: 110px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .player.active {
      border-color: #e94560;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.35);
      transform: translateY(-2px);
    }
    .player .name { color: #a0a8c0; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .player.active .name { color: #ffd2dc; }
    /* Editable player name, lives right in the scorebar. */
    .player .name-input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      border-bottom: 1px dashed transparent;
      color: #a0a8c0;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 1px 2px 2px;
      outline: none;
      cursor: text;
    }
    .player .name-input:hover { border-bottom-color: #3a4a6f; }
    .player .name-input:focus { border-bottom-color: #e94560; color: #fff; text-transform: none; }
    .player.active .name-input { color: #ffd2dc; }
    .player .score { color: #fff; font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
    .player .turn { color: #e94560; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; min-height: 0.8rem; }
    .player:not(.active) .turn { visibility: hidden; }

    /* ---------- Power-ups bar ---------- */
    .powerups {
      width: 100%;
      max-width: 560px;
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .powerups[hidden] { display: none; }
    .pu-btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      color: #fff;
      background: #2a3a64;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 9px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .pu-btn:hover:not(:disabled) { border-color: #e94560; background: #33457a; }
    .pu-btn:active:not(:disabled) { transform: translateY(2px); }
    .pu-btn:disabled { opacity: 0.45; cursor: default; }
    .pu-count { background: #0f1830; color: #ffe8b0; border-radius: 20px; padding: 1px 8px; font-size: 0.8rem; }

    /* ---------- Board ---------- */
    .board {
      width: 100%;
      max-width: 560px;
      display: grid;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      perspective: 700px;
      background: transparent;
    }
    .card-inner {
      position: absolute;
      inset: 0;
      transition: transform 0.4s cubic-bezier(.4,.0,.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* Back (face-down) */
    .face-back {
      background: linear-gradient(150deg, #1d2c52 0%, #0f3460 100%);
      border: 3px solid #234080;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #6f86c4;
    }
    .card:hover:not(.matched):not(.disabled) .face-back {
      border-color: #e94560;
      box-shadow: inset 0 0 22px rgba(233, 69, 96, 0.25);
    }
    .card:active:not(.matched):not(.disabled) { transform: scale(0.97); }

    /* Front (the photo) */
    .face-front {
      transform: rotateY(180deg);
      background: #0f1830;
      border: 3px solid #0f3460;
    }
    .face-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Show the whole square photo (LoremFlickr serves square images), matching what you
         saw in the picker — no zoom, so the full image is visible. */
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .face-front img.loaded { opacity: 1; }
    .face-front .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #3d4466;
      background: linear-gradient(100deg, #14203c 30%, #1b2a4a 50%, #14203c 70%);
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .card.matched .face-front {
      border-color: #46c46a;
      box-shadow: 0 0 22px rgba(70, 196, 106, 0.55);
    }
    .card.matched { animation: pop 0.4s ease; }
    @keyframes pop { 0%,100% { transform: scale(1); } 40% { transform: scale(1.06); } }

    .card.disabled { cursor: default; }

    /* Power-up reveals: flip the front into view WITHOUT touching turn/flip state. */
    .card.peek .card-inner { transform: rotateY(180deg); transition: transform 0.18s ease; }
    .card.spin .card-inner { transition: transform 0.1s ease; }   /* "Show" — fast 0.1s spin */

    /* ---------- Overlay (setup + win) ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 28, 0.86);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .panel {
      width: 100%;
      max-width: 380px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 24px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }
    .panel .sub { color: #a0a8c0; font-size: 0.9rem; margin-bottom: 18px; }
    .panel .group-label { color: #ffe8b0; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin: 16px 0 8px; }

    .choices { display: flex; gap: 10px; justify-content: center; }
    .choice {
      flex: 1;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: #cfd6ea;
      background: #0f1830;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 14px 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .choice .big { display: block; font-size: 1.5rem; line-height: 1.2; color: #fff; }
    .choice .small { display: block; font-size: 0.68rem; color: #8b93b0; font-weight: 700; margin-top: 2px; }
    .choice:hover { border-color: #6f86c4; }
    .choice:active { transform: scale(0.96); }
    .choice.selected {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      color: #fff;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.25);
    }
    .choice.selected .small { color: #ffb3c2; }

    .start-btn, .again-btn {
      margin-top: 22px;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      background: #e94560;
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b22a44;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .start-btn:active, .again-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b22a44; }

    .results { list-style: none; margin: 4px 0 0; }
    .results li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1830;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 9px 14px;
      margin-top: 8px;
      font-weight: 800;
      color: #cfd6ea;
    }
    .results li.winner { border-color: #46c46a; color: #fff; box-shadow: 0 0 16px rgba(70,196,106,0.3); }
    .results li .pts { color: #ffe8b0; }
    .results li.winner .pts { color: #7be39a; }
    .trophy { font-size: 2.6rem; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html" class="back">‹ Games</a>
    <span class="title">Match It</span>
    <span style="width:56px"></span>
  </div>

  <div class="scorebar" id="scorebar"></div>

  <div class="powerups" id="powerups" hidden></div>

  <div class="board" id="board"></div>

  <!-- Setup overlay -->
  <div class="overlay" id="setup">
    <div class="panel">
      <h2>Match It</h2>
      <div class="sub">Flip two cards. Find a matching pair to score &amp; go again! 🐾</div>

      <div class="group-label">Players</div>
      <div class="choices" id="player-choices">
        <button class="choice" data-players="2"><span class="big">2</span><span class="small">players</span></button>
        <button class="choice" data-players="3"><span class="big">3</span><span class="small">players</span></button>
        <button class="choice" data-players="4"><span class="big">4</span><span class="small">players</span></button>
      </div>

      <div class="group-label">Difficulty</div>
      <div class="choices" id="diff-choices">
        <button class="choice" data-pairs="6"><span class="big">Easy</span><span class="small">12 cards</span></button>
        <button class="choice" data-pairs="8"><span class="big">Medium</span><span class="small">16 cards</span></button>
        <button class="choice" data-pairs="10"><span class="big">Hard</span><span class="small">20 cards</span></button>
      </div>

      <div class="group-label">Power-ups</div>
      <div class="choices" id="power-choices">
        <button class="choice" data-powerups="on"><span class="big">On</span><span class="small">Peek &amp; Show</span></button>
        <button class="choice" data-powerups="off"><span class="big">Off</span><span class="small">classic</span></button>
      </div>

      <button class="start-btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <!-- Win overlay -->
  <div class="overlay" id="win" hidden>
    <div class="panel">
      <div class="trophy">🏆</div>
      <h2 id="win-title">Player 1 wins!</h2>
      <div class="sub" id="win-sub">Final scores</div>
      <ul class="results" id="results"></ul>
      <button class="again-btn" id="again-btn">Play Again</button>
    </div>
  </div>

  <script src="/shared/game.js"></script>
  <script>
  (function () {
    // Hand-picked baby-animal photos, curated via picker.html. Each is a SPECIFIC LoremFlickr
    // photo locked by (query, lock) so it never changes. Each entry becomes one matching pair
    // (shown on two cards). Matching is keyed on the exact photo, so two different kittens are
    // NOT treated as a match. To add/replace photos, pick on picker.html and paste tokens here.
    const PHOTOS = [
      { q: 'baby,kitten,face',     lock: 96542 },

      { q: 'baby,kitten,face',     lock: 257503 },
      { q: 'otter,face',           lock: 930840 },
      { q: 'baby,kitten,face',     lock: 185886 },
      { q: 'baby,kitten,face',     lock: 413550 },
      { q: 'baby,kitten,face',     lock: 958222 },
      { q: 'baby,puppy,face',      lock: 716516 },
      { q: 'baby,lion,face',       lock: 917149 },
      { q: 'baby,puppy,face',      lock: 48271 },
      { q: 'hamster,face',         lock: 241355 },
      { q: 'baby,penguin,face',    lock: 337897 },
      { q: 'baby,sloth,face',      lock: 868878 },
      { q: 'baby,squirrel,face',   lock: 627523 },
      { q: 'baby,tiger,face',      lock: 613902 },
      { q: 'baby,goat,face',       lock: 110233 },
      { q: 'pomeranian,face',      lock: 448130 },
      { q: 'dachshund,puppy,face', lock: 778406 },
      { q: 'beagle,puppy,face',    lock: 351588 },
      { q: 'labrador,puppy,face',  lock: 303317 },
      { q: 'husky,puppy,face',     lock: 255046 },
      { q: 'pony,face',            lock: 206775 },
      { q: 'baby,kangaroo,face',   lock: 538721 },
      { q: 'baby,monkey,face',     lock: 544672 },
      { q: 'baby,seal,face',       lock: 592943 },
      { q: 'baby,rabbit,face',     lock: 786027 },
      { q: 'hedgehog,face',        lock: 75653 },
      { q: 'baby,elephant,face',   lock: 606634 },
      { q: 'baby,tiger,face',      lock: 558363 },
      { q: 'baby,lion,face',       lock: 510092 },
      { q: 'foal,face',            lock: 751447 },
      { q: 'husky,puppy,face',     lock: 847989 },
      { q: 'labrador,puppy,face',  lock: 896260 },
      { q: 'baby,seal,face',       lock: 185886 },
      { q: 'pomeranian,face',      lock: 41073 },
      { q: 'beagle,puppy,face',    lock: 944531 },
      { q: 'otter,face',           lock: 572054 },
      { q: 'fawn,face',            lock: 6493 },
      { q: 'baby,sloth,face',      lock: 54764 },
      { q: 'foal,face',            lock: 344390 },
      { q: 'beagle,puppy,face',    lock: 537474 },
      { q: 'baby,monkey,face',     lock: 730558 },
      { q: 'otter,face',           lock: 164997 },
      { q: 'beagle,puppy,face',    lock: 130417 },
      { q: 'dachshund,puppy,face', lock: 959608 },
      { q: 'pomeranian,face',      lock: 226959 },
      { q: 'baby,puppy,face',      lock: 420043 },
      { q: 'corgi,face',           lock: 806211 },
      { q: 'labrador,puppy,face',  lock: 675089 },
      { q: 'baby,monkey,face',     lock: 916444 },
      { q: 'baby,puppy,face',      lock: 12986 }
    ];

    const boardEl = document.getElementById('board');
    const scorebarEl = document.getElementById('scorebar');
    const powerupsEl = document.getElementById('powerups');
    const setupEl = document.getElementById('setup');
    const winEl = document.getElementById('win');

    // ---- Power-up tuning ----
    const PEEKS_PER_PLAYER = 3;   // "Peek": reveal one random tile
    const SHOWS_PER_PLAYER = 1;   // "Show": flash the whole board
    const PEEK_MS = 500;          // a single tile stays revealed this long
    const SHOW_SPIN_MS = 100;     // "Show" flip speed (0.1s)
    const SHOW_HOLD_MS = 700;     // ...how long all cards stay face-up before spinning back

    // ---- Setup state ----
    let numPlayers = 2;
    let numPairs = 6;
    let powerupsEnabled = true;

    // ---- Game state ----
    let players = [];
    let currentPlayer = 0;
    let flipped = [];        // card DOM elements currently face-up (0–2)
    let matchedCount = 0;
    let locked = false;      // block taps during the reveal delay
    let powerActive = false; // block taps while a Peek/Show reveal is playing

    // Player names set centrally on the homepage (shared localStorage). Blank = default.
    const playerName = EL.playerName;

    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    function imageUrl(tag, seed) {
      // Comma-separated tags (e.g. 'baby,fox') must be passed as literal commas, so encode
      // each word but keep the commas between them. 640×640 keeps cards sharp on big boards
      // and retina screens. (No /g/ prefix — that flag is grayscale; we want full color.)
      const path = tag.split(',').map(encodeURIComponent).join(',');
      return 'https://loremflickr.com/640/640/' + path + '?lock=' + seed;
    }

    // ---------- Setup overlay wiring ----------
    function selectChoice(container, el) {
      container.querySelectorAll('.choice').forEach(function (c) { c.classList.remove('selected'); });
      el.classList.add('selected');
    }

    const playerChoices = document.getElementById('player-choices');
    const diffChoices = document.getElementById('diff-choices');

    // Default difficulty scales with player count: 2p→Easy, 3p→Medium, 4p→Hard.
    function defaultPairsFor(p) { return p === 2 ? 6 : p === 3 ? 8 : 10; }

    playerChoices.addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      numPlayers = parseInt(btn.dataset.players, 10);
      selectChoice(playerChoices, btn);
      // Suggest a matching difficulty default (user can still override).
      numPairs = defaultPairsFor(numPlayers);
      const diffBtn = diffChoices.querySelector('[data-pairs="' + numPairs + '"]');
      selectChoice(diffChoices, diffBtn);
    });

    diffChoices.addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      numPairs = parseInt(btn.dataset.pairs, 10);
      selectChoice(diffChoices, btn);
    });

    const powerChoices = document.getElementById('power-choices');
    powerChoices.addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      powerupsEnabled = btn.dataset.powerups === 'on';
      selectChoice(powerChoices, btn);
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('again-btn').addEventListener('click', function () {
      winEl.hidden = true;
      setupEl.hidden = false;
    });

    // ---------- Scoreboard ----------
    function renderScorebar() {
      scorebarEl.innerHTML = '';
      players.forEach(function (p, i) {
        const el = document.createElement('div');
        el.className = 'player' + (i === currentPlayer ? ' active' : '');

        const nm = document.createElement('div');
        nm.className = 'name';
        nm.textContent = playerName(i, p.defaultName);   // textContent: names can't inject markup

        const sc = document.createElement('div');
        sc.className = 'score';
        sc.textContent = p.score;

        const tn = document.createElement('div');
        tn.className = 'turn';
        tn.textContent = 'Your turn';

        el.appendChild(nm);
        el.appendChild(sc);
        el.appendChild(tn);
        scorebarEl.appendChild(el);
      });
      renderPowerups();
    }

    // Name to show, sourced from the homepage's shared store (falls back to the default).
    function nameOf(p) { return playerName(players.indexOf(p), p.defaultName); }

    // ---------- Power-ups ----------
    function busy() { return locked || powerActive; }

    function renderPowerups() {
      if (!powerupsEnabled || !players.length) {
        powerupsEl.hidden = true;
        powerupsEl.innerHTML = '';
        return;
      }
      powerupsEl.hidden = false;
      const p = players[currentPlayer];
      const disabled = busy();
      powerupsEl.innerHTML = '';

      const peekBtn = document.createElement('button');
      peekBtn.className = 'pu-btn';
      peekBtn.disabled = disabled || p.peeks <= 0;
      peekBtn.innerHTML = '👀 Peek <span class="pu-count">' + p.peeks + '</span>';
      peekBtn.addEventListener('click', usePeek);
      powerupsEl.appendChild(peekBtn);

      const showBtn = document.createElement('button');
      showBtn.className = 'pu-btn';
      showBtn.disabled = disabled || p.shows <= 0;
      showBtn.innerHTML = '🔄 Show <span class="pu-count">' + p.shows + '</span>';
      showBtn.addEventListener('click', useShow);
      powerupsEl.appendChild(showBtn);
    }

    function disableAllCards() {
      boardEl.querySelectorAll('.card').forEach(function (c) { c.classList.add('disabled'); });
    }

    // Peek: flip ONE random face-down tile up for PEEK_MS, then flip it back.
    function usePeek() {
      if (!powerupsEnabled || busy()) return;
      const p = players[currentPlayer];
      if (p.peeks <= 0) return;
      const candidates = [].filter.call(boardEl.querySelectorAll('.card'), function (c) {
        return !c.classList.contains('matched') && !c.classList.contains('flipped') && !c.classList.contains('peek');
      });
      if (!candidates.length) return;

      p.peeks--;
      powerActive = true;
      disableAllCards();
      renderPowerups();

      const card = candidates[Math.floor(Math.random() * candidates.length)];
      card.classList.add('peek');
      setTimeout(function () {
        card.classList.remove('peek');
        powerActive = false;
        enableCards();
        renderPowerups();
      }, PEEK_MS);
    }

    // Show: spin EVERY face-down tile around fast, hold briefly, then spin back.
    function useShow() {
      if (!powerupsEnabled || busy()) return;
      const p = players[currentPlayer];
      if (p.shows <= 0) return;
      const cards = [].filter.call(boardEl.querySelectorAll('.card'), function (c) {
        return !c.classList.contains('matched') && !c.classList.contains('flipped');
      });
      if (!cards.length) return;

      p.shows--;
      powerActive = true;
      disableAllCards();
      renderPowerups();

      cards.forEach(function (c) { c.classList.add('spin', 'peek'); });
      setTimeout(function () {
        cards.forEach(function (c) { c.classList.remove('peek'); });   // spin back
        setTimeout(function () {
          cards.forEach(function (c) { c.classList.remove('spin'); });
          powerActive = false;
          enableCards();
          renderPowerups();
        }, SHOW_SPIN_MS + 20);
      }, SHOW_SPIN_MS + SHOW_HOLD_MS);
    }

    // ---------- Card creation ----------
    // Pick `numPairs` photos from the curated pool. Each photo's exact URL is fixed (its
    // locked query), and both cards of the pair share it + a unique `key` used for matching.
    function buildCards() {
      const picks = shuffle(PHOTOS).slice(0, numPairs);
      const deck = [];
      picks.forEach(function (photo) {
        const pair = { key: photo.q + '#' + photo.lock, url: imageUrl(photo.q, photo.lock) };
        deck.push({ pair: pair }, { pair: pair });
      });
      return shuffle(deck);
    }

    function createCardEl(data) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = data.pair.key;

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const back = document.createElement('div');
      back.className = 'face face-back';
      back.textContent = '🐾';

      const front = document.createElement('div');
      front.className = 'face face-front';

      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      spinner.textContent = '🐾';

      const img = document.createElement('img');
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('load', function () {
        img.classList.add('loaded');
        spinner.style.display = 'none';
      });
      // Fixed photo URL. On a transient load error, retry the SAME url a few times (a new
      // seed would change the photo), then give up gracefully and leave the paw.
      let tries = 0;
      img.addEventListener('error', function () {
        tries++;
        if (tries < 4) img.src = data.pair.url + '&r=' + tries;
        else spinner.textContent = '🐾';
      });
      img.src = data.pair.url;

      front.appendChild(spinner);
      front.appendChild(img);
      inner.appendChild(back);
      inner.appendChild(front);
      card.appendChild(inner);

      card.addEventListener('click', function () { onCardTap(card); });
      return card;
    }

    // ---------- Game flow ----------
    function startGame() {
      players = [];
      for (let i = 0; i < numPlayers; i++) {
        const def = 'Player ' + (i + 1);
        players.push({ name: def, defaultName: def, score: 0, peeks: PEEKS_PER_PLAYER, shows: SHOWS_PER_PLAYER });
      }
      powerActive = false;
      currentPlayer = 0;
      flipped = [];
      matchedCount = 0;
      locked = false;

      const cols = numPairs <= 6 ? 4 : (window.innerWidth < 420 ? 3 : (numPairs === 8 ? 4 : 5));
      boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

      const deck = buildCards();
      boardEl.innerHTML = '';
      deck.forEach(function (d) { boardEl.appendChild(createCardEl(d)); });

      renderScorebar();
      setupEl.hidden = true;
      winEl.hidden = true;
    }

    function onCardTap(card) {
      if (locked || powerActive) return;
      if (card.classList.contains('matched') || card.classList.contains('flipped')) return;
      if (flipped.length >= 2) return;

      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) resolveTurn();
    }

    function resolveTurn() {
      locked = true;
      boardEl.querySelectorAll('.card').forEach(function (c) { c.classList.add('disabled'); });
      const a = flipped[0], b = flipped[1];
      const isMatch = a.dataset.key === b.dataset.key;

      setTimeout(function () {
        if (isMatch) {
          a.classList.add('matched');
          b.classList.add('matched');
          players[currentPlayer].score++;
          matchedCount++;
          flipped = [];
          locked = false;        // clear BEFORE rendering so power-up buttons aren't drawn disabled
          renderScorebar();
          enableCards();
          if (matchedCount === numPairs) endGame();
          // Same player goes again — currentPlayer unchanged.
        } else {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          currentPlayer = (currentPlayer + 1) % players.length;
          locked = false;        // clear BEFORE rendering so the new player's power-ups are enabled
          renderScorebar();
          enableCards();
        }
      }, 900);
    }

    function enableCards() {
      boardEl.querySelectorAll('.card').forEach(function (c) {
        if (!c.classList.contains('matched')) c.classList.remove('disabled');
      });
    }

    function endGame() {
      const max = Math.max.apply(null, players.map(function (p) { return p.score; }));
      const winners = players.filter(function (p) { return p.score === max; });

      const titleEl = document.getElementById('win-title');
      const subEl = document.getElementById('win-sub');
      if (winners.length === 1) {
        titleEl.textContent = nameOf(winners[0]) + ' wins!';
        subEl.textContent = 'Final scores';
      } else {
        titleEl.textContent = "It's a tie!";
        subEl.textContent = winners.map(nameOf).join(' & ') + ' tied';
      }

      const list = document.getElementById('results');
      list.innerHTML = '';
      players.slice().sort(function (x, y) { return y.score - x.score; }).forEach(function (p) {
        const li = document.createElement('li');
        if (p.score === max) li.className = 'winner';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = (p.score === max ? '👑 ' : '') + nameOf(p);   // textContent: names can't inject HTML
        const ptsSpan = document.createElement('span');
        ptsSpan.className = 'pts';
        ptsSpan.textContent = p.score + (p.score === 1 ? ' pair' : ' pairs');
        li.appendChild(nameSpan);
        li.appendChild(ptsSpan);
        list.appendChild(li);
      });

      setTimeout(function () { winEl.hidden = false; }, 650);
    }

    // ---- Initialise default selections on the setup screen ----
    selectChoice(playerChoices, playerChoices.querySelector('[data-players="2"]'));
    selectChoice(diffChoices, diffChoices.querySelector('[data-pairs="6"]'));
    selectChoice(powerChoices, powerChoices.querySelector('[data-powerups="on"]'));
  })();
  </script>

  <script>
    // On desktop the homepage loads this game in a pane. Hide only the "‹ Games" back link
    // (it would reload the homepage inside the pane) while keeping the Pacifico game title
    // visible. Standalone/mobile (top-level) pages keep the full topbar.
    if (window.self !== window.top) {
      var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
    }
  </script>
</body>
</html>
