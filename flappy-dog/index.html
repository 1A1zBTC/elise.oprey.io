      { name: 'Rough Collie',     body:'#c8924a', patch:'#ffffff', ear:'pointy',               build:'normal', snout:'long',  coat:'fluffy', tail:'plume', spots:false, mask:null }
    ];

    // Costumes — accessories layered on top of whichever breed is equipped.
    const COSTUMES = [
      { name: 'Party Hat',   id: 'party' },
      { name: 'Bandana',     id: 'bandana' },
      { name: 'Sunglasses',  id: 'shades' },
      { name: 'Top Hat',     id: 'tophat' },
      { name: 'Crown',       id: 'crown' },
      { name: 'Bow Tie',     id: 'bowtie' },
      { name: 'Cowboy Hat',  id: 'cowboy' },
      { name: 'Beanie',      id: 'beanie' },
      { name: 'Wizard Hat',  id: 'wizard' },
      { name: 'Headphones',  id: 'headphones' },
      { name: 'Halo',        id: 'halo' },
      { name: 'Scarf',       id: 'scarf' },
      { name: 'Santa Hat',    id: 'santa' },
      { name: 'Flower Crown', id: 'flowers' },
      { name: 'Grad Cap',     id: 'grad' },
      { name: 'Chef Hat',     id: 'chef' },
      { name: 'Antlers',      id: 'antlers' },
      { name: 'Bunny Ears',   id: 'bunny' },
      { name: 'Devil Horns',  id: 'devil' },
      { name: 'Glasses',      id: 'glasses' },
      { name: 'Baseball Cap', id: 'cap' },
      { name: 'Viking Helm',  id: 'viking' },
      { name: 'Knicks Jersey', id: 'knicks' }
    ];

    // Levels — each has its own backdrop, obstacle style, difficulty ramp, AND a unique
    // mechanic (`mechanic`) that adds a themed challenge. Extra levels bought with bones.
    //   bob      = gaps slide up/down (amp/motionFreq)
    //   blackout = the scene periodically dims (city lights flicker)
    //   wind     = vertical gusts nudge the dog
    //   rush     = world speed periodically surges (sugar rush)
    //   lowgrav  = weaker gravity + softer flap (floaty)
    const LEVELS = [
      { name: 'Meadow',      cost: 0,   obstacle: 'pipe',     ground: 'grass',    drifter: 'cloud',
        mechanic: 'none',     tagline: 'Wide open skies — just flap!',
        sky: ['#5ec8f0', '#9fe0f5', '#d6f3ff'],
        speedMin: 0.9,  speedMax: 2.3, gapMin: 205, gapMax: 260, ramp: 60 * 80,  amp: 0,  motionFreq: 0 },
      { name: 'Coral Reef',  cost: 25,  obstacle: 'coral',    ground: 'sand',     drifter: 'bubble',
        mechanic: 'bob',      tagline: 'The tide sways the coral up & down',
        sky: ['#073b5e', '#16618c', '#39a7c4'],
        speedMin: 0.55, speedMax: 1.7, gapMin: 215, gapMax: 268, ramp: 60 * 150, amp: 36, motionFreq: 0.018 },
      { name: 'Night City',  cost: 40,  obstacle: 'building', ground: 'pavement', drifter: 'star',
        mechanic: 'blackout', tagline: 'Watch out — the lights black out!',
        sky: ['#0b1026', '#241a4d', '#4a2f6e'],
        speedMin: 0.95, speedMax: 2.4, gapMin: 200, gapMax: 256, ramp: 60 * 90,  amp: 0,  motionFreq: 0 },
      { name: 'Snowy Peaks', cost: 60,  obstacle: 'ice',      ground: 'snow',     drifter: 'snow',
        mechanic: 'wind',     tagline: 'Mountain winds gust you around',
        sky: ['#7fb2d9', '#bcd9ee', '#eaf4fb'],
        speedMin: 0.85, speedMax: 2.2, gapMin: 210, gapMax: 264, ramp: 60 * 120, amp: 0,  motionFreq: 0 },
      { name: 'Candy Land',  cost: 85,  obstacle: 'candy',    ground: 'frosting', drifter: 'cloud',
        mechanic: 'rush',     tagline: 'Sugar rushes speed everything up!',
        sky: ['#ff9ec9', '#ffc1dd', '#ffe3f0'],
        speedMin: 0.9,  speedMax: 2.3, gapMin: 206, gapMax: 260, ramp: 60 * 100, amp: 0,  motionFreq: 0 },
      { name: 'Outer Space', cost: 120, obstacle: 'crystal',  ground: 'moon',     drifter: 'star',
        mechanic: 'lowgrav',  tagline: 'Low gravity — slow, floaty flapping',
        sky: ['#05030f', '#0e0a2a', '#1b1240'],
        speedMin: 0.6,  speedMax: 1.8, gapMin: 215, gapMax: 270, ramp: 60 * 150, amp: 0,  motionFreq: 0 }
    ];

    // ---- Per-level mechanic helpers (frame-driven, bounded so they stay kid-fair) ----
    // Sugar-rush speed multiplier: rests at 1×, surges toward ~1.7× in smooth pulses.
    function rushMult(f) { return 1 + 0.7 * Math.max(0, Math.sin(f * 0.012)); }
    // Wind gust acceleration added to the dog's vertical velocity (bounded ≈ ±0.035).
    // Kept well under gravity (~0.085–0.16) so it's a gentle nudge, not a fight — the old
    // ±0.12 was nearly as strong as gravity and made Snowy Peaks brutally hard.
    function windAt(f) { return Math.sin(f * 0.018) * 0.022 + Math.sin(f * 0.0047) * 0.013; }
    // Night-City blackout opacity: mostly clear, smooth dark pulse over the last ~40%
    // of each ~6s cycle (lights flicker out, then back).
    function blackoutAlpha(f) {
      const c = (f % 360) / 360;
      return c > 0.6 ? Math.sin((c - 0.6) / 0.4 * Math.PI) * 0.78 : 0;
    }

    // ---- State ----
    const PLAYERS_KEY = 'flappydog.players';   // 1 or 2 player mode
    let state = 'ready';       // 'ready' | 'playing' | 'gameover'
    let pipes;
    let frame = 0;
    let groundX = 0;
    let clouds;
    let deathFrame = -999;     // frame the round ended (restart debounce)
    let numPlayers = parseInt(localStorage.getItem(PLAYERS_KEY) || '1', 10) === 2 ? 2 : 1;

    // One entry per dog in play. 1P uses players[0]; 2P adds players[1], flapped by
    // the right-hand control. Both dogs share the same pipes and difficulty ramp.
    let players = [];

    function makePlayer(id, breedIndex, x, costume) {
      return {
        id: id, x: x, breedIndex: breedIndex, skin: BREEDS[breedIndex], costume: costume,
        y: H * 0.42, v: 0, angle: 0, flapAnim: 0,
        alive: true, score: 0, newRecord: false, deathFrame: -999
      };
    }

    // Costume id for a player slot, or null when nothing valid is equipped.
    function costumeIdFor(slot) {
      const c = costumes[slot];
      return (c >= 0 && costumesOwned.has(c)) ? COSTUMES[c].id : null;
    }

    function buildPlayers() {
      players = [ makePlayer(0, skins[0], numPlayers === 2 ? 96 : DOG_X, costumeIdFor(0)) ];
      if (numPlayers === 2) players.push(makePlayer(1, skins[1], 132, costumeIdFor(1)));
    }

    // Per-breed high scores (one entry per breed).
    const bests = BREEDS.map(function () { return 0; });
    (function loadBests() {
      const raw = localStorage.getItem(BESTS_KEY);
      if (raw) {
        raw.split(',').forEach(function (v, i) {
          const n = parseInt(v, 10);
          if (i < bests.length && !isNaN(n)) bests[i] = n;
        });
      } else {
        // migrate the old single best into the Corgi's slot
        const legacy = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
        if (legacy > 0) bests[0] = legacy;
      }
    })();
    function saveBests() {
      try { localStorage.setItem(BESTS_KEY, bests.join(',')); } catch (e) {}
    }

    // Bones are a SPENDABLE balance that simply accumulates — nothing is bought
    // automatically. In the shop the player chooses to spend them on a breed
    // (BREED_COST) or a costume (COSTUME_COST), or save up. Costs are deducted on
    // purchase. Owned breeds/costumes + current selections all persist.
    let treats = parseInt(localStorage.getItem(TREATS_KEY) || '0', 10) || 0;
    let owned = parseInt(localStorage.getItem(OWNED_KEY) || '1', 10) || 1;
    owned = Math.max(1, Math.min(BREEDS.length, owned));
    let levelsOwned = parseInt(localStorage.getItem(LEVELS_KEY) || '1', 10) || 1;
    levelsOwned = Math.max(1, Math.min(LEVELS.length, levelsOwned));
    let level = parseInt(localStorage.getItem(LEVEL_KEY) || '0', 10) || 0;
    level = Math.max(0, Math.min(levelsOwned - 1, level));
    let unlockName = null, unlockUntil = 0;  // for the "new unlock!" toast

    // owned costumes stored as a comma list of indices (shared pool both dogs draw from)
    const costumesOwned = new Set(
      (localStorage.getItem(COSTUMES_KEY) || '').split(',')
        .map(function (s) { return parseInt(s, 10); })
        .filter(function (n) { return !isNaN(n); })
    );

    // Per-player equipped selections. Slot 0 = P1, slot 1 = P2; both pick from the same
    // owned pool, only slot 0 matters in 1P. `editSlot` is the dog the shop edits.
    function clampOwned(v, dflt) {
      if (isNaN(v)) v = dflt;
      return Math.max(0, Math.min(owned - 1, v));
    }
    let skins = [ clampOwned(parseInt(localStorage.getItem(SKIN_KEYS[0]) || '0', 10), 0), 0 ];
    skins[1] = clampOwned(parseInt(localStorage.getItem(SKIN_KEYS[1]), 10),
                          owned > 1 ? (skins[0] + 1) % owned : skins[0]);
    function loadCostume(slot) {
      const v = parseInt(localStorage.getItem(COSTUME_KEYS[slot]), 10);
      return (!isNaN(v) && costumesOwned.has(v)) ? v : -1;
    }
    let costumes = [ loadCostume(0), loadCostume(1) ];
    let pendingSkins = [null, null];  // breed to apply after each dog falls (set during play)
    let editSlot = 0;                 // which player the shop currently customises

    function saveBones() { try { localStorage.setItem(TREATS_KEY, String(treats)); } catch (e) {} }

    function equipSkin(slot, i) {
      skins[slot] = i;
      try { localStorage.setItem(SKIN_KEYS[slot], String(i)); } catch (e) {}
      const pl = players[slot];
      if (pl && state !== 'playing') { pl.breedIndex = i; pl.skin = BREEDS[i]; }
      refreshShop();
    }

    function selectSkin(i) {
      if (i < 0 || i >= owned) return;        // can't pick a locked breed
      if (state === 'playing') {              // you only become the new breed after you fall
        pendingSkins[editSlot] = i;
        return;
      }
      equipSkin(editSlot, i);
    }

    function buyBreed() {
      if (treats < BREED_COST || owned >= BREEDS.length) return;
      treats -= BREED_COST;
      const newIndex = owned;
      owned++;
      try { localStorage.setItem(OWNED_KEY, String(owned)); } catch (e) {}
      saveBones();
      selectSkin(newIndex);              // equip (deferred to the fall if mid-run)
      unlockName = BREEDS[newIndex].name;
      unlockUntil = frame + 160;
      refreshShop();
    }

    function equipCostume(i) {
      costumes[editSlot] = i;
      try { localStorage.setItem(COSTUME_KEYS[editSlot], String(i)); } catch (e) {}
      const pl = players[editSlot];
      if (pl) pl.costume = (i >= 0 && costumesOwned.has(i)) ? COSTUMES[i].id : null;
      refreshShop();
    }

    function buyOrEquipCostume(i) {
      if (costumesOwned.has(i)) {
        equipCostume(i === costumes[editSlot] ? -1 : i);   // toggle on/off
        return;
      }
      if (treats < COSTUME_COST) return;
      treats -= COSTUME_COST;
      costumesOwned.add(i);
      try { localStorage.setItem(COSTUMES_KEY, Array.from(costumesOwned).join(',')); } catch (e) {}
      saveBones();
      equipCostume(i);
      unlockName = COSTUMES[i].name;
      unlockUntil = frame + 160;
      refreshShop();
    }

    function collectTreat() {
      treats++;                          // just bank it — the player decides how to spend
      saveBones();
      refreshShop();
    }

    // --- shop UI (HTML buttons under the canvas) ---
    const boneCountEl = document.getElementById('boneCount');
    const breedsEl = document.getElementById('breeds');
    const costumesEl = document.getElementById('costumes');

    const breedBtns = BREEDS.map(function (b, i) {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.addEventListener('click', function () {
        if (i < owned) selectSkin(i);
        else if (i === owned) buyBreed();
        btn.blur();
      });
      breedsEl.appendChild(btn);
      return btn;
    });

    const noCostumeBtn = document.createElement('button');
    noCostumeBtn.className = 'chip';
    noCostumeBtn.type = 'button';
    noCostumeBtn.textContent = 'None';
    noCostumeBtn.addEventListener('click', function () { equipCostume(-1); noCostumeBtn.blur(); });
    costumesEl.appendChild(noCostumeBtn);

    const costumeBtns = COSTUMES.map(function (c, i) {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.addEventListener('click', function () { buyOrEquipCostume(i); btn.blur(); });
      costumesEl.appendChild(btn);
      return btn;
    });

    const levelsEl = document.getElementById('levels');
    const levelBtns = LEVELS.map(function (L, i) {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.addEventListener('click', function () {
        if (i < levelsOwned) selectLevel(i);
        else if (i === levelsOwned) buyLevel();
        btn.blur();
      });
      levelsEl.appendChild(btn);
      return btn;
    });

    function refreshBreeds() {
      for (let i = 0; i < breedBtns.length; i++) {
        const btn = breedBtns[i];
        if (i < owned) {                       // owned → selectable (shows its best)
          btn.disabled = false;
          btn.textContent = BREEDS[i].name + (bests[i] > 0 ? ' · ' + bests[i] : '');
          btn.classList.toggle('active', i === skins[editSlot]);
          btn.classList.remove('buy');
        } else if (i === owned) {              // next in line → buyable
          const afford = treats >= BREED_COST;
          btn.disabled = !afford;
          btn.textContent = '＋ ' + BREEDS[i].name + ' · ' + BREED_COST + '🦴';
          btn.classList.remove('active');
          btn.classList.toggle('buy', afford);
        } else {                               // still locked
          btn.disabled = true;
          btn.textContent = '🔒 ' + BREEDS[i].name;
          btn.classList.remove('active', 'buy');
        }
      }
    }

    function refreshCostumes() {
      noCostumeBtn.classList.toggle('active', costumes[editSlot] < 0);
      for (let i = 0; i < costumeBtns.length; i++) {
        const btn = costumeBtns[i];
        if (costumesOwned.has(i)) {            // owned → toggle wear
          btn.disabled = false;
          btn.textContent = COSTUMES[i].name;
          btn.classList.toggle('active', i === costumes[editSlot]);
          btn.classList.remove('buy');
        } else {                               // buyable
          const afford = treats >= COSTUME_COST;
          btn.disabled = !afford;
          btn.textContent = '＋ ' + COSTUMES[i].name + ' · ' + COSTUME_COST + '🦴';
          btn.classList.remove('active');
          btn.classList.toggle('buy', afford);
        }
      }
    }

    function selectLevel(i) {
      if (i >= levelsOwned || i === level) return;
      level = i;
      try { localStorage.setItem(LEVEL_KEY, String(i)); } catch (e) {}
      reset(); state = 'ready';
      refreshShop();
    }
    function buyLevel() {
      if (levelsOwned >= LEVELS.length) return;
      const cost = LEVELS[levelsOwned].cost;
      if (treats < cost) return;
      treats -= cost; saveBones();
      const ni = levelsOwned;
      levelsOwned++;
      try { localStorage.setItem(LEVELS_KEY, String(levelsOwned)); } catch (e) {}
      unlockName = LEVELS[ni].name; unlockUntil = frame + 160;
      selectLevel(ni);   // auto-switch to the freshly unlocked level (resets + refreshes)
    }
    function refreshLevels() {
      for (let i = 0; i < levelBtns.length; i++) {
        const btn = levelBtns[i];
        if (i < levelsOwned) {                 // owned → selectable
          btn.disabled = false;
          btn.textContent = LEVELS[i].name;
          btn.classList.toggle('active', i === level);
          btn.classList.remove('buy');
        } else if (i === levelsOwned) {        // next → buyable at its own price
          const cost = LEVELS[i].cost;
          const afford = treats >= cost;
          btn.disabled = !afford;
          btn.textContent = '＋ ' + LEVELS[i].name + ' · ' + cost + '🦴';
          btn.classList.remove('active');
          btn.classList.toggle('buy', afford);
        } else {                               // locked
          btn.disabled = true;
          btn.textContent = '🔒 ' + LEVELS[i].name;
          btn.classList.remove('active', 'buy');
        }
      }
    }

    function refreshShop() {
      if (boneCountEl) boneCountEl.textContent = treats;
      refreshBreeds();
      refreshCostumes();
      refreshLevels();
    }
    refreshShop();

    // --- 1P / 2P toggle ---
    const onePBtn = document.getElementById('onePlayer');
    const twoPBtn = document.getElementById('twoPlayer');
    function refreshPlayersToggle() {
      if (onePBtn) onePBtn.classList.toggle('active', numPlayers === 1);
      if (twoPBtn) twoPBtn.classList.toggle('active', numPlayers === 2);
    }
    function setPlayers(n) {
      if (n === numPlayers) return;
      numPlayers = n;
      try { localStorage.setItem(PLAYERS_KEY, String(n)); } catch (e) {}
      reset();
      state = 'ready';
      refreshPlayersToggle();
      setEditSlot(0);   // back to P1 whenever the player count changes
    }
    if (onePBtn) onePBtn.addEventListener('click', function () { setPlayers(1); onePBtn.blur(); });
    if (twoPBtn) twoPBtn.addEventListener('click', function () { setPlayers(2); twoPBtn.blur(); });
    refreshPlayersToggle();

    // --- "Customising P1 / P2" toggle (2P only): picks which dog the shop dresses ---
    const dressToggle = document.getElementById('dressToggle');
    const dressP1 = document.getElementById('dressP1');
    const dressP2 = document.getElementById('dressP2');
    function refreshDressToggle() {
      if (dressToggle) dressToggle.hidden = numPlayers !== 2;
      if (numPlayers !== 2) editSlot = 0;
      if (dressP1) { dressP1.textContent = playerName(0, 'Player 1'); dressP1.classList.toggle('active', editSlot === 0); }
      if (dressP2) { dressP2.textContent = playerName(1, 'Player 2'); dressP2.classList.toggle('active', editSlot === 1); }
    }
    function setEditSlot(s) {
      editSlot = s;
      refreshDressToggle();
      refreshShop();   // re-highlight the active dog's equipped breed + costume
    }
    if (dressP1) dressP1.addEventListener('click', function () { setEditSlot(0); dressP1.blur(); });
    if (dressP2) dressP2.addEventListener('click', function () { setEditSlot(1); dressP2.blur(); });
    refreshDressToggle();

    // ---- Start dialog (shown at launch only; replay flow is unchanged) ----
    const setupEl = document.getElementById('setup');
    const playerChoices = document.getElementById('player-choices');
    let chosenPlayers = numPlayers;
    function selectDialogChoice(el) {
      playerChoices.querySelectorAll('.choice').forEach(function (c) { c.classList.remove('selected'); });
      el.classList.add('selected');
    }
    playerChoices.addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      chosenPlayers = parseInt(btn.dataset.players, 10);
      selectDialogChoice(btn);
    });
    document.getElementById('start-btn').addEventListener('click', function () {
      setPlayers(chosenPlayers);   // rebuilds the run if the count changed
      numPlayers = chosenPlayers;  // ensure applied even when unchanged
      refreshPlayersToggle();
      setEditSlot(0);              // show/hide the Customising toggle for this mode
      state = 'ready';
      setupEl.hidden = true;
    });
    selectDialogChoice(playerChoices.querySelector('[data-players="' + (numPlayers === 2 ? 2 : 1) + '"]'));

    function reset() {
      pipes = [];
      playFrames = 0;
      applyDifficulty();  // reset to easiest settings
      buildPlayers();
      // pre-seed pipes off to the right
      let x = W + 120;
      for (let i = 0; i < 4; i++) {
        pipes.push(makePipe(x));
        x += PIPE_SPACING;
      }
      clouds = seedDrifters(LEVELS[level].drifter);
    }

    // Backdrop drifters depend on the level: a few big clouds/bubbles, or a scattered
    // field of stars / snowflakes spread across the sky.
    function seedDrifters(kind) {
      if (kind === 'star') {
        const arr = [];
        for (let i = 0; i < 22; i++) {
          arr.push({ x: Math.random() * W, y: Math.random() * (H - GROUND_H) * 0.85,
                     s: 0.4 + Math.random() * 0.9, phase: Math.random() * Math.PI * 2 });
        }
        return arr;
      }
      if (kind === 'snow') {
        const arr = [];
        for (let i = 0; i < 26; i++) {
          arr.push({ x: Math.random() * W, y: Math.random() * H,
                     s: 0.5 + Math.random() * 1.0, vy: 0.5 + Math.random() * 0.9,
                     phase: Math.random() * Math.PI * 2 });
        }
        return arr;
      }
      return [   // cloud / bubble: a few large drifters up high
        { x: 80,  y: 90,  s: 1.0 },
        { x: 240, y: 150, s: 0.7 },
        { x: 340, y: 70,  s: 0.85 }
      ];
    }

    function makePipe(x) {
      const gap = GAP;  // snapshot the gap at creation so it can't pop mid-flight
      const playable = H - GROUND_H - gap - PIPE_MIN_TOP * 2;
      const top = PIPE_MIN_TOP + Math.random() * playable;
      // ~28% of pipes carry a treat floating somewhere in the gap (spread out).
      const treat = Math.random() < 0.28
        ? { collected: false, offY: gap * (0.3 + Math.random() * 0.4) }
        : null;
      // passedBy tracks which dog has already scored this pipe (keyed by player id).
      // baseTop/phase drive the vertical bob on levels that move (amp > 0).
      return { x: x, top: top, baseTop: top, phase: Math.random() * Math.PI * 2, gap: gap, passedBy: {}, treat: treat };
    }

    // Flap a specific dog (idx 0 = P1, 1 = P2). On the game-over screen any input
    // restarts the round (after a short debounce).
    function flap(idx) {
      if (state === 'gameover') {
        if (frame - deathFrame > 18) { reset(); state = 'ready'; }
        return;
      }
      if (state === 'ready') state = 'playing';
      const p = players[idx];
      if (p && p.alive) { p.v = FLAP; p.flapAnim = 10; }
    }

    // ---- Input ----
    // Pointer: in 2P the screen splits bottom (P1) / top (P2); otherwise anywhere = P1.
    function onPress(e) {
      if (e) e.preventDefault();
      if (state === 'playing' && numPlayers === 2) {
        const rect = canvas.getBoundingClientRect();
        const py = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - rect.top;
        flap(py < rect.height / 2 ? 1 : 0);   // top half → P2, bottom half → P1
      } else {
        flap(0);
      }
    }
    canvas.addEventListener('mousedown', onPress);
    canvas.addEventListener('touchstart', onPress, { passive: false });
    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;   // ignore auto-repeat from a held key
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        flap(0);
      } else if (e.code === 'ControlRight') {
        e.preventDefault();
        flap(numPlayers === 2 ? 1 : 0);
      }
    });

    // ---- Update ----
    function update() {
      frame++;
      groundX = (groundX - PIPE_SPEED * dtf) % 24;

      // backdrop drifters move by kind: clouds/bubbles slide left, snow falls, stars barely drift
      const drift = LEVELS[level].drifter;
      for (const c of clouds) {
        if (drift === 'snow') {
          c.y += c.vy * dtf; c.x += Math.sin((frame + c.phase * 40) / 40) * 0.3 * dtf;
          if (c.y > H + 6) { c.y = -6; c.x = Math.random() * W; }
        } else if (drift === 'star') {
          c.x -= 0.08 * c.s * dtf;           // slow parallax; keep y so the field stays even
          if (c.x < -6) c.x = W + 6;
        } else {
          c.x -= 0.25 * c.s * dtf;
          if (c.x < -60) { c.x = W + 40; c.y = 50 + Math.random() * 130; }
        }
      }

      for (const p of players) if (p.flapAnim > 0) p.flapAnim = Math.max(0, p.flapAnim - dtf);

      if (state === 'ready') {
        // gentle bob while waiting
        for (const p of players) {
          p.y = H * 0.42 + Math.sin(frame / 14) * 8;
          p.angle = Math.sin(frame / 14) * 0.06;
        }
        return;
      }

      if (state === 'gameover') {
        for (const p of players) settleDead(p);
        return;
      }

      // playing
      playFrames += dtf;
      applyDifficulty();  // ramp gravity/speed/gap with elapsed play time

      // Snowy Peaks — vertical wind gusts nudge each living dog.
      const wind = LEVELS[level].mechanic === 'wind' ? windAt(playFrames) : 0;

      // per-dog physics (dead dogs keep falling to the ground)
      for (const p of players) {
        if (!p.alive) { settleDead(p); continue; }
        p.v = Math.min(p.v + (GRAVITY + wind) * dtf, MAX_FALL);
        p.y += p.v * dtf;
        const target = p.v < 0 ? -0.45 : Math.min(p.v / 12, 1.2);
        p.angle += (target - p.angle) * 0.18 * dtf;
      }

      // move pipes once; score & collect treats for each living dog
      for (const pipe of pipes) {
        pipe.x -= PIPE_SPEED * dtf;
        for (const p of players) {
          if (p.alive && !pipe.passedBy[p.id] && pipe.x + PIPE_W < p.x) {
            pipe.passedBy[p.id] = true;
            p.score++;
          }
        }
        if (pipe.treat && !pipe.treat.collected) {
          const tx = pipe.x + PIPE_W / 2;
          const ty = pipe.top + pipe.treat.offY;
          for (const p of players) {
            if (p.alive && Math.hypot(p.x - tx, p.y - ty) < 26) {
              pipe.treat.collected = true;
              collectTreat();
              break;
            }
          }
        }
      }
      // recycle
      if (pipes.length && pipes[0].x + PIPE_W < -20) {
        pipes.shift();
        const lastX = pipes[pipes.length - 1].x;
        pipes.push(makePipe(lastX + PIPE_SPACING));
      }

      // moving obstacles: levels with amp > 0 bob each gap up and down
      const Lm = LEVELS[level];
      if (Lm.amp > 0) {
        for (const pipe of pipes) {
          const room = (H - GROUND_H - pipe.gap - PIPE_MIN_TOP * 2) / 2;
          const amp = Math.max(0, Math.min(Lm.amp, room));
          const lo = PIPE_MIN_TOP + amp, hi = H - GROUND_H - pipe.gap - PIPE_MIN_TOP - amp;
          const mid = Math.min(Math.max(pipe.baseTop, lo), hi);
          pipe.top = mid + Math.sin(playFrames * Lm.motionFreq + pipe.phase) * amp;
        }
      }

      // collisions per living dog
      for (const p of players) {
        if (!p.alive) continue;
        if (p.y + DOG_R * 0.85 >= H - GROUND_H) { killPlayer(p); continue; }
        if (p.y - DOG_R * 0.85 <= 0) { p.y = DOG_R * 0.85; p.v = 0; }
        for (const pipe of pipes) {
          if (hitsPipe(pipe, p)) { killPlayer(p); break; }
        }
      }

      // round ends once every dog is down
      if (players.every(function (p) { return !p.alive; })) endRound();
    }

    // Dead dog keeps dropping until it rests on the ground.
    function settleDead(p) {
      if (p.y < H - GROUND_H - DOG_R) {
        p.v = Math.min(p.v + GRAVITY * dtf, MAX_FALL);
        p.y += p.v * dtf;
        p.angle = Math.min(p.angle + 0.06 * dtf, 1.3);
      } else {
        p.y = H - GROUND_H - DOG_R;
      }
    }

    function hitsPipe(pipe, p) {
      // dog hitbox: shrink generously so near-misses don't kill you
      const dl = p.x - DOG_R * 0.58;
      const dr = p.x + DOG_R * 0.58;
      const dt = p.y - DOG_R * 0.58;
      const db = p.y + DOG_R * 0.58;
      if (dr < pipe.x || dl > pipe.x + PIPE_W) return false;
      if (dt < pipe.top || db > pipe.top + pipe.gap) return true;
      return false;
    }

    // One dog crashed — bank its best for the breed it flew.
    function killPlayer(p) {
      if (!p.alive) return;
      p.alive = false;
      p.deathFrame = frame;
      p.newRecord = p.score > bests[p.breedIndex];
      if (p.newRecord && p.score > 0) {
        bests[p.breedIndex] = p.score;
        saveBests();
      }
    }

    function endRound() {
      state = 'gameover';
      deathFrame = frame;
      // apply any breed unlocked/selected during the run now that the dogs have fallen
      for (let s = 0; s < pendingSkins.length; s++) {
        if (pendingSkins[s] !== null) { equipSkin(s, pendingSkins[s]); pendingSkins[s] = null; }
      }
      refreshShop();   // reflect updated bests on the chips
    }

    // ---- Rendering ----
    // The sky gradient only changes when the level changes — build it once and cache it
    // instead of re-allocating a gradient every frame (a real cost on mobile).
    let _skyGrad = null, _skyLevel = -1;
    function skyGradient(L) {
      if (_skyGrad && _skyLevel === level) return _skyGrad;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, L.sky[0]); g.addColorStop(0.7, L.sky[1]); g.addColorStop(1, L.sky[2]);
      _skyGrad = g; _skyLevel = level; return g;
    }

    function draw() {
      // sky (per level, cached)
      const L = LEVELS[level];
      ctx.fillStyle = skyGradient(L);
      ctx.fillRect(0, 0, W, H);

      // backdrop drifters — clouds / bubbles / stars / snow, per level
      for (const c of clouds) drawDrifter(L.drifter, c);

      // obstacles (style per level)
      for (const p of pipes) drawObstacle(p);

      // treats (floating in the gaps)
      for (const p of pipes) {
        if (p.treat && !p.treat.collected) {
          const tx = p.x + PIPE_W / 2;
          const ty = p.top + p.treat.offY + Math.sin(frame / 12 + p.x / 40) * 3;
          drawTreat(tx, ty);
        }
      }

      // ground (per level)
      drawGroundFor(LEVELS[level].ground);

      // dogs (P1 first so P2 layers on top in 2-player)
      for (const p of players) drawDog(p);

      // Night City — blackout: dim the whole scene in recurring pulses (only mid-run,
      // so the menu/ready screen stays clear). Sits under the score/HUD.
      if (L.mechanic === 'blackout' && state === 'playing') {
        const a = blackoutAlpha(frame);
        if (a > 0.01) {
          ctx.fillStyle = 'rgba(4, 6, 18, ' + a + ')';
          ctx.fillRect(0, 0, W, H);
        }
      }

      // UI overlays
      drawUI();
    }

    function drawCloud(x, y, s) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
      ctx.arc(x + 20 * s, y + 4 * s, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 44 * s, y, 16 * s, 0, Math.PI * 2);
      ctx.arc(x + 22 * s, y - 10 * s, 16 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // A little bone treat with a soft glow.
    function drawTreat(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.35);

      // glow halo
      ctx.fillStyle = 'rgba(255, 240, 180, 0.35)';
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();

      // bone: middle bar + two knobs on each end
      ctx.fillStyle = '#f3e3c0';
      ctx.strokeStyle = '#caa46a';
      ctx.lineWidth = 1.6;
      const L = 9, k = 4.2;
      function knobs(cx) {
        ctx.beginPath();
        ctx.arc(cx, -k, k, 0, Math.PI * 2);
        ctx.arc(cx, k, k, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      // shaft
      ctx.beginPath();
      ctx.fillRect(-L, -3, L * 2, 6);
      ctx.fillRect(-L, -3, L * 2, 6);
      knobs(-L);
      knobs(L);
      ctx.fillStyle = '#f3e3c0';
      ctx.fillRect(-L, -3, L * 2, 6);
      ctx.strokeRect(-L, -3, L * 2, 6);

      // sparkle
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(-3, -1, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawPipe(p) {
      const gapTop = p.top;
      const gapBottom = p.top + p.gap;
      const x = p.x;

      function segment(yTop, yBot, capAtBottom) {
        // body gradient (bone-ish / green pipe) — go for a playful green
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#69b34c');
        g.addColorStop(0.4, '#8fd16a');
        g.addColorStop(0.5, '#a7e07f');
        g.addColorStop(0.6, '#8fd16a');
        g.addColorStop(1, '#4f9437');
        ctx.fillStyle = g;
        ctx.fillRect(x, yTop, PIPE_W, yBot - yTop);
        ctx.strokeStyle = '#3c7a2a';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, yTop, PIPE_W - 3, yBot - yTop);

        // cap (lip)
        const capH = 26;
        const capW = PIPE_W + 12;
        const capX = x - 6;
        const capY = capAtBottom ? yTop : yBot - capH;
        ctx.fillStyle = g;
        ctx.fillRect(capX, capY, capW, capH);
        ctx.strokeRect(capX + 1.5, capY + 1.5, capW - 3, capH - 3);
        // highlight
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(x + 7, yTop, 7, yBot - yTop);
      }

      // top pipe (from 0 down to gapTop), cap at its bottom
      segment(0, gapTop, false);
      // bottom pipe (from gapBottom to ground), cap at its top
      segment(gapBottom, H - GROUND_H, true);
    }

    // Coral Reef obstacle — pink coral columns with a knobbly edge at the gap.
    function drawCoral(p) {
      const gapTop = p.top, gapBottom = p.top + p.gap, x = p.x;
      function column(yTop, yBot, lipAtTop) {
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#c0407a');
        g.addColorStop(0.5, '#ff8fb8');
        g.addColorStop(1, '#b8356f');
        ctx.fillStyle = g;
        ctx.fillRect(x, yTop, PIPE_W, yBot - yTop);
        ctx.strokeStyle = '#9c2e63';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, yTop, PIPE_W - 3, yBot - yTop);
        // light flecks
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        for (let yy = yTop + 14; yy < yBot - 6; yy += 24) {
          ctx.fillRect(x + 12, yy, 5, 5); ctx.fillRect(x + 36, yy + 11, 4, 4);
        }
        // knobbly lip of coral at the gap end
        const lipY = lipAtTop ? yTop : yBot;
        ctx.fillStyle = '#ffb3d1';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.arc(x + 9 + i * 16, lipY, 9, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#ff8fb8';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.arc(x + 9 + i * 16, lipY, 4, 0, Math.PI * 2); ctx.fill();
        }
      }
      column(0, gapTop, false);            // top column, knobs at its bottom edge
      column(gapBottom, H - GROUND_H, true); // bottom column, knobs at its top edge
    }

    function drawGround() {
      const gy = H - GROUND_H;
      // dirt
      ctx.fillStyle = '#caa46a';
      ctx.fillRect(0, gy, W, GROUND_H);
      // grass strip
      ctx.fillStyle = '#7ec850';
      ctx.fillRect(0, gy, W, 16);
      ctx.fillStyle = '#5fae38';
      ctx.fillRect(0, gy + 14, W, 4);
      // little grass tufts scrolling
      ctx.fillStyle = '#9fd96a';
      for (let x = groundX; x < W; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, gy + 16);
        ctx.lineTo(x + 6, gy + 4);
        ctx.lineTo(x + 12, gy + 16);
        ctx.fill();
      }
      // dirt speckles
      ctx.fillStyle = 'rgba(120,84,40,0.5)';
      for (let x = groundX; x < W; x += 24) {
        ctx.fillRect(x + 6, gy + 40, 4, 4);
        ctx.fillRect(x + 16, gy + 60, 3, 3);
      }
    }

    // Rising bubble (Coral Reef backdrop drifter, reuses cloud slots).
    function drawBubble(x, y, s) {
      const r = 10 * s + 6;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#bfefff';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Sandy sea floor for the Coral Reef level.
    function drawSand() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#e6cf94';
      ctx.fillRect(0, gy, W, GROUND_H);
      ctx.fillStyle = '#d9bd76';
      ctx.fillRect(0, gy, W, 14);
      ctx.fillStyle = '#c9a85e';
      ctx.fillRect(0, gy + 12, W, 4);
      // little pebbles/shells scrolling
      ctx.fillStyle = 'rgba(150,110,60,0.45)';
      for (let x = groundX; x < W; x += 24) {
        ctx.fillRect(x + 6, gy + 40, 4, 4);
        ctx.fillRect(x + 16, gy + 60, 3, 3);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let x = groundX; x < W; x += 48) ctx.fillRect(x + 10, gy + 26, 5, 3);
    }

    // ---- Per-level dispatchers (obstacle / ground / backdrop drifter) ----
    function drawObstacle(p) {
      switch (LEVELS[level].obstacle) {
        case 'coral':    return drawCoral(p);
        case 'building': return drawBuilding(p);
        case 'ice':      return drawIce(p);
        case 'candy':    return drawCandy(p);
        case 'crystal':  return drawCrystal(p);
        default:         return drawPipe(p);
      }
    }
    function drawGroundFor(kind) {
      switch (kind) {
        case 'sand':     return drawSand();
        case 'pavement': return drawPavement();
        case 'snow':     return drawSnowGround();
        case 'frosting': return drawFrosting();
        case 'moon':     return drawMoon();
        default:         return drawGround();
      }
    }
    function drawDrifter(kind, c) {
      if (kind === 'bubble')     drawBubble(c.x, c.y, c.s);
      else if (kind === 'star')  drawStar(c.x, c.y, c.s, c.phase || 0);
      else if (kind === 'snow')  drawSnowflake(c.x, c.y, c.s);
      else                       drawCloud(c.x, c.y, c.s);
    }

    // Generic two-column obstacle: runs `body(yTop, yBot, gapEdgeY, dir)` for the top
    // pillar (gap edge at its bottom, decorations point down) and the bottom pillar
    // (gap edge at its top, decorations point up). dir = +1 down, -1 up.
    function eachPillar(p, body) {
      const gapTop = p.top, gapBottom = p.top + p.gap;
      body(0, gapTop, gapTop, 1);                       // top pillar
      body(gapBottom, H - GROUND_H, gapBottom, -1);     // bottom pillar
    }

    // Night City — lit-window skyscrapers with a flat roof cap at the gap.
    function drawBuilding(p) {
      const x = p.x, seed = Math.floor(p.phase * 1000);
      eachPillar(p, function (yTop, yBot, edgeY, dir) {
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#2a3357'); g.addColorStop(0.5, '#3c4775'); g.addColorStop(1, '#222a4a');
        ctx.fillStyle = g; ctx.fillRect(x, yTop, PIPE_W, yBot - yTop);
        ctx.strokeStyle = '#151b32'; ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, yTop, PIPE_W - 3, yBot - yTop);
        // window grid (lit pattern is stable per building via the pipe's seed)
        let row = 0;
        for (let wy = yTop + 12; wy < yBot - 10; wy += 18, row++) {
          let colN = 0;
          for (let wx = x + 9; wx < x + PIPE_W - 9; wx += 16, colN++) {
            const lit = ((row * 7 + colN * 13 + seed) % 7) < 4;
            ctx.fillStyle = lit ? '#ffe08a' : '#1b2240';
            ctx.fillRect(wx, wy, 9, 11);
          }
        }
        // roof cap at the gap edge
        const capH = 14, capX = x - 5, capW = PIPE_W + 10;
        const capY = dir === 1 ? edgeY - capH : edgeY;
        ctx.fillStyle = '#161d36'; ctx.fillRect(capX, capY, capW, capH);
        ctx.strokeStyle = '#0c1024'; ctx.strokeRect(capX + 1.5, capY + 1.5, capW - 3, capH - 3);
      });
    }

    // Snowy Peaks — pale ice columns with icicle spikes pointing into the gap.
    function drawIce(p) {
      const x = p.x;
      eachPillar(p, function (yTop, yBot, edgeY, dir) {
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#9ec9e8'); g.addColorStop(0.5, '#e6f4fc'); g.addColorStop(1, '#86b6dc');
        ctx.fillStyle = g; ctx.fillRect(x, yTop, PIPE_W, yBot - yTop);
        ctx.strokeStyle = '#6f9fc4'; ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, yTop, PIPE_W - 3, yBot - yTop);
        // frosty glints
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        for (let yy = yTop + 14; yy < yBot - 10; yy += 28) ctx.fillRect(x + 11, yy, 4, 12);
        // icicles along the gap edge
        ctx.fillStyle = '#dff1fb';
        for (let i = 0; i < 4; i++) {
          const ix = x + 8 + i * 15, len = 12 + (i % 2) * 8;
          ctx.beginPath();
          ctx.moveTo(ix, edgeY); ctx.lineTo(ix + 12, edgeY); ctx.lineTo(ix + 6, edgeY + dir * len);
          ctx.closePath(); ctx.fill();
        }
      });
    }

    // Candy Land — glossy candy-cane poles with diagonal stripes and a rounded gap end.
    function drawCandy(p) {
      const x = p.x;
      eachPillar(p, function (yTop, yBot, edgeY, dir) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x, yTop, PIPE_W, yBot - yTop); ctx.clip();
        ctx.fillStyle = '#fff'; ctx.fillRect(x, yTop, PIPE_W, yBot - yTop);
        ctx.fillStyle = '#ff5d8f';
        const stripe = 13, period = stripe * 2;
        for (let d = -PIPE_W; d < (yBot - yTop) + PIPE_W; d += period) {
          ctx.beginPath();
          ctx.moveTo(x, yTop + d);
          ctx.lineTo(x + PIPE_W, yTop + d - PIPE_W);
          ctx.lineTo(x + PIPE_W, yTop + d - PIPE_W + stripe);
          ctx.lineTo(x, yTop + d + stripe);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        // glossy highlight + border
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x + 7, yTop, 6, yBot - yTop);
        ctx.strokeStyle = '#d83f72'; ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, yTop, PIPE_W - 3, yBot - yTop);
        // rounded knob at the gap end
        ctx.fillStyle = '#ffd1e3';
        ctx.beginPath();
        ctx.ellipse(x + PIPE_W / 2, edgeY, PIPE_W / 2 + 3, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d83f72'; ctx.stroke();
      });
    }

    // Outer Space — glowing faceted crystals tapering to a point at the gap.
    function drawCrystal(p) {
      const x = p.x;
      eachPillar(p, function (yTop, yBot, edgeY, dir) {
        const tipY = edgeY + dir * 26;
        const cx = x + PIPE_W / 2;
        ctx.save();
        ctx.shadowColor = 'rgba(150,110,255,0.8)'; ctx.shadowBlur = 16;
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#5a32c8'); g.addColorStop(0.5, '#b89bff'); g.addColorStop(1, '#6a3cff');
        ctx.fillStyle = g;
        // body (rectangle from far edge to gap edge) + a triangular tip into the gap
        const bodyTop = dir === 1 ? yTop : edgeY;
        const bodyBot = dir === 1 ? edgeY : yBot;
        ctx.fillRect(x, bodyTop, PIPE_W, bodyBot - bodyTop);
        ctx.beginPath();
        ctx.moveTo(x, edgeY); ctx.lineTo(x + PIPE_W, edgeY); ctx.lineTo(cx, tipY);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // facet seam + sparkle
        ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, Math.min(bodyTop, edgeY)); ctx.lineTo(cx, Math.max(bodyBot, edgeY)); ctx.stroke();
        ctx.strokeStyle = '#3c2299'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, bodyTop, PIPE_W - 2, bodyBot - bodyTop);
      });
    }

    // Night City pavement.
    function drawPavement() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#2b2f44'; ctx.fillRect(0, gy, W, GROUND_H);
      ctx.fillStyle = '#3a3f5c'; ctx.fillRect(0, gy, W, 12);            // kerb
      ctx.fillStyle = '#1e2236'; ctx.fillRect(0, gy + 12, W, 4);
      // dashed road line scrolling
      ctx.fillStyle = '#ffd54f';
      for (let x = groundX; x < W; x += 40) ctx.fillRect(x, gy + 44, 20, 5);
    }

    // Snowy Peaks ground.
    function drawSnowGround() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#eef6fc'; ctx.fillRect(0, gy, W, GROUND_H);
      ctx.fillStyle = '#cfe2f2'; ctx.fillRect(0, gy + 14, W, 5);
      // rolling snow mounds scrolling
      ctx.fillStyle = '#ffffff';
      for (let x = groundX; x < W; x += 60) {
        ctx.beginPath(); ctx.ellipse(x + 30, gy + 10, 34, 14, 0, Math.PI, 0); ctx.fill();
      }
      ctx.fillStyle = 'rgba(160,190,220,0.5)';
      for (let x = groundX; x < W; x += 30) ctx.fillRect(x + 8, gy + 46, 3, 3);
    }

    // Candy Land frosting ground with sprinkles.
    function drawFrosting() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#fff0f6'; ctx.fillRect(0, gy, W, GROUND_H);
      // wavy frosting top edge
      ctx.fillStyle = '#ff8ec0';
      ctx.beginPath(); ctx.moveTo(0, gy + 6);
      for (let x = 0; x <= W; x += 20) ctx.quadraticCurveTo(x + 10, gy - 6, x + 20, gy + 6);
      ctx.lineTo(W, gy + 22); ctx.lineTo(0, gy + 22); ctx.closePath(); ctx.fill();
      // sprinkles scrolling
      const cols = ['#ff5d8f', '#ffd54f', '#6ad1ff', '#7be39a'];
      for (let x = groundX; x < W; x += 22) {
        ctx.fillStyle = cols[(Math.abs(Math.round(x)) / 22 | 0) % cols.length];
        ctx.fillRect(x + 6, gy + 40, 7, 3);
        ctx.fillStyle = cols[(Math.abs(Math.round(x)) / 22 + 2 | 0) % cols.length];
        ctx.fillRect(x + 15, gy + 60, 3, 7);
      }
    }

    // Outer Space moon-rock ground with craters.
    function drawMoon() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#3a3550'; ctx.fillRect(0, gy, W, GROUND_H);
      ctx.fillStyle = '#4a4566'; ctx.fillRect(0, gy, W, 12);
      ctx.fillStyle = '#2c2840';
      for (let x = groundX; x < W; x += 70) {
        ctx.beginPath(); ctx.ellipse(x + 26, gy + 34, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 54, gy + 60, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Twinkling star backdrop (Night City + Outer Space).
    function drawStar(x, y, s, phase) {
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + phase);
      ctx.save();
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, 1.3 * s + 0.6, 0, Math.PI * 2); ctx.fill();
      if (s > 1.05) {                       // bigger stars get a sparkle cross
        ctx.strokeStyle = 'rgba(255,255,255,' + (tw * 0.7) + ')'; ctx.lineWidth = 1;
        const r = 3 * s;
        ctx.beginPath();
        ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
        ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Falling snowflake (Snowy Peaks).
    function drawSnowflake(x, y, s) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, 2 * s + 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Lighten a #rrggbb color toward white by amt (0..1).
    function tint(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const f = c => Math.round(c + (255 - c) * amt);
      return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
    }

    // Costume accessories, drawn in dog-local space (head centered near hx, hy).
    function drawCostumeOverlay(id, hx, hy) {
      ctx.save();
      if (id === 'party') {
        ctx.fillStyle = '#ff5d8f';
        ctx.beginPath();
        ctx.moveTo(hx - 11, hy - 9); ctx.lineTo(hx + 7, hy - 11); ctx.lineTo(hx - 3, hy - 32);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(hx - 7, hy - 16); ctx.lineTo(hx + 2, hy - 17);
        ctx.moveTo(hx - 5, hy - 22); ctx.lineTo(hx + 1, hy - 23);
        ctx.stroke();
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath(); ctx.arc(hx - 3, hy - 32, 3, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'tophat') {
        ctx.fillStyle = '#26262e';
        ctx.beginPath(); ctx.ellipse(hx - 1, hy - 11, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(hx - 8, hy - 27, 15, 17);
        ctx.beginPath(); ctx.ellipse(hx - 0.5, hy - 27, 7.5, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e94560';
        ctx.fillRect(hx - 8, hy - 16, 15, 4);
      } else if (id === 'crown') {
        const by = hy - 11;
        ctx.fillStyle = '#ffcf3f';
        ctx.beginPath();
        ctx.moveTo(hx - 11, by); ctx.lineTo(hx - 11, by - 6); ctx.lineTo(hx - 6, by - 1);
        ctx.lineTo(hx - 1, by - 8); ctx.lineTo(hx + 4, by - 1); ctx.lineTo(hx + 8, by - 6);
        ctx.lineTo(hx + 8, by); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e94560';
        ctx.beginPath(); ctx.arc(hx - 1, by - 2, 1.6, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'shades') {
        ctx.fillStyle = '#1c1c22';
        ctx.beginPath(); ctx.ellipse(hx + 5, hy - 2, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + 14, hy - 1, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1c1c22'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(hx + 9.5, hy - 2.5); ctx.lineTo(hx + 11, hy - 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx + 0.5, hy - 3); ctx.lineTo(hx - 6, hy - 5); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(hx + 3, hy - 4); ctx.lineTo(hx + 6, hy - 1); ctx.stroke();
      } else if (id === 'bandana') {
        ctx.fillStyle = '#e94560';
        ctx.beginPath();
        ctx.moveTo(hx - 10, hy + 7); ctx.lineTo(hx + 4, hy + 9); ctx.lineTo(hx - 5, hy + 20);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + 2, hy + 9, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(hx - 5, hy + 11, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx - 1, hy + 14, 1.3, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'bowtie') {
        const cxb = hx - 2, cyb = hy + 11;
        ctx.fillStyle = '#5b8cff';
        ctx.beginPath();
        ctx.moveTo(cxb, cyb); ctx.lineTo(cxb - 9, cyb - 5); ctx.lineTo(cxb - 9, cyb + 5);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cxb, cyb); ctx.lineTo(cxb + 9, cyb - 5); ctx.lineTo(cxb + 9, cyb + 5);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#3f6bd6';
        ctx.fillRect(cxb - 2, cyb - 3, 4, 6);
      } else if (id === 'cowboy') {
        ctx.fillStyle = '#9c6b34';
        ctx.beginPath(); ctx.ellipse(hx - 1, hy - 10, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hx - 8, hy - 10);
        ctx.quadraticCurveTo(hx - 8, hy - 22, hx - 1, hy - 22);
        ctx.quadraticCurveTo(hx + 6, hy - 22, hx + 6, hy - 10);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5c3720';
        ctx.fillRect(hx - 8, hy - 14, 14, 3);
      } else if (id === 'beanie') {
        ctx.fillStyle = '#4a8fd6';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 8, 11, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e94560';
        ctx.fillRect(hx - 12, hy - 9, 22, 4);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 20, 3, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'wizard') {
        ctx.fillStyle = '#5b4b9e';
        ctx.beginPath();
        ctx.moveTo(hx - 12, hy - 9); ctx.lineTo(hx + 8, hy - 10); ctx.lineTo(hx - 6, hy - 34);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx - 2, hy - 9, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath(); ctx.arc(hx - 4, hy - 18, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx - 6, hy - 26, 1.3, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'headphones') {
        ctx.strokeStyle = '#26262e'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(hx, hy, 17, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
        ctx.fillStyle = '#e94560';
        ctx.beginPath(); ctx.ellipse(hx - 14, hy - 1, 3.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + 12, hy - 2, 3.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'halo') {
        ctx.strokeStyle = 'rgba(255,240,140,0.5)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(hx - 1, hy - 19, 9, 3.5, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(hx - 1, hy - 19, 9, 3.5, 0, 0, Math.PI * 2); ctx.stroke();
      } else if (id === 'scarf') {
        ctx.fillStyle = '#cf4f4f';
        ctx.beginPath(); ctx.ellipse(hx - 6, hy + 10, 11, 5, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(hx - 3, hy + 10, 5, 14);
        ctx.fillStyle = '#fff';
        ctx.fillRect(hx - 3, hy + 19, 5, 2);
        ctx.fillRect(hx - 3, hy + 22, 5, 2);
      } else if (id === 'santa') {
        ctx.fillStyle = '#e23b3b';
        ctx.beginPath();
        ctx.moveTo(hx - 11, hy - 9); ctx.lineTo(hx + 9, hy - 10); ctx.lineTo(hx - 7, hy - 30);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';   // brim
        ctx.beginPath(); ctx.ellipse(hx - 1, hy - 10, 13, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx - 7, hy - 30, 3.5, 0, Math.PI * 2); ctx.fill();  // pom
      } else if (id === 'flowers') {
        const fy = hy - 11, cols = ['#ff7aa8', '#ffd24a', '#9b7bff', '#74d6a0'];
        for (let i = 0; i < 4; i++) {
          const fx = hx - 11 + i * 7;
          ctx.fillStyle = cols[i % cols.length];
          for (let p = 0; p < 5; p++) {
            const a = p / 5 * Math.PI * 2;
            ctx.beginPath(); ctx.arc(fx + Math.cos(a) * 2.2, fy + Math.sin(a) * 2.2, 1.6, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = '#fff3b0';
          ctx.beginPath(); ctx.arc(fx, fy, 1.3, 0, Math.PI * 2); ctx.fill();
        }
      } else if (id === 'grad') {
        ctx.fillStyle = '#26262e';
        ctx.fillRect(hx - 8, hy - 14, 16, 6);   // cap base
        ctx.beginPath();                         // mortarboard
        ctx.moveTo(hx - 1, hy - 20); ctx.lineTo(hx + 15, hy - 14);
        ctx.lineTo(hx - 1, hy - 8); ctx.lineTo(hx - 17, hy - 14);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ffcf3f'; ctx.lineWidth = 1.4;  // tassel
        ctx.beginPath(); ctx.moveTo(hx - 1, hy - 14); ctx.lineTo(hx + 13, hy - 12); ctx.lineTo(hx + 13, hy - 4); ctx.stroke();
        ctx.fillStyle = '#ffcf3f';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 14, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + 13, hy - 3, 2, 0, Math.PI * 2); ctx.fill();
      } else if (id === 'chef') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(hx - 7, hy - 17, 5, 0, Math.PI * 2);
        ctx.arc(hx + 1, hy - 21, 6, 0, Math.PI * 2);
        ctx.arc(hx + 8, hy - 17, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(hx - 9, hy - 15, 18, 6);   // band
        ctx.strokeStyle = '#e1e1e1'; ctx.lineWidth = 1; ctx.strokeRect(hx - 9, hy - 15, 18, 6);
      } else if (id === 'antlers') {
        ctx.strokeStyle = '#9c6b34'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        for (const dir of [-1, 1]) {
          const bx = hx + dir * 5, by = hy - 10;
          ctx.beginPath();
          ctx.moveTo(bx, by); ctx.lineTo(bx + dir * 4, by - 13);
          ctx.moveTo(bx + dir * 2, by - 6); ctx.lineTo(bx + dir * 7, by - 8);
          ctx.moveTo(bx + dir * 3, by - 10); ctx.lineTo(bx + dir * 8, by - 13);
          ctx.stroke();
        }
      } else if (id === 'bunny') {
        for (const e of [[-5, -0.15], [5, 0.15]]) {
          ctx.save();
          ctx.translate(hx + e[0], hy - 12); ctx.rotate(e[1]);
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.ellipse(0, -6, 3.5, 11, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffb6c8';
          ctx.beginPath(); ctx.ellipse(0, -6, 1.6, 8, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      } else if (id === 'devil') {
        ctx.fillStyle = '#d23b3b';
        for (const dx of [-7, 7]) {
          ctx.beginPath();
          ctx.moveTo(hx + dx - 2.5, hy - 9);
          ctx.quadraticCurveTo(hx + dx, hy - 19, hx + dx + 3, hy - 9);
          ctx.closePath(); ctx.fill();
        }
      } else if (id === 'glasses') {
        ctx.strokeStyle = '#3a2e22'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(hx + 5, hy - 2, 4.6, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(hx + 14, hy - 1, 4, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx + 9.5, hy - 2); ctx.lineTo(hx + 10.3, hy - 1.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx + 0.6, hy - 3); ctx.lineTo(hx - 5, hy - 5); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(hx + 5, hy - 2, 4.6, Math.PI * 1.05, Math.PI * 1.5); ctx.stroke();
      } else if (id === 'cap') {
        ctx.fillStyle = '#3f6bd6';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 8, 11, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + 12, hy - 8, 9, 3.2, 0, 0, Math.PI * 2); ctx.fill();  // brim
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 17, 1.8, 0, Math.PI * 2); ctx.fill();   // button
      } else if (id === 'viking') {
        ctx.fillStyle = '#9aa3b0';
        ctx.beginPath(); ctx.arc(hx - 1, hy - 8, 11, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#7b8694'; ctx.fillRect(hx - 12, hy - 9, 22, 3);
        ctx.fillStyle = '#f0e6cf';
        for (const dir of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(hx + dir * 9, hy - 9);
          ctx.quadraticCurveTo(hx + dir * 18, hy - 13, hx + dir * 15, hy - 22);
          ctx.quadraticCurveTo(hx + dir * 12, hy - 15, hx + dir * 8, hy - 12);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.restore();
    }

    // The dog, drawn procedurally from the current `skin`, centered on (cx, cy).
    // Each breed's traits (build / snout / coat / ears / tail) reshape the same
    // base pup into a recognizable silhouette.
    // A New York Knicks jersey hugged to the dog's torso. Called from inside drawDog,
    // so it draws in the dog's local (translated + rotated) frame.
    function drawDogJersey(bodyCY, bodyRX, bodyRY) {
      ctx.save();
      // clip to the body ellipse so the jersey conforms to the torso like a tank top
      ctx.beginPath(); ctx.ellipse(-2, bodyCY, bodyRX, bodyRY, 0, 0, Math.PI * 2); ctx.clip();
      const top = bodyCY - bodyRY * 0.3;          // shoulders show above this
      ctx.fillStyle = '#006bb6';                  // Knicks blue
      ctx.fillRect(-2 - bodyRX, top, bodyRX * 2, bodyRY * 2);
      ctx.fillStyle = '#f58426';                  // Knicks orange trim
      ctx.fillRect(-2 - bodyRX, top, bodyRX * 2, Math.max(2, bodyRY * 0.16));               // neckline stripe
      ctx.fillRect(-2 - bodyRX, bodyCY + bodyRY * 0.66, bodyRX * 2, Math.max(2, bodyRY * 0.16)); // hem
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.font = '800 ' + Math.round(bodyRY * 0.85) + 'px Nunito, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('NY', -3, bodyCY + bodyRY * 0.18);
    }

    function drawDog(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      const legSwing = p.flapAnim > 0 ? Math.sin((10 - p.flapAnim) / 10 * Math.PI) * 6 : 0;
      const s = p.skin;
      const build = s.build || 'normal';
      const snoutT = s.snout || 'med';
      const coat = s.coat || 'smooth';
      const tailT = s.tail || 'plume';
      const twoTone = s.patch !== s.body;   // does this breed carry a marking colour

      // --- body proportions by build ---
      let bodyRX = 26, bodyRY = 17, bodyCY = 4, legRY = 9, backLegY = 12, frontLegY = 14;
      let headRX = 17, headRY = 15;
      if (build === 'long') {            // dachshund / corgi: very low & stretched
        bodyRX = 34; bodyRY = 12; bodyCY = 7; legRY = 6; backLegY = 16; frontLegY = 17;
        headRX = 16; headRY = 14;
      } else if (build === 'tall') {     // greyhound / dane / doberman: lean & leggy
        bodyRX = 19; bodyRY = 19; bodyCY = 1; legRY = 16; backLegY = 13; frontLegY = 15;
        headRX = 15; headRY = 14;
      } else if (build === 'stocky') {   // pug / bulldog / boxer: broad & blocky, big head
        bodyRX = 29; bodyRY = 20; bodyCY = 5; legRY = 7; backLegY = 15; frontLegY = 16;
        headRX = 19; headRY = 17;
      }

      // --- shadow under body ---
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath();
      ctx.ellipse(0, 22, bodyRX, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- back legs ---
      ctx.fillStyle = s.body;
      stubLeg(-12, backLegY + legSwing, legRY);
      stubLeg(10, backLegY - legSwing, legRY);

      // --- body ---
      ctx.fillStyle = s.body;
      ctx.beginPath();
      ctx.ellipse(-2, bodyCY, bodyRX, bodyRY, 0, 0, Math.PI * 2);
      ctx.fill();

      // saddle / marking over the back (skip for tan-point breeds: their backs stay dark)
      if (twoTone && !s.points) {
        ctx.fillStyle = s.patch;
        ctx.beginPath();
        ctx.ellipse(-6, bodyCY - 8, bodyRX * 0.68, bodyRY * 0.6, 0, Math.PI * 1.02, Math.PI * 1.98);
        ctx.fill();
      }

      // spots (dalmatian / blue heeler)
      if (s.spots) {
        const heeler = s.name === 'Blue Heeler';
        ctx.fillStyle = heeler ? 'rgba(42,46,56,0.55)' : '#2b2b2b';
        const r = heeler ? 1 : 1.25;   // dalmatian wears bigger, bolder spots
        spot(-16, 2, 3.6 * r); spot(-4, 9, 3 * r); spot(8, -2, 3.2 * r);
        spot(-9, -4, 2.6 * r); spot(-22, 6, 2.8 * r); spot(16, 6, 2.6 * r);
      }

      // --- tail (in front of the body so curls read clearly) ---
      drawTail(tailT);

      // --- front legs ---
      ctx.fillStyle = s.body;
      stubLeg(2, frontLegY - legSwing, legRY);
      stubLeg(16, frontLegY + legSwing, legRY);

      // Knicks jersey worn over the torso (drawn here where body proportions are known)
      if (p.costume === 'knicks') drawDogJersey(bodyCY, bodyRX, bodyRY);

      // fluffy chest ruff (samoyed / pomeranian / collie ...)
      if (coat === 'fluffy') {
        ctx.fillStyle = tint(s.body, 0.12);
        puff(13, -3, 6); puff(16, 4, 6); puff(15, 11, 5); puff(9, 8, 5);
      }
      // curly poodle coat — scalloped puffs over body + leg poofs
      if (coat === 'curly') {
        ctx.fillStyle = tint(s.body, 0.06);
        puff(-22, -5, 7); puff(-12, -9, 8); puff(0, -9, 8); puff(12, -6, 7);
        puff(-17, 9, 6); puff(-3, 12, 6); puff(11, 9, 6);
        ctx.fillStyle = s.body;
        puff(-11, backLegY + 7, 5); puff(15, frontLegY + 7, 5);
      }

      // --- head ---
      const hx = 22, hy = -8;
      drawEars(hx, hy);

      // head shape (size varies with build)
      ctx.fillStyle = s.body;
      ctx.beginPath();
      ctx.ellipse(hx, hy, headRX, headRY, 0, 0, Math.PI * 2);
      ctx.fill();
      // marking over top of head (cap / blaze) — tan-point breeds keep a dark head
      if (twoTone && !s.points) {
        ctx.fillStyle = s.patch;
        ctx.beginPath();
        ctx.ellipse(hx, hy - 4, 16, 10, 0, Math.PI * 1.05, Math.PI * 1.95);
        ctx.fill();
      }

      // husky / boxer-style mask over the forehead / around the eye
      if (s.mask) {
        ctx.fillStyle = s.mask;
        ctx.beginPath();
        ctx.ellipse(hx, hy - 5, 14, 8, 0, Math.PI * 1.05, Math.PI * 1.95);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(hx + 4, hy - 1, 6, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // tan eyebrow pips — the giveaway marking on black-and-tan breeds
      if (s.points) {
        ctx.fillStyle = s.patch;
        ctx.beginPath(); ctx.arc(hx + 2, hy - 7, 1.9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + 9, hy - 7, 1.9, 0, Math.PI * 2); ctx.fill();
      }

      // curly topknot / fluffy face for the fluffiest breeds
      if (coat === 'curly') {
        ctx.fillStyle = tint(s.body, 0.06);
        puff(hx - 6, hy - 11, 6); puff(hx + 4, hy - 13, 6); puff(hx + 12, hy - 8, 5);
      } else if (coat === 'fluffy') {
        ctx.fillStyle = tint(twoTone ? s.patch : s.body, 0.1);
        puff(hx - 11, hy + 3, 5); puff(hx - 8, hy + 9, 4);
      }

      // --- snout geometry by type ---
      let snX = hx + 13, snRX = 10, snRY = 8, snY = hy + 3, noseX = hx + 22, noseY = hy + 2;
      if (snoutT === 'flat')       { snX = hx + 9;  snRX = 9;  snRY = 8.5; snY = hy + 4; noseX = hx + 15; noseY = hy + 3; }
      else if (snoutT === 'short') { snX = hx + 11; snRX = 8;  snRY = 7;   snY = hy + 3; noseX = hx + 18; noseY = hy + 2; }
      else if (snoutT === 'long')  { snX = hx + 17; snRX = 12; snRY = 6;   snY = hy + 3; noseX = hx + 28; noseY = hy + 2; }

      // snout (lighter muzzle, jutting forward) — keeps dark breeds from being a blob
      ctx.fillStyle = twoTone ? tint(s.patch, 0.5) : tint(s.body, 0.2);
      ctx.beginPath();
      ctx.ellipse(snX, snY, snRX, snRY, 0, 0, Math.PI * 2);
      ctx.fill();

      // nose
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath();
      ctx.ellipse(noseX, noseY, 4, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      // nose shine
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(noseX - 1, noseY - 1, 1, 0, Math.PI * 2);
      ctx.fill();

      // tongue (little, while still alive)
      if (p.alive) {
        ctx.fillStyle = '#ff8aa0';
        ctx.beginPath();
        ctx.ellipse(noseX - 4, hy + 9, 3, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // eye
      ctx.fillStyle = '#2b2b2b';
      if (!p.alive) {
        // x_x eyes
        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = 2;
        cross(hx + 4, hy - 2, 3);
      } else {
        ctx.beginPath();
        ctx.arc(hx + 5, hy - 2, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(hx + 6.2, hy - 3.2, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // cheek blush
      ctx.fillStyle = 'rgba(255,150,160,0.35)';
      ctx.beginPath();
      ctx.arc(hx + 2, hy + 6, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // costume on top
      if (p.costume) {
        drawCostumeOverlay(p.costume, hx, hy);
      }

      ctx.restore();

      // ---- nested helpers ----
      function stubLeg(lx, ly, ry) {
        ctx.beginPath();
        ctx.ellipse(lx, ly, 6, ry || 9, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      function puff(px, py, r) {
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      function drawTail(type) {
        ctx.save();
        ctx.lineCap = 'round';
        if (type === 'thin') {                 // whippy greyhound/doberman tail
          ctx.strokeStyle = s.body;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-22, 2);
          ctx.quadraticCurveTo(-34, 2, -36, 12);
          ctx.stroke();
        } else if (type === 'curl') {          // curled over the back (spitz breeds)
          ctx.strokeStyle = s.body;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(-25, -12, 8, Math.PI * 0.35, Math.PI * 2.0);
          ctx.stroke();
          ctx.fillStyle = twoTone ? tint(s.patch, 0.2) : tint(s.body, 0.12);
          puff(-25, -20, 4.5);
        } else if (type === 'pom') {           // poodle pom on a thin tail
          ctx.strokeStyle = s.body; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-33, -7); ctx.stroke();
          ctx.fillStyle = tint(s.body, 0.06);
          puff(-35, -9, 6);
        } else {                               // plume (default fluffy tail)
          ctx.fillStyle = s.body;
          ctx.beginPath();
          ctx.ellipse(-26, -2, 9, 7, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = (twoTone && !s.points) ? s.patch : tint(s.body, 0.15);
          ctx.beginPath();
          ctx.ellipse(-31, -5, 5, 4, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      function drawEars(hx, hy) {
        // tan-point breeds (rottweiler, doberman...) keep dark ears, not tan ones
        const earCol = (twoTone && !s.points) ? s.patch : s.body;
        if (s.ear === 'pointy') {
          const sc = s.earBig ? 1.55 : 1;
          ctx.fillStyle = earCol;
          ear(hx - 4, hy - 12, -0.25, sc);
          ear(hx + 10, hy - 13, 0.25, sc);
          ctx.fillStyle = tint(earCol, 0.4);  // inner ear
          ear(hx - 4, hy - 9, -0.25, 0.55 * sc);
          ear(hx + 10, hy - 10, 0.25, 0.55 * sc);
        } else if (s.earSmall) {            // small folded "rose" ears (greyhound, bulldog, boxer...)
          ctx.fillStyle = (twoTone && !s.points) ? s.patch : tint(s.body, 0.04);
          smallEar(hx - 11, hy - 5, -0.6);
          smallEar(hx + 11, hy - 6, 0.6);
        } else {
          ctx.fillStyle = earCol;
          floppyEar(hx - 13, hy + 1, -0.5, s.earLong);
          floppyEar(hx + 13, hy, 0.5, s.earLong);
        }
      }
      function ear(ex, ey, tilt, scale) {
        scale = scale || 1;
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(tilt);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.quadraticCurveTo(-7, -4, 0, -14);
        ctx.quadraticCurveTo(7, -4, 0, 10);
        ctx.fill();
        ctx.restore();
      }
      function floppyEar(ex, ey, tilt, long) {
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(tilt);
        ctx.beginPath();
        if (long) ctx.ellipse(0, 13, 7, 20, 0, 0, Math.PI * 2);   // long hound ears (beagle, basset...)
        else ctx.ellipse(0, 7, 6.5, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      function smallEar(ex, ey, tilt) {
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(tilt);
        ctx.beginPath();
        ctx.ellipse(0, 2, 5, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      function spot(sx, sy, r) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, r, r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      function cross(x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
        ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r);
        ctx.stroke();
      }
    }

    const P1_COLOR = '#ffe8b0';
    const P2_COLOR = '#8fd0ff';

    // A small colour-coded score readout (used for the two players in 2P).
    function scoreTag(x, label, val, color) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.font = "800 13px 'Nunito', sans-serif";
      ctx.fillStyle = color;
      ctx.strokeText(label, x, 52); ctx.fillText(label, x, 52);
      ctx.font = "800 40px 'Nunito', sans-serif";
      ctx.fillStyle = '#fff';
      ctx.strokeText(val, x, 92); ctx.fillText(val, x, 92);
      ctx.restore();
    }

    function drawUI() {
      ctx.textAlign = 'center';

      if (state === 'playing' || state === 'gameover') {
        // live score(s) at the top
        if (state === 'playing') {
          if (numPlayers === 2) {
            scoreTag(W * 0.33, 'P1', players[0].score, P1_COLOR);
            scoreTag(W * 0.67, 'P2', players[1].score, P2_COLOR);
          } else {
            ctx.font = "800 52px 'Nunito', sans-serif";
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.fillStyle = '#fff';
            ctx.strokeText(players[0].score, W / 2, 90);
            ctx.fillText(players[0].score, W / 2, 90);
          }
        }

        // shared treat counter (top-left)
        ctx.save();
        drawTreat(30, 34);
        ctx.textAlign = 'left';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.font = "800 22px 'Nunito', sans-serif";
        ctx.strokeText('×' + treats, 46, 42);
        ctx.fillStyle = '#fff';
        ctx.fillText('×' + treats, 46, 42);
        ctx.restore();
        ctx.textAlign = 'center';
      }

      // "new breed!" toast
      if (unlockName && frame < unlockUntil) {
        const a = Math.min(1, (unlockUntil - frame) / 30);  // fade out at the end
        ctx.save();
        ctx.globalAlpha = a;
        const tw = 230, th = 50, ty = 120;
        ctx.fillStyle = 'rgba(233, 69, 96, 0.94)';
        roundRect(W / 2 - tw / 2, ty, tw, th, 16);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = "800 16px 'Nunito', sans-serif";
        ctx.fillText('Unlocked!', W / 2, ty + 20);
        ctx.fillStyle = '#ffe8b0';
        ctx.font = "800 17px 'Nunito', sans-serif";
        ctx.fillText('🐾 ' + unlockName, W / 2, ty + 40);
        ctx.restore();
      }

      if (state === 'ready') {
        panel(W / 2, H * 0.6, 300, 196, function () {
          const cy0 = H * 0.6;
          ctx.fillStyle = '#fff';
          ctx.font = "800 26px 'Nunito', sans-serif";
          ctx.fillText('Flappy Dog', W / 2, cy0 - 62);
          ctx.fillStyle = '#ffe8b0';
          ctx.font = "800 15px 'Nunito', sans-serif";
          ctx.fillText(numPlayers === 2 ? '2 Players — race a friend!' : '1 Player', W / 2, cy0 - 36);
          ctx.fillStyle = '#9fe0f5';
          ctx.font = "700 14px 'Nunito', sans-serif";
          if (numPlayers === 2) {
            ctx.fillText('P1: Space / ↑ / tap bottom', W / 2, cy0 - 12);
            ctx.fillText('P2: Right Ctrl / tap top', W / 2, cy0 + 8);
            ctx.fillStyle = '#cfd6ea';
            ctx.font = "700 13px 'Nunito', sans-serif";
            ctx.fillText(players[0].skin.name + '  vs  ' + players[1].skin.name, W / 2, cy0 + 32);
          } else {
            ctx.fillText('Tap / Space / ↑ to flap', W / 2, cy0 - 12);
            ctx.fillText('Collect bones → unlock breeds', W / 2, cy0 + 8);
            ctx.fillStyle = '#cfd6ea';
            ctx.font = "700 13px 'Nunito', sans-serif";
            ctx.fillText("You're a " + BREEDS[skins[0]].name + '  ·  Best: ' + bests[skins[0]], W / 2, cy0 + 32);
          }
          // this level's unique mechanic (level name is shown in the shop's Levels list)
          ctx.fillStyle = '#ffd27d';
          ctx.font = "800 13px 'Nunito', sans-serif";
          ctx.fillText('✦ ' + LEVELS[level].tagline, W / 2, cy0 + 60);
        });
      }

      if (state === 'gameover' && numPlayers === 2) {
        const a = players[0].score, b = players[1].score;
        panel(W / 2, H * 0.45, 300, 200, function () {
          const cy0 = H * 0.45;
          ctx.fillStyle = '#fff';
          ctx.font = "800 28px 'Nunito', sans-serif";
          ctx.fillText('Game Over', W / 2, cy0 - 60);
          ctx.font = "800 22px 'Nunito', sans-serif";
          ctx.fillStyle = P1_COLOR; ctx.fillText('P1  ' + a, W / 2 - 58, cy0 - 22);
          ctx.fillStyle = P2_COLOR; ctx.fillText('P2  ' + b, W / 2 + 58, cy0 - 22);
          ctx.font = "800 22px 'Nunito', sans-serif";
          ctx.fillStyle = '#ffd54f';
          ctx.fillText(a === b ? "It's a tie!" : (a > b ? '🏆 ' + playerName(0, 'Player 1') + ' wins!' : '🏆 ' + playerName(1, 'Player 2') + ' wins!'), W / 2, cy0 + 14);
          ctx.fillStyle = '#9fe0f5';
          ctx.font = "700 13px 'Nunito', sans-serif";
          ctx.fillText(players[0].skin.name + '  vs  ' + players[1].skin.name, W / 2, cy0 + 42);
          ctx.fillStyle = '#9fe0f5';
          ctx.font = "800 14px 'Nunito', sans-serif";
          ctx.fillText('Tap to play again', W / 2, cy0 + 68);
        });
      }

      if (state === 'gameover' && numPlayers === 1) {
        const p = players[0];
        panel(W / 2, H * 0.46, 290, 210, function () {
          const cy0 = H * 0.46;
          ctx.fillStyle = '#fff';
          ctx.font = "800 30px 'Nunito', sans-serif";
          ctx.fillText('Game Over', W / 2, cy0 - 66);

          ctx.font = "800 20px 'Nunito', sans-serif";
          ctx.fillStyle = '#ffe8b0';
          ctx.fillText('Score', W / 2, cy0 - 30);
          ctx.fillStyle = '#fff';
          ctx.font = "800 34px 'Nunito', sans-serif";
          ctx.fillText(p.score, W / 2, cy0 + 2);

          if (p.newRecord && p.score > 0) {
            ctx.fillStyle = '#ffd54f';
            ctx.font = "800 15px 'Nunito', sans-serif";
            ctx.fillText('🏆 New ' + BREEDS[p.breedIndex].name + ' best!', W / 2, cy0 + 28);
          } else {
            ctx.font = "700 15px 'Nunito', sans-serif";
            ctx.fillStyle = '#cfd6ea';
            ctx.fillText(BREEDS[p.breedIndex].name + ' best: ' + bests[p.breedIndex] + '   ·   🦴 ' + treats, W / 2, cy0 + 28);
          }

          ctx.fillStyle = '#9fe0f5';
          ctx.font = "800 14px 'Nunito', sans-serif";
          ctx.fillText("You're a " + BREEDS[skins[0]].name, W / 2, cy0 + 52);

          ctx.fillStyle = '#9fe0f5';
          ctx.font = "700 15px 'Nunito', sans-serif";
          ctx.fillText('Tap to play again', W / 2, cy0 + 80);
        });
      }
    }

    function panel(cx, cy, w, h, drawContent) {
      const x = cx - w / 2, y = cy - h / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(20, 24, 48, 0.78)';
      roundRect(x, y, w, h, 18);
      ctx.fill();
      ctx.strokeStyle = 'rgba(233, 69, 96, 0.6)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 18);
      ctx.stroke();
      ctx.restore();
      drawContent();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---- Main loop ----
    function loop(ts) {
      if (ts == null) ts = lastTs + 16.6667;
      dtf = Math.min(Math.max((ts - lastTs) / 16.6667, 0.25), 2.2);  // vs 60fps; clamp tab-switch/low-fps
      lastTs = ts;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    loop();
  })();
  </script>

  <script>
    // On desktop the homepage loads this game in a pane. Hide only the "‹ Games" back link
    // (it would reload the homepage inside the pane) while keeping the Pacifico game title
    // visible. Standalone/mobile (top-level) pages keep the full topbar.
    if (window.self !== window.top) {
      var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
    }
  </script>
</body>
