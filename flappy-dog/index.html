<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Dog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .back {
      color: #a0a8c0;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 12px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .back:hover { color: #fff; background: rgba(255,255,255,0.06); }

    .title {
      font-family: 'Pacifico', cursive;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
    }

    .layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 740px;
    }

    .game-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
    }

    .stage {
      position: relative;
      height: min(600px, 78vh);
      max-width: 100%;
      aspect-ratio: 400 / 600;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 2px solid #0f3460;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      margin-top: 14px;
      color: #a0a8c0;
      font-size: 0.85rem;
      text-align: center;
      max-width: 400px;
    }

    .shop {
      flex: 1 1 260px;
      max-width: 300px;
      align-self: stretch;
      max-height: min(600px, 78vh);
      overflow-y: auto;
      padding-right: 4px;
    }

    .players-toggle {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .seg {
      flex: 1;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      color: #cfd6ea;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 8px 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .seg.active {
      border-color: #e94560;
      color: #fff;
      background: #1f2b50;
      box-shadow: 0 0 12px rgba(233, 69, 96, 0.3);
    }

    @media (max-width: 720px) {
      html, body { overflow: auto; }
      body { justify-content: flex-start; }
      .layout { flex-direction: column; align-items: center; gap: 14px; }
      .stage { height: auto; width: 100%; max-width: 400px; }
      .shop { width: 100%; max-width: 400px; max-height: none; overflow: visible; flex: none; }
    }

    .bones-bar {
      text-align: center;
      color: #ffe8b0;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .shop-section {
      margin-bottom: 12px;
    }

    .shop-label {
      color: #a0a8c0;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .shop-label b { color: #ffe8b0; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      color: #cfd6ea;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 6px 11px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .chip:hover:not(:disabled) {
      border-color: #e94560;
      color: #fff;
    }

    .chip.active {
      border-color: #e94560;
      color: #fff;
      background: #1f2b50;
      box-shadow: 0 0 12px rgba(233, 69, 96, 0.3);
    }

    /* affordable purchase — green nudge */
    .chip.buy {
      color: #bdf0c0;
      border-color: #2f7d46;
    }

    .chip.buy:hover:not(:disabled) {
      border-color: #46c46a;
      color: #fff;
      background: #1c3526;
    }

    .chip:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ---------- start dialog (shared format) ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 28, 0.86);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .overlay[hidden] { display: none; }
    .panel {
      width: 100%;
      max-width: 380px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 24px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }
    .panel h2 {
      font-family: 'Pacifico', cursive;
      color: #fff;
      font-size: 1.7rem;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .panel .sub { color: #a0a8c0; font-size: 0.9rem; margin-bottom: 18px; }
    .panel .group-label { color: #ffe8b0; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin: 16px 0 8px; }
    .choices { display: flex; gap: 10px; justify-content: center; }
    .choice {
      flex: 1;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: #cfd6ea;
      background: #0f1830;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 14px 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .choice .big { display: block; font-size: 1.5rem; line-height: 1.2; color: #fff; }
    .choice .small { display: block; font-size: 0.68rem; color: #8b93b0; font-weight: 700; margin-top: 2px; }
    .choice:hover { border-color: #6f86c4; }
    .choice:active { transform: scale(0.96); }
    .choice.selected {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      color: #fff;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.25);
    }
    .choice.selected .small { color: #ffb3c2; }
    .start-btn {
      margin-top: 22px;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      background: #e94560;
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b22a44;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b22a44; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html" class="back">‹ Games</a>
    <span class="title">Flappy Dog</span>
    <span style="width:64px"></span>
  </div>

  <div class="layout">
    <div class="game-col">
      <div class="stage">
        <canvas id="game" width="400" height="600"></canvas>
      </div>
      <p class="hint">P1: Space / ↑ / tap bottom&nbsp;&nbsp;·&nbsp;&nbsp;P2: Right Ctrl / tap top</p>
    </div>

    <aside class="shop">
      <div class="players-toggle">
        <button id="onePlayer" class="seg" type="button">1 Player</button>
        <button id="twoPlayer" class="seg" type="button">2 Players</button>
      </div>

      <div class="bones-bar">🦴 <span id="boneCount">0</span> bones — spend or save up</div>

      <div class="shop-section">
        <div class="shop-label">Levels</div>
        <div id="levels" class="chips"></div>
      </div>

      <div class="shop-section" id="dressToggle" hidden>
        <div class="shop-label">Customising</div>
        <div class="players-toggle">
          <button id="dressP1" class="seg" type="button">Player 1</button>
          <button id="dressP2" class="seg" type="button">Player 2</button>
        </div>
      </div>

      <div class="shop-section">
        <div class="shop-label">Breeds · <b>10🦴</b></div>
        <div id="breeds" class="chips"></div>
      </div>

      <div class="shop-section">
        <div class="shop-label">Costumes · <b>5🦴</b></div>
        <div id="costumes" class="chips"></div>
      </div>
    </aside>
  </div>

  <!-- Setup overlay -->
  <div class="overlay" id="setup">
    <div class="panel">
      <h2>Flappy Dog</h2>
      <div class="sub">Tap to flap through the gaps and collect bones to unlock breeds! 🦴</div>

      <div class="group-label">Players</div>
      <div class="choices" id="player-choices">
        <button class="choice" data-players="1"><span class="big">1</span><span class="small">player</span></button>
        <button class="choice" data-players="2"><span class="big">2</span><span class="small">players</span></button>
      </div>

      <button class="start-btn" id="start-btn">Start Game</button>
    </div>
  </div>

      try { var a = JSON.parse(localStorage.getItem('elise.playerNames')); var n = (a && a[i] != null ? String(a[i]) : '').trim(); return n || fallback; }
      catch (e) { return fallback; }

    // Difficulty ramps from very easy to hard over RAMP_FRAMES of *play time*
    // (not score), so a quick death doesn't keep things stuck on hard. It
    // starts really floaty & slow, then gradually speeds up the longer you last.
    const RAMP_FRAMES = 60 * 80;   // ~80s at 60fps to reach full difficulty (slow ramp)
    const GRAVITY_MIN = 0.085, GRAVITY_MAX = 0.16;  // drop speed halved
    const FLAP_MIN = -3.4,    FLAP_MAX = -4.7;   // trimmed to keep the same ~68px hop height
    const MAX_FALL = 4;
    const SPEED_MIN = 0.9,    SPEED_MAX = 2.3;   // pipes stay slow, never get frantic
    const GAP_MIN = 205,      GAP_MAX = 260;     // gaps stay generous even at full difficulty
    const PIPE_SPACING = 320;  // lots of horizontal space between pipe pairs = more reaction time

    // Live difficulty values, recomputed each frame from elapsed play time.
    let GRAVITY = GRAVITY_MIN;
    let FLAP = FLAP_MIN;
    let PIPE_SPEED = SPEED_MIN;
    let GAP = GAP_MAX;
    let playFrames = 0;  // play-time accumulator (real-time, drives the ramp & mechanics)
    let dtf = 1;         // frame delta ÷ (1000/60): 1.0 @60fps — scales all motion for uniform speed
    let lastTs = 0;
    const PACE = 1.15;   // global pace multiplier — a touch faster (uniform across devices)

    function applyDifficulty() {
      // ease-in (t²) so the early game stays easy longer before ramping up.
      // Speed/gap/ramp come from the active level (later levels start slower & ramp slower).
      const L = LEVELS[level];
      const lin = Math.min(playFrames / L.ramp, 1);  // 0 → 1
      const t = lin * lin;
      GRAVITY = GRAVITY_MIN + (GRAVITY_MAX - GRAVITY_MIN) * t;
      FLAP = FLAP_MIN + (FLAP_MAX - FLAP_MIN) * t;
      PIPE_SPEED = (L.speedMin + (L.speedMax - L.speedMin) * t) * PACE;
      GAP = L.gapMax + (L.gapMin - L.gapMax) * t;

      // Outer Space — low gravity: softer pull + gentler flap so the dog floats.
      if (L.mechanic === 'lowgrav') { GRAVITY *= 0.55; FLAP *= 0.8; }
      // Candy Land — sugar rush: the whole world periodically speeds up.
      if (L.mechanic === 'rush') PIPE_SPEED *= rushMult(playFrames);
    }
