<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crossy Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .back {
      color: #a0a8c0;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 12px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .back:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .title { font-family: 'Pacifico', cursive; color: #fff; font-size: 1.6rem; line-height: 1; }

    .stage {
      position: relative;
      width: 100%;
      max-width: 560px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 2px solid #0f3460;
      aspect-ratio: 760 / 560;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .hint {
      margin-top: 12px;
      color: #a0a8c0;
      font-size: 0.82rem;
      text-align: center;
      max-width: 560px;
      line-height: 1.5;
    }
    .hint b { color: #ffe8b0; }

    /* ---------- shared start / over dialog ---------- */
    .overlay {
      position: fixed;          /* full viewport, not clipped by the short canvas stage on mobile */
      inset: 0;
      background: rgba(10, 14, 28, 0.86);
      backdrop-filter: blur(4px);
      display: flex;
      /* NB: center the panel with margin:auto (below), NOT align/justify-center.
         Flex centering clips a too-tall panel on both ends so Start can't be reached;
         margin:auto centers when it fits and lets the overlay scroll when it doesn't. */
      padding: 16px;
      overflow-y: auto;         /* scroll to reach Start on short screens */
      -webkit-overflow-scrolling: touch;
      z-index: 20;
    }
    .overlay[hidden] { display: none; }
    .panel {
      width: 100%;
      max-width: 380px;
      margin: auto;             /* centers when it fits; lets the overlay scroll when too tall */
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }
    .panel h2 { font-family: 'Pacifico', cursive; color: #fff; font-size: 1.7rem; font-weight: 400; margin-bottom: 6px; }
    .panel .sub { color: #a0a8c0; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.4; }
    .group-label { color: #ffe8b0; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin: 14px 0 8px; }
    .choices { display: flex; gap: 8px; justify-content: center; }
    .choice {
      flex: 1;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: #cfd6ea;
      background: #0f1830;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 12px 4px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .choice .big { display: block; font-size: 1.7rem; line-height: 1.3; }
    .choice .small { display: block; font-size: 0.66rem; color: #8b93b0; font-weight: 700; margin-top: 2px; }
    .choice .pb { display: block; font-size: 0.62rem; color: #ffe8b0; font-weight: 800; margin-top: 4px; }
    .choice:hover { border-color: #6f86c4; }
    .choice:active { transform: scale(0.96); }
    .choice.selected {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      color: #fff;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.25);
    }
    .choice.selected .small { color: #ffb3c2; }

    .scoreline { color: #fff; font-weight: 800; font-size: 1rem; margin: 6px 0; }
    .scoreline .big { font-size: 2.2rem; display: block; line-height: 1.1; }
    .scoreline .lbl { color: #a0a8c0; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .start-btn {
      margin-top: 18px;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      background: #e94560;
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b22a44;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b22a44; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html" class="back">‹ Games</a>
    <span class="title">Crossy Pets</span>
    <span style="width:56px"></span>
  </div>

  <div class="stage">
    <canvas id="game" width="760" height="560"></canvas>

    <!-- Start / character select -->
    <div class="overlay" id="setup">
      <div class="panel">
        <h2>Crossy Pets</h2>
        <div class="sub">Hop across roads, rivers &amp; railways — how far can you go? 🐔</div>
        <div class="group-label">Pick your pet</div>
        <div class="choices" id="pet-choices">
          <button class="choice" data-pet="chick"><span class="big">🐤</span><span class="small">Chick</span><span class="pb"></span></button>
          <button class="choice" data-pet="pup"><span class="big">🐶</span><span class="small">Pup</span><span class="pb"></span></button>
          <button class="choice" data-pet="kitty"><span class="big">🐱</span><span class="small">Kitty</span><span class="pb"></span></button>
          <button class="choice" data-pet="frog"><span class="big">🐸</span><span class="small">Froggy</span><span class="pb"></span></button>
        </div>
        <div class="group-label">Players</div>
        <div class="choices" id="count-choices">
          <button class="choice" data-players="1"><span class="big">1</span><span class="small">solo</span></button>
          <button class="choice" data-players="2"><span class="big">2</span><span class="small">P1 WASD · P2 ◄►</span></button>
        </div>
        <button class="start-btn" id="start-btn">Start Game</button>
      </div>
    </div>

    <!-- Game over -->
    <div class="overlay" id="over" hidden>
      <div class="panel">
        <h2 id="over-title">Game Over</h2>
        <div class="sub" id="over-sub">Squashed!</div>
        <div class="scoreline"><span class="lbl" id="over-l1">Score</span><span class="big" id="over-score">0</span></div>
        <div class="scoreline"><span class="lbl" id="over-l2">Best</span><span class="big" id="over-best">0</span></div>
        <button class="start-btn" id="again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <p class="hint">
    <b>P1: WASD</b> &nbsp;·&nbsp; <b>P2: Arrow keys</b> &nbsp;·&nbsp; in 2-player, hop ahead to leave your rival behind — don't get squashed, drowned, or caught by the eagle! 🦅
  </p>

  <script>
  (function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;    // 760
    const H = canvas.height;   // 560

    // ---------- world / projection constants ----------
    const COLS = 9;            // playable columns 0..8
    const TW = 72;             // screen px per column
    const TD = 56;             // screen px per row (vertical recede)
    const HH = 24;             // screen px lift per height unit / block thickness
    const LEFT_X = (W - COLS * TW) / 2;
    const ORIGIN_Y = 430;      // screen y of the row sitting at camZ
    const VIS_BACK = 4;        // rows visible behind camZ
    const VIS_FWD = 8;         // rows visible ahead of camZ
    const HOP_FRAMES = 9;
    const IDLE_MS = 10000;     // 1P: real milliseconds idle (no forward progress) before the eagle swoops
    const IDLE_WARN_MS = 3000; // ms before that to start the looming-shadow warning
    const LEAD_LIMIT = 6;      // 2P: if the leader gets this many rows ahead, the laggard dies
    const BACK_LIMIT = 3;      // 1P: backing up this many rows below your furthest summons the eagle

    const BEST_PREFIX = 'crossypets.best.';   // per-pet best score, keyed by pet id
    function loadBest(p) { try { return parseInt(localStorage.getItem(BEST_PREFIX + p) || '0', 10) || 0; } catch (e) { return 0; } }
    function saveBest(p, v) { try { localStorage.setItem(BEST_PREFIX + p, String(v)); } catch (e) {} }

    // ---------- pets ----------
    const PETS = {
      chick: { body: '#ffd23f', dark: '#e3b21f', belly: '#fff0b0', feat: '#ff8a3c', kind: 'beak' },
      pup:   { body: '#c98a4b', dark: '#a86d33', belly: '#f0d8b8', feat: '#5a3a1c', kind: 'ears' },
      kitty: { body: '#9aa4b2', dark: '#727d8c', belly: '#e7ecf3', feat: '#5a626f', kind: 'ears' },
      frog:  { body: '#5fae3a', dark: '#46892a', belly: '#cdeFb0', feat: '#2f6a1c', kind: 'eyesbig' }
    };

    // ---------- state ----------
    let state = 'select';        // 'select' | 'playing' | 'dying' | 'over'
    let numPlayers = 2;          // 1 or 2
    let p1pet = 'chick';
    let rows = {};               // z -> row descriptor
    let maxGen = -1;             // furthest generated row
    let camZ = 0;                // camera row (float)
    let creep = 0;               // forward camera creep per frame
    let frame = 0;
    let players = [];            // 1 or 2 active players
    let deathTimer = 0, deadKind = '', deadIdx = -1, winnerIdx = -1;
    let idleMs = 0;              // 1P only: real ms since last forward progress (drives the eagle)
    let lastTs = 0, dtMs = 16.7; // frame delta in ms — keeps timing refresh-rate independent
    let dtf = 1;                 // dtMs / (1000/60): 1.0 at 60fps, 0.5 at 120fps. Scales all motion.
    let eagle = null;
    const PET_ORDER = ['chick', 'pup', 'kitty', 'frog'];
    function secondPet(p) { return PET_ORDER.find(function (q) { return q !== p; }) || 'pup'; }
    function makePlayer(petId, x) {
      return { pet: petId, x: x, z: 2, face: 1, hopping: false, hopT: 0, fromX: x, fromZ: 2, toX: x, toZ: 2, ride: null, score: 0 };
    }

    const setupEl = document.getElementById('setup');
    const overEl = document.getElementById('over');

    // ---------- small RNG helpers ----------
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
    function chance(p) { return Math.random() < p; }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    const CAR_COLORS = ['#e94560', '#3ec8be', '#ffd23f', '#7a5cff', '#ff8a3c', '#46c46a', '#ff5da2'];

    // ---------- row generation ----------
    function laneSpeed() { return 0.018 + Math.min(camZ, 60) * 0.0006 + rnd(0, 0.010); }

    function spawnMovers(lenMin, lenMax, gapMin, gapMax, dir, speed) {
      const items = [];
      let x = rnd(-3, 0);
      while (x < COLS + 3) {
        const len = ri(lenMin, lenMax);
        items.push({ x: x, len: len, color: pick(CAR_COLORS) });
        x += len + ri(gapMin, gapMax);
      }
      // tag direction/speed on each
      items.forEach(it => { it.dir = dir; it.speed = speed; });
      return items;
    }

    // Vehicle types — each road lane runs one type (some have a fixed colour).
    const VEHICLE_TYPES = [
      { type: 'car', len: 1 }, { type: 'car', len: 1 }, { type: 'car', len: 1 },  // common
      { type: 'truck', len: 2 },
      { type: 'taxi', len: 1, color: '#ffcf33' },
      { type: 'police', len: 1, color: '#2b3a8c' },
      { type: 'icecream', len: 2, color: '#fff4fb' }
    ];
    function spawnVehicles(dir, speed) {
      const t = pick(VEHICLE_TYPES);
      const items = [];
      let x = rnd(-3, 0);
      while (x < COLS + 3) {
        items.push({ x: x, len: t.len, type: t.type, color: t.color || pick(CAR_COLORS), dir: dir, speed: speed });
        x += t.len + ri(4, 9);
      }
      return items;
    }

    function genRow(z) {
      let type;
      if (z <= 3) { type = 'grass'; }
      else {
        // avoid 3+ rivers / rails in a row
        const prev = rows[z - 1] ? rows[z - 1].type : 'grass';
        const prev2 = rows[z - 2] ? rows[z - 2].type : 'grass';
        const r = Math.random();
        if (r < 0.30) type = 'grass';
        else if (r < 0.66) type = 'road';
        else if (r < 0.88) type = 'river';
        else type = 'rail';
        if (type === 'river' && prev === 'river' && prev2 === 'river') type = 'grass';
        if (type === 'rail' && prev === 'rail') type = 'road';
      }

      const row = { type: type, z: z };
      if (type === 'grass') {
        row.shade = (z % 2 === 0) ? '#5fae3a' : '#57a334';
        row.obstacles = {};
        if (z > 3) {
          let blocked = 0;
          for (let c = 0; c < COLS; c++) {
            if (chance(0.16) && blocked < 5) {
              row.obstacles[c] = chance(0.7) ? { kind: 'tree', h: ri(2, 3) } : { kind: 'rock', h: 1 };
              blocked++;
            }
          }
        }
      } else if (type === 'road') {
        const dir = chance(0.5) ? 1 : -1;
        const speed = laneSpeed();
        row.cars = spawnVehicles(dir, speed);
      } else if (type === 'river') {
        const dir = chance(0.5) ? 1 : -1;
        const speed = laneSpeed() * 0.85;
        row.logs = spawnMovers(2, 3, 1, 3, dir, speed);
        // chance a log becomes a gator (rideable only when surfaced)
        if (chance(0.28) && row.logs.length) {
          const g = pick(row.logs);
          g.gator = true;
          g.subT = ri(0, 200);
        }
        row.water = (z % 2 === 0) ? '#2a6fdb' : '#2766cf';
      } else { // rail
        row.phase = 'idle';
        row.timer = ri(260, 560);
        row.dir = chance(0.5) ? 1 : -1;
        row.train = null;
      }
      rows[z] = row;
      return row;
    }

    function ensureRows(upto) {
      while (maxGen < upto) { maxGen++; genRow(maxGen); }
    }

    // ---------- projection ----------
    function colX(xt) { return LEFT_X + xt * TW + TW / 2; }
    function rowY(z) { return ORIGIN_Y - (z - camZ) * TD; }

    // a block sitting on a lane: centre tile xt, width wt tiles, height h units, lifted by `lift`
    function drawBox(xt, z, wt, h, lift, top, side, depthFrac) {
      depthFrac = depthFrac == null ? 0.5 : depthFrac;
      const cx = colX(xt), halfW = wt * TW / 2;
      const standY = rowY(z) - lift * HH;
      const blockTop = standY - h * HH;
      const lid = TD * depthFrac;
      // front face
      ctx.fillStyle = side;
      ctx.fillRect(cx - halfW, blockTop, wt * TW, standY - blockTop);
      // top lid
      ctx.fillStyle = top;
      ctx.fillRect(cx - halfW, blockTop - lid, wt * TW, lid);
      return { cx: cx, top: blockTop - lid, halfW: halfW };
    }

    // ---------- input ----------
    function selectedPet() {
      const el = document.querySelector('#pet-choices .choice.selected');
      return el ? el.dataset.pet : 'chick';
    }
    function selectedCount() {
      const el = document.querySelector('#count-choices .choice.selected');
      return el ? parseInt(el.dataset.players, 10) : 2;
    }

    function hop(pi, dx, dz) {
      if (state !== 'playing') return;
      const pl = players[pi];
      if (!pl || pl.hopping) return;
      let nx = Math.round(pl.x) + dx;
      let nz = Math.round(pl.z) + dz;
      if (nx < 0 || nx > COLS - 1) return;          // walled by edges
      if (nz < 0) nz = 0;
      ensureRows(nz + VIS_FWD);
      const dest = rows[nz];
      if (dest && dest.type === 'grass' && dest.obstacles[nx]) return;  // blocked by tree/rock
      pl.hopping = true; pl.hopT = 0;
      pl.fromX = pl.x; pl.fromZ = pl.z;
      pl.toX = nx; pl.toZ = nz;
      pl.face = dx < 0 ? -1 : (dx > 0 ? 1 : pl.face);
      if (nz > pl.score) { pl.score = nz; if (pi === 0) idleMs = 0; }   // forward progress resets the 1P eagle timer
    }

    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      const k = e.code;
      if (state === 'select') {
        if (k === 'Space' || k === 'Enter') { e.preventDefault(); beginGame(); }
        return;
      }
      if (state === 'over') {
        if (k === 'Space' || k === 'Enter') { e.preventDefault(); showSelect(); }
        return;
      }
      // Player 1 — WASD (always controls player 0)
      if (k === 'KeyW') { e.preventDefault(); hop(0, 0, 1); }
      else if (k === 'KeyS') { e.preventDefault(); hop(0, 0, -1); }
      else if (k === 'KeyA') { e.preventDefault(); hop(0, -1, 0); }
      else if (k === 'KeyD') { e.preventDefault(); hop(0, 1, 0); }
      else {
        // Arrow keys → player 2 in 2P, player 0 in solo. Space → forward (solo only).
        const pi = numPlayers === 2 ? 1 : 0;
        if (k === 'ArrowUp') { e.preventDefault(); hop(pi, 0, 1); }
        else if (k === 'ArrowDown') { e.preventDefault(); hop(pi, 0, -1); }
        else if (k === 'ArrowLeft') { e.preventDefault(); hop(pi, -1, 0); }
        else if (k === 'ArrowRight') { e.preventDefault(); hop(pi, 1, 0); }
        else if (k === 'Space' && numPlayers === 1) { e.preventDefault(); hop(0, 0, 1); }
      }
    });

    // tap = forward, swipe = direction
    let touchSX = 0, touchSY = 0, touchMoved = false;
    function pointerDown(e) {
      if (state === 'select' || state === 'over') return;
      const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
      touchSX = t.clientX; touchSY = t.clientY; touchMoved = false;
    }
    function pointerUp(e) {
      if (state === 'select') { beginGame(); return; }
      if (state === 'over') { showSelect(); return; }
      if (state !== 'playing') return;
      const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
      const dx = t.clientX - touchSX, dy = t.clientY - touchSY;
      const TH = 24;
      if (Math.abs(dx) < TH && Math.abs(dy) < TH) { hop(0, 0, 1); return; }   // tap → forward
      if (Math.abs(dx) > Math.abs(dy)) hop(0, dx > 0 ? 1 : -1, 0);
      else hop(0, 0, dy < 0 ? 1 : -1);                                        // swipe up → forward
    }
    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('touchstart', pointerDown, { passive: true });
    canvas.addEventListener('touchend', function (e) { if (e.cancelable) e.preventDefault(); pointerUp(e); }, { passive: false });

    // ---------- dialog wiring ----------
    document.getElementById('pet-choices').addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      document.querySelectorAll('#pet-choices .choice').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
    });
    document.querySelector('#pet-choices .choice').classList.add('selected');

    document.getElementById('count-choices').addEventListener('click', function (e) {
      const btn = e.target.closest('.choice');
      if (!btn) return;
      document.querySelectorAll('#count-choices .choice').forEach(function (c) { c.classList.remove('selected'); });
      btn.classList.add('selected');
    });
    document.querySelector('#count-choices [data-players="2"]').classList.add('selected');

    function refreshPetBests() {
      document.querySelectorAll('#pet-choices .choice').forEach(function (btn) {
        const el = btn.querySelector('.pb');
        if (el) el.textContent = '★ ' + loadBest(btn.dataset.pet);
      });
    }
    refreshPetBests();
    document.getElementById('start-btn').addEventListener('click', beginGame);
    document.getElementById('again-btn').addEventListener('click', showSelect);

    function showSelect() { state = 'select'; overEl.hidden = true; setupEl.hidden = false; refreshPetBests(); }

    function beginGame() {
      p1pet = selectedPet();
      numPlayers = selectedCount();
      rows = {}; maxGen = -1;
      camZ = 0.5;                 // so laneSpeed/gen difficulty starts low
      ensureRows(VIS_FWD + 6);
      frame = 0; creep = 0;
      deathTimer = 0; deadKind = ''; deadIdx = -1; winnerIdx = -1; eagle = null; idleMs = 0;
      players = (numPlayers === 1)
        ? [ makePlayer(p1pet, 4) ]
        : [ makePlayer(p1pet, 3), makePlayer(secondPet(p1pet), 5) ];
      camZ = 2 - 1.5;
      setupEl.hidden = true; overEl.hidden = true;
      state = 'playing';
    }

    function die(pi, kind) {
      if (state !== 'playing') return;
      state = 'dying';
      deadIdx = pi;
      deadKind = kind;
      winnerIdx = (numPlayers === 2) ? (1 - pi) : -1;
      deathTimer = (kind === 'eagle' || kind === 'leash') ? 46 : 34;
      if (kind === 'eagle' || kind === 'leash') eagle = { y: -120 };
    }

    // Player names set centrally on the homepage (shared localStorage). Blank = default.
    function playerName(i, fallback) {
      try { var a = JSON.parse(localStorage.getItem('elise.playerNames')); var n = (a && a[i] != null ? String(a[i]) : '').trim(); return n || fallback; }
      catch (e) { return fallback; }
    }

    function deathReason(kind, idx) {
      const who = numPlayers === 2 ? (playerName(idx, 'Player ' + (idx + 1)) + ' ') : '';
      if (kind === 'squash') return who + (who ? 'got squashed! 🚗' : 'Squashed flat! 🚗');
      if (kind === 'drown') return who + (who ? 'drowned! 🌊' : 'Glug glug… 🌊');
      if (kind === 'train') return who + (who ? 'hit a train! 🚆' : 'Hit by a train! 🚆');
      if (kind === 'eagle') return who + (who ? 'was caught by the eagle! 🦅' : 'The eagle got you! 🦅');
      if (kind === 'leash') return playerName(idx, 'Player ' + (idx + 1)) + ' fell behind! 🦅';
      return 'Game Over';
    }

    function finishDeath() {
      state = 'over';
      players.forEach(function (pl) { if (pl.score > loadBest(pl.pet)) saveBest(pl.pet, pl.score); });
      document.getElementById('over-sub').textContent = deathReason(deadKind, deadIdx);
      if (numPlayers === 2) {
        document.getElementById('over-title').textContent = playerName(winnerIdx, 'Player ' + (winnerIdx + 1)) + ' wins! 🏆';
        document.getElementById('over-l1').textContent = playerName(0, 'Player 1');
        document.getElementById('over-l2').textContent = playerName(1, 'Player 2');
        document.getElementById('over-score').textContent = players[0].score;
        document.getElementById('over-best').textContent = players[1].score;
      } else {
        document.getElementById('over-title').textContent = 'Game Over';
        document.getElementById('over-l1').textContent = 'Score';
        document.getElementById('over-l2').textContent = 'Best';
        document.getElementById('over-score').textContent = players[0].score;
        document.getElementById('over-best').textContent = loadBest(players[0].pet);
      }
      overEl.hidden = false;
    }

    // ---------- update ----------
    function update() {
      if (state === 'dying') {
        if (eagle) eagle.y += 7 * dtf;
        deathTimer -= dtf; if (deathTimer <= 0) finishDeath();
        return;
      }
      if (state !== 'playing') return;
      frame++;

      // camera follows the REAR-most player so both stay on screen
      const zs = players.map(function (p) { return p.z; });
      const rearZ = Math.min.apply(null, zs);
      const leadZ = Math.max.apply(null, zs);
      camZ += (rearZ - camZ) * 0.08 * dtf;
      creep = (numPlayers === 1) ? (0.0045 + Math.min(players[0].score, 80) * 0.00018) : 0;
      camZ += creep * dtf;
      ensureRows(Math.ceil(camZ) + VIS_FWD + 2);

      // move vehicles / logs / trains across visible rows
      const lo = Math.floor(camZ) - VIS_BACK - 2, hi = Math.ceil(camZ) + VIS_FWD + 2;
      for (let z = lo; z <= hi; z++) {
        const row = rows[z]; if (!row) continue;
        if (row.type === 'road') moveItems(row.cars);
        else if (row.type === 'river') {
          moveItems(row.logs);
          row.logs.forEach(function (l) { if (l.gator) { l.subT = (l.subT + dtf) % 200; l.submerged = l.subT > 150; } });
        } else if (row.type === 'rail') updateRail(row);
      }

      // 1P: eagle swoops if you idle (no forward progress) too long
      if (numPlayers === 1) {
        idleMs += dtMs;
        if (idleMs > IDLE_MS) { die(0, 'eagle'); return; }
        // backing up too far below your furthest row also summons the eagle
        if (players[0].score - Math.round(players[0].z) > BACK_LIMIT) { die(0, 'eagle'); return; }
      }

      // 2P leash: if the leader pulls too far ahead, the rear player is left behind & dies
      if (numPlayers === 2 && leadZ - rearZ > LEAD_LIMIT) {
        const rearIdx = players[0].z <= players[1].z ? 0 : 1;
        die(rearIdx, 'leash');
        return;
      }

      // per-player hop animation + settled-tile hazards
      for (let i = 0; i < players.length; i++) {
        const pl = players[i];
        if (pl.hopping) {
          pl.hopT += dtf;
          const t = pl.hopT / HOP_FRAMES;
          pl.x = pl.fromX + (pl.toX - pl.fromX) * t;
          pl.z = pl.fromZ + (pl.toZ - pl.fromZ) * t;
          if (pl.hopT >= HOP_FRAMES) { pl.hopping = false; pl.x = pl.toX; pl.z = pl.toZ; pl.ride = null; }
          continue; // no hazards mid-hop
        }
        const row = rows[Math.round(pl.z)];
        if (!row) continue;
        if (row.type === 'river') {
          let onLog = null;
          for (const l of row.logs) {
            if (l.submerged) continue;
            if (pl.x > l.x - 0.55 && pl.x < l.x + l.len - 0.45) { onLog = l; break; }
          }
          if (!onLog) { die(i, 'drown'); return; }
          // Ride with the log at the SAME rate it moves (moveItems uses *dtf too) — without
          // this the rider drifts off the log on any non-60fps display (120/144Hz) and drowns.
          pl.x += onLog.dir * onLog.speed * dtf; pl.ride = onLog;
          if (pl.x < -0.5 || pl.x > COLS - 0.5) { die(i, 'drown'); return; }
        } else if (row.type === 'road') {
          for (const c of row.cars) {
            if (pl.x > c.x - 0.6 && pl.x < c.x + c.len - 0.4) { die(i, 'squash'); return; }
          }
        } else if (row.type === 'rail') {
          if (row.phase === 'pass' && row.train) {
            const tr = row.train;
            if (pl.x > tr.x - 0.5 && pl.x < tr.x + tr.len - 0.5) { die(i, 'train'); return; }
          }
        }
      }
    }

    function moveItems(items) {
      if (!items) return;
      for (const it of items) {
        it.x += it.dir * it.speed * dtf;
        if (it.dir > 0 && it.x > COLS + 2.5) it.x = -it.len - 2.5;
        else if (it.dir < 0 && it.x < -it.len - 2.5) it.x = COLS + 2.5;
      }
    }

    function updateRail(row) {
      row.timer -= dtf;
      if (row.phase === 'idle') {
        if (row.timer <= 0) { row.phase = 'warn'; row.timer = 110; }
      } else if (row.phase === 'warn') {
        if (row.timer <= 0) {
          row.phase = 'pass';
          const len = COLS + 6;
          row.train = { len: len, x: row.dir > 0 ? -len - 1 : COLS + 1 };
          beep();
        }
      } else if (row.phase === 'pass') {
        const tr = row.train;
        tr.x += row.dir * 0.22 * dtf;
        if ((row.dir > 0 && tr.x > COLS + 1) || (row.dir < 0 && tr.x < -tr.len - 1)) {
          row.phase = 'idle'; row.timer = ri(420, 780); row.train = null;
        }
      }
    }

    // ---------- tiny audio (train warning) ----------
    let actx = null;
    function beep() {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = 520;
        g.gain.value = 0.04; o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + 0.12);
      } catch (e) {}
    }

    // ---------- drawing ----------
    // Railroad crossing signal: a white crossbuck + two red lights that flash
    // alternately while a train is warning/passing (dim when the track is clear).
    function drawCrossingSignal(cx, yc, active, blink) {
      ctx.fillStyle = '#2a2f3a';
      ctx.fillRect(cx - 2, yc - 2, 4, 16);                 // post
      ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 8, yc - 20); ctx.lineTo(cx + 8, yc - 6);   // crossbuck X
      ctx.moveTo(cx + 8, yc - 20); ctx.lineTo(cx - 8, yc - 6);
      ctx.stroke();
      ctx.lineCap = 'butt';
      function light(lx, on) {
        if (on) { ctx.fillStyle = 'rgba(255,70,70,0.55)'; ctx.beginPath(); ctx.arc(lx, yc + 13, 7, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = on ? '#ff2b2b' : '#5a1a1a';
        ctx.beginPath(); ctx.arc(lx, yc + 13, 4, 0, Math.PI * 2); ctx.fill();
      }
      light(cx - 7, active && blink);
      light(cx + 7, active && !blink);
    }

    function drawLaneBand(row) {
      const yc = rowY(row.z), y0 = yc - TD / 2;
      if (row.type === 'grass') {
        ctx.fillStyle = row.shade; ctx.fillRect(0, y0, W, TD);
      } else if (row.type === 'road') {
        ctx.fillStyle = '#3a3f4a'; ctx.fillRect(0, y0, W, TD);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        for (let x = 16; x < W; x += 48) ctx.fillRect(x, yc - 2, 26, 4);
      } else if (row.type === 'river') {
        ctx.fillStyle = row.water; ctx.fillRect(0, y0, W, TD);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        for (let x = (frame * 0.3) % 60 - 60; x < W; x += 60) ctx.fillRect(x, yc + 6, 30, 3);
      } else { // rail
        ctx.fillStyle = '#6b5b4a'; ctx.fillRect(0, y0, W, TD);
        ctx.fillStyle = '#9aa0aa'; ctx.fillRect(0, yc - 10, W, 3); ctx.fillRect(0, yc + 7, W, 3);
        // crossing signals flash while a train is warning or passing
        const active = (row.phase === 'warn' || row.phase === 'pass');
        const blink = Math.floor(frame / 8) % 2 === 0;
        drawCrossingSignal(22, yc, active, blink);
        drawCrossingSignal(W - 22, yc, active, blink);
      }
    }

    function drawRowObjects(row) {
      if (row.type === 'grass') {
        for (const c in row.obstacles) {
          const o = row.obstacles[c], x = +c;
          if (o.kind === 'tree') {
            drawBox(x, row.z, 0.34, 1, 0, '#7a4a2a', '#5e3920', 0.4);          // trunk
            drawBox(x, row.z, 0.92, o.h, 1, '#3aa340', '#2c7d32', 0.55);        // foliage
          } else {
            drawBox(x, row.z, 0.78, 1, 0, '#9aa0aa', '#727884', 0.5);          // rock
          }
        }
      } else if (row.type === 'road') {
        for (const c of row.cars) drawVehicle(c, row.z);
      } else if (row.type === 'river') {
        for (const l of row.logs) drawLog(l, row.z);
      } else if (row.type === 'rail') {
        if (row.phase === 'pass' && row.train) drawTrain(row.train, row.z);
      }
    }

    function drawVehicle(c, z) {
      const center = c.x + c.len / 2 - 0.5;
      const cx = colX(center);

      if (c.type === 'truck' || c.type === 'icecream') {
        const ice = c.type === 'icecream';
        const body = ice ? '#fff4fb' : c.color;
        const side = ice ? '#e7c4da' : shade(c.color);
        const box = drawBox(center, z, c.len * 0.94, 1.1, 0, body, side, 0.5);
        // cabin at the leading end
        const cabX = c.dir > 0 ? c.x + c.len - 1 : c.x;
        drawBox(cabX, z, 0.6, 1.05, 0, ice ? '#ffd9ec' : '#e3eaf3', ice ? '#e7a9cd' : '#aeb9c8', 0.46);
        drawBox(cabX, z, 0.42, 0.5, 0.55, '#cfe8ff', '#9bbfe0', 0.4);
        if (ice) {
          // serving window + a cone-with-scoop topper
          ctx.fillStyle = 'rgba(60,40,55,0.85)';
          const sx = c.dir > 0 ? cx - 16 : cx + 4;
          ctx.fillRect(sx, rowY(z) - 16, 12, 10);
          ctx.fillStyle = '#f3c98b'; tri(cx - 5, box.top - 3, cx + 5, box.top - 3, cx, box.top + 7);
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, box.top - 6, 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffb3d1'; ctx.beginPath(); ctx.arc(cx, box.top - 9, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        return;
      }

      // single-tile vehicles: car / taxi / police
      const box = drawBox(center, z, 0.92, 1, 0, c.color, shade(c.color), 0.5);
      drawBox(center, z, 0.5, 0.6, 0.62, '#cfe8ff', '#9bbfe0', 0.4);   // windshield

      if (c.type === 'police') {
        const on = Math.floor(frame / 6) % 2 === 0;
        ctx.fillStyle = on ? '#ff2b2b' : '#3b6bff';
        ctx.fillRect(cx - 10, box.top - 6, 9, 6);
        ctx.fillStyle = on ? '#3b6bff' : '#ff2b2b';
        ctx.fillRect(cx + 1, box.top - 6, 9, 6);
      } else if (c.type === 'taxi') {
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(cx - 11, box.top - 7, 22, 7);
        ctx.fillStyle = '#ffd23f';
        ctx.font = "800 7px 'Nunito', sans-serif"; ctx.textAlign = 'center';
        ctx.fillText('TAXI', cx, box.top - 1.5); ctx.textAlign = 'left';
      }
    }

    function drawLog(l, z) {
      const center = l.x + l.len / 2 - 0.5;
      if (l.gator) {
        if (l.submerged) {
          ctx.fillStyle = 'rgba(20,60,30,0.5)';
          const cx = colX(center), w = l.len * TW * 0.9;
          ctx.fillRect(cx - w / 2, rowY(z) - 4, w, 8);
          return;
        }
        drawBox(center, z, l.len * 0.92, 0.7, 0, '#3f7d3a', '#2c5e2a', 0.5);
        // eyes bump at the head (front of travel)
        const headX = l.dir > 0 ? l.x + l.len - 0.7 : l.x + 0.2;
        drawBox(headX, z, 0.5, 1, 0.7, '#356b32', '#244c22', 0.4);
      } else {
        drawBox(center, z, l.len * 0.96, 0.7, 0, '#8a5a30', '#6b4423', 0.5);
      }
    }

    function drawTrain(tr, z) {
      const center = tr.x + tr.len / 2 - 0.5;
      drawBox(center, z, tr.len, 1.6, 0, '#d23b3b', '#9c2626', 0.55);
      drawBox(center, z, tr.len * 0.96, 1.6, 0, 'rgba(255,255,255,0.0)', 'rgba(0,0,0,0)', 0); // noop spacing
      // windows stripe
      ctx.fillStyle = '#ffe08a';
      const cx = colX(center), y = rowY(z) - 1.6 * HH - TD * 0.55 + 6;
      ctx.fillRect(cx - tr.len * TW / 2 + 8, y, tr.len * TW - 16, 8);
    }

    function tri(x1, y1, x2, y2, x3, y3) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
    }

    function drawPet(pl, i) {
      const p = PETS[pl.pet] || PETS.chick;
      let lift = 0;
      if (pl.hopping) lift = Math.sin((pl.hopT / HOP_FRAMES) * Math.PI) * 0.65;
      const x = pl.x, z = pl.z;
      let squashH = 1;
      if (state === 'dying' && i === deadIdx) {
        if (deadKind === 'squash') squashH = Math.max(0.12, deathTimer / 34);   // flatten
        else if (deadKind === 'drown') lift = -(1 - deathTimer / 34) * 0.85;     // sink
      }
      const cx = colX(x), baseY = rowY(z) - lift * HH;

      // grounding shadow
      if (lift >= 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.ellipse(cx, rowY(z) + 3, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
      }

      // ---- body + belly ----
      const bodyH = 0.95 * squashH, bodyHalf = 0.78 * TW / 2;
      const bStand = baseY, bTop = bStand - bodyH * HH;
      drawBox(x, z, 0.78, bodyH, lift, p.body, p.dark, 0.5);
      ctx.fillStyle = p.belly;
      ctx.fillRect(cx - bodyHalf * 0.46, bTop + (bStand - bTop) * 0.34, bodyHalf * 0.92, (bStand - bTop) * 0.6);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.strokeRect(cx - bodyHalf, bTop, bodyHalf * 2, bStand - bTop);

      // ---- head ----
      const headLift = lift + bodyH, headH = 0.74 * squashH, headHalf = 0.64 * TW / 2;
      const hStand = rowY(z) - headLift * HH, hTop = hStand - headH * HH;
      const headTopY = hTop - TD * 0.45;        // crown of the head
      drawBox(x, z, 0.64, headH, headLift, p.body, p.dark, 0.45);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.strokeRect(cx - headHalf, hTop, headHalf * 2, hStand - hTop);

      // ---- ears / crown ----
      if (pl.pet === 'kitty') {
        ctx.fillStyle = p.body;
        tri(cx - 17, headTopY + 6, cx - 5, headTopY + 6, cx - 13, headTopY - 12);
        tri(cx + 5, headTopY + 6, cx + 17, headTopY + 6, cx + 13, headTopY - 12);
        ctx.fillStyle = '#ff9bb0';
        tri(cx - 14, headTopY + 4, cx - 8, headTopY + 4, cx - 12, headTopY - 4);
        tri(cx + 8, headTopY + 4, cx + 14, headTopY + 4, cx + 12, headTopY - 4);
      } else if (pl.pet === 'pup') {
        ctx.fillStyle = p.dark;
        ctx.fillRect(cx - headHalf - 4, hTop + 1, 8, 18);
        ctx.fillRect(cx + headHalf - 4, hTop + 1, 8, 18);
      } else if (pl.pet === 'chick') {
        ctx.fillStyle = p.dark;
        ctx.fillRect(cx - 2, headTopY - 7, 4, 9);
      }

      // ---- eyes ----
      const eyeY = hTop + (hStand - hTop) * 0.24;
      if (pl.pet === 'frog') {
        const ey = headTopY + 1;
        ctx.fillStyle = p.body;                                  // rounded eye bumps
        ctx.beginPath(); ctx.arc(cx - 8, ey, 7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8, ey, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 8, ey + 0.5, 4.4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8, ey + 0.5, 4.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#15172b';
        ctx.beginPath(); ctx.arc(cx - 6.5, ey + 1, 2.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 9.5, ey + 1, 2.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 7.5, ey, 1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8.5, ey, 1, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1f4a16'; ctx.lineWidth = 2; ctx.lineCap = 'round';   // gentle smile
        ctx.beginPath(); ctx.arc(cx, eyeY + 5, 7, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke(); ctx.lineCap = 'butt';
      } else {
        const ey = eyeY + 4;
        for (const s of [-1, 1]) {
          const ex = cx + s * 6.5;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#15172b';
          ctx.beginPath(); ctx.arc(ex + s * 0.6, ey + 0.5, 2.3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(ex - 1, ey - 1, 1.1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,140,150,0.45)';   // rosy cheeks
        ctx.beginPath(); ctx.arc(cx - 12, ey + 6, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 12, ey + 6, 2.6, 0, Math.PI * 2); ctx.fill();
      }

      // ---- nose / beak / whiskers ----
      if (pl.pet === 'chick') {
        ctx.fillStyle = p.feat;
        tri(cx - 6, eyeY + 13, cx + 6, eyeY + 13, cx, eyeY + 21);
      } else if (pl.pet === 'pup') {
        ctx.fillStyle = '#2a1c12'; ctx.fillRect(cx - 4, eyeY + 12, 8, 6);
      } else if (pl.pet === 'kitty') {
        ctx.fillStyle = '#ff9bb0'; tri(cx - 4, eyeY + 12, cx + 4, eyeY + 12, cx, eyeY + 17);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 5, eyeY + 15); ctx.lineTo(cx - 18, eyeY + 13);
        ctx.moveTo(cx + 5, eyeY + 15); ctx.lineTo(cx + 18, eyeY + 13);
        ctx.stroke();
      }
    }

    function drawEagle() {
      if (!eagle || deadIdx < 0 || !players[deadIdx]) return;
      const cx = colX(players[deadIdx].x), y = eagle.y;
      ctx.fillStyle = '#5a4632';
      ctx.fillRect(cx - 10, y, 20, 16);          // body
      ctx.fillStyle = '#6e5740';
      ctx.fillRect(cx - 34, y + 2, 24, 8);       // wing L
      ctx.fillRect(cx + 10, y + 2, 24, 8);       // wing R
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 8, y - 6, 16, 8);        // head
      ctx.fillStyle = '#ffb52e';
      ctx.fillRect(cx - 3, y - 2, 6, 4);         // beak
    }

    function shade(hex) {
      // darken a #rrggbb by ~28%
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      r = Math.floor(r * 0.72); g = Math.floor(g * 0.72); b = Math.floor(b * 0.72);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function drawHUD() {
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      if (numPlayers === 1) {
        const sc = players[0] ? players[0].score : 0;
        ctx.font = "800 34px 'Nunito', sans-serif"; ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        ctx.strokeText(String(sc), 18, 44); ctx.fillText(String(sc), 18, 44);
        ctx.font = "800 16px 'Nunito', sans-serif"; ctx.textAlign = 'right';
        ctx.fillStyle = '#cfd6ea';
        ctx.fillText('Best ' + loadBest(players[0] ? players[0].pet : p1pet), W - 16, 30);
      } else {
        ctx.font = "800 26px 'Nunito', sans-serif";
        ctx.textAlign = 'left';
        ctx.fillStyle = PETS[players[0].pet].body;
        ctx.strokeText('P1  ' + players[0].score, 16, 36); ctx.fillText('P1  ' + players[0].score, 16, 36);
        ctx.textAlign = 'right';
        ctx.fillStyle = PETS[players[1].pet].body;
        ctx.strokeText('P2  ' + players[1].score, W - 16, 36); ctx.fillText('P2  ' + players[1].score, W - 16, 36);
      }
      ctx.textAlign = 'left';
    }

    function draw() {
      // sky / backdrop
      ctx.fillStyle = '#1a2440';
      ctx.fillRect(0, 0, W, H);

      const lo = Math.floor(camZ) - VIS_BACK, hi = Math.ceil(camZ) + VIS_FWD;
      const showPets = (state === 'playing' || state === 'dying');
      // painter's: far rows first (high z), near last (low z)
      for (let z = hi; z >= lo; z--) {
        const row = rows[z]; if (!row) continue;
        drawLaneBand(row);
        drawRowObjects(row);
        if (showPets) {
          for (let i = 0; i < players.length; i++) {
            if (Math.round(players[i].z) === z) drawPet(players[i], i);
          }
        }
      }
      // 1P looming-eagle warning: a growing shadow over the pet as the idle timer runs out
      if (numPlayers === 1 && state === 'playing' && players[0] && idleMs > IDLE_MS - IDLE_WARN_MS) {
        const k = (idleMs - (IDLE_MS - IDLE_WARN_MS)) / IDLE_WARN_MS;   // 0 → 1
        const cx = colX(players[0].x), cy = rowY(players[0].z);
        ctx.fillStyle = 'rgba(0,0,0,' + (0.12 + k * 0.32).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 13 + k * 22, 6 + k * 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (eagle) drawEagle();
      if (state !== 'select') drawHUD();
    }

    // ---------- main loop ----------
    function loop(ts) {
      if (ts == null) ts = lastTs + 16.7;
      dtMs = Math.min(Math.max(ts - lastTs, 1), 100);  // clamp tab-switch gaps; refresh-rate independent
      dtf = dtMs / 16.6667;
      lastTs = ts;
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>

  <script>
    // On desktop the homepage loads this game in a pane. Hide only the "‹ Games" back link
    // (it would reload the homepage inside the pane) while keeping the Pacifico game title
    // visible. Standalone/mobile (top-level) pages keep the full topbar.
    if (window.self !== window.top) {
      var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
    }
  </script>
