<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;

    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);

  @media (min-width: 768px) {

  }

  h1 {
    margin: 18px 0 10px;
    font-family: 'Pacifico', cursive;
    font-size: 34px;
    color: #fff;
    font-weight: 400;
  }

  /* ---------- top bar (back to games) ---------- */
  .topbar {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: flex-start;

  }
  .back {
    color: rgba(255,255,255,0.85);

    font-weight: 800;

  }
  .back:hover { color: #fff; background: rgba(255,255,255,0.12); }

  /* ---------- start dialog (shared format) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 28, 0.86);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .panel {
    width: 100%;
    max-width: 380px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 24px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    text-shadow: none;
  }
  .panel h2 {
    font-family: 'Pacifico', cursive;
    color: #fff;
    font-size: 1.7rem;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .panel .sub { color: #a0a8c0; font-size: 0.9rem; margin-bottom: 18px; }
  .panel .group-label { color: #ffe8b0; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin: 16px 0 8px; }
  .choices { display: flex; gap: 10px; justify-content: center; }
  .choice {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: #cfd6ea;
    background: #0f1830;
    border: 2px solid #0f3460;
    border-radius: 14px;
    padding: 14px 6px;
    cursor: pointer;
    text-shadow: none;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .choice .big { display: block; font-size: 1.5rem; line-height: 1.2; color: #fff; }
  .choice .small { display: block; font-size: 0.68rem; color: #8b93b0; font-weight: 700; margin-top: 2px; }
  .choice:hover { border-color: #6f86c4; }
  .choice:active { transform: scale(0.96); }
  .choice.selected {
    border-color: #e94560;
    background: rgba(233, 69, 96, 0.12);
    color: #fff;
    box-shadow: 0 0 18px rgba(233, 69, 96, 0.25);
  }
  .choice.selected .small { color: #ffb3c2; }
  .start-btn {
    margin-top: 22px;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: #fff;
    background: #e94560;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    text-shadow: none;
    box-shadow: 0 6px 0 #b22a44;

  .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b22a44; }

  /* ---------- game area ---------- */
  #game { display: none; flex-direction: column; align-items: center; }

  /* board */
  #board-wrap { position: relative; margin: 8px auto; width: 100%; max-width: 1180px; padding: 0 10px; display: flex; justify-content: center; }
  canvas#board {

    margin: 0 auto;

    /* Fit the WHOLE board within the screen (height included) so it's fully visible at once;
       the board keeps its aspect ratio and you can pinch-zoom for a closer look. */
    max-height: calc(100vh - 220px);
    max-height: calc(100dvh - 220px);
    width: auto;
    height: auto;
    border: 4px solid rgba(255,255,255,0.5);

    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* info bar */
  #info {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 6px;
  }
  .player-tag {
    font-size: 13px;

  #message {

  /* On the tall portrait board, keep the roll button reachable without scrolling to the bottom. */

  #dice-display {

  /* winner overlay */

  #winner-overlay.show { display: flex; }
  #winner-box {

    padding: 40px 50px;
    text-align: center;
  }
  #winner-box h2 { font-family: 'Pacifico', cursive; font-size: 28px; margin-bottom: 18px; color: #fff5c0; text-shadow: 2px 3px 0 #c03060; }
  #winner-box button {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 28px;
    margin-top: 10px;
    cursor: pointer;
    background: #e83c6a;
    color: #fff;
    border: none;
    border-radius: 50px;
    box-shadow: 0 4px 0 #a02045, 0 6px 14px rgba(0,0,0,0.3);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
  }
</style>

<script>
/* ---- constants ---- */
// Phones (portrait) get a tall 10-wide board; desktop/landscape keeps the classic wide 30×10.
const PORTRAIT = window.matchMedia('(max-width: 767px)').matches;
const COLS = PORTRAIT ? 10 : 30;
const ROWS = PORTRAIT ? 30 : 10;
const TOTAL = COLS * ROWS;            // 300 either way
const CELL = 40;                      // px per cell (horizontal)
const CELL_H = PORTRAIT ? 40 : 60;    // square cells in portrait; 1.5× vertical stretch in landscape
const PLAYER_COLORS = ['#e83238','#3a70ff','#26c96e','#ff9c2a'];
const PLAYER_NAMES  = ['Dan','Elise','Luke','PiJiu'];
const DICE_FACES = ['\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];

/* ---- custom player names set on the homepage (localStorage) ---- */
function playerName(i, fallback) {
  try { var a = JSON.parse(localStorage.getItem('elise.playerNames')); var n = (a && a[i] != null ? String(a[i]) : '').trim(); return n || fallback; }
  catch (e) { return fallback; }
}

/* ---- state ---- */
let numPlayers, positions, currentPlayer, snakes, ladders, animating;
let snakePaths = {};      // head square -> {midX, midY} bezier control point
let playerAnimPos = {};   // player index -> {x, y} during path animation
let cannons = {};         // square -> end-of-row destination
let magnets = {};         // triggerSq -> destSq (the magnet's own square)
let bombs   = new Set();  // squares with bombs

/* ---- board helpers ---- */
function sqToRC(sq) {
  // sq 1..100 -> {r,c} where r=0 is bottom row
  const idx = sq - 1;
  const row = Math.floor(idx / COLS);
  const col = (row % 2 === 0) ? idx % COLS : (COLS - 1 - idx % COLS);
  return { r: row, c: col };
}

// Inverse of sqToRC: visual row/col -> square number
function rcToSq(r, c) {
  return r % 2 === 0 ? r * COLS + c + 1 : (r + 1) * COLS - c;
}

function sqToXY(sq) {
  const {r, c} = sqToRC(sq);
  return { x: c * CELL + CELL / 2, y: (ROWS - 1 - r) * CELL_H + CELL_H / 2 };
}

/* ---- random snakes & ladders ---- */
function generateSnakesAndLadders() {
  snakes = {};
  ladders = {};
  const used = new Set([1, TOTAL]);

  function pick(min, max) {
    let s;
    do { s = Math.floor(Math.random() * (max - min + 1)) + min; } while (used.has(s));
    used.add(s);
    return s;
  }

  // 15 ladders: bottom goes up
  for (let i = 0; i < 15; i++) {
    const bottom = pick(2, Math.floor(TOTAL * 0.75));
    const topSq = pick(bottom + COLS, TOTAL - 1);
    if (topSq <= bottom) continue;
    ladders[bottom] = topSq;
  }

  // 5 snakes with heads in the top row
  const topRowStart = TOTAL - COLS + 1;
  for (let i = 0; i < 5; i++) {
    const head = pick(topRowStart, TOTAL - 1);
    const tail = pick(2, head - COLS);
    if (tail >= head) continue;
    snakes[head] = tail;
  }

  // 8 snakes spread across the rest of the board (rows 1–8)
  for (let i = 0; i < 8; i++) {
    const head = pick(COLS + 1, topRowStart - 1);
    const tail = pick(2, head - COLS);
    if (tail >= head) continue;
    snakes[head] = tail;
  }

  // 1 cannon per row — fires player to the last square in the row
  cannons = {};
  for (let r = 0; r < ROWS; r++) {
    const rowStart = r * COLS + 1;
    const rowEnd   = (r + 1) * COLS;
    const candidates = [];
    for (let sq = rowStart; sq < rowEnd; sq++) {
      if (!used.has(sq)) candidates.push(sq);
    }
    if (candidates.length === 0) continue;
    const sq = candidates[Math.floor(Math.random() * candidates.length)];
    cannons[sq] = rowEnd;
    used.add(sq);
  }

  // 8 magnets — one per pair of vertically adjacent squares
  // a "point-down" magnet at row r pulls up anyone landing on row r-1 (same column)
  // a "point-up"   magnet at row r pulls down anyone landing on row r+1 (same column)
  magnets = {};
  let magnetCount = 0, mAttempts = 0;
  while (magnetCount < 8 && mAttempts < 300) {
    mAttempts++;
    const pointDown = Math.random() < 0.5;
    const destR = pointDown
      ? Math.floor(Math.random() * (ROWS - 1)) + 1   // rows 1–9, trigger one row below
      : Math.floor(Math.random() * (ROWS - 1));        // rows 0–8, trigger one row above
    const trigR = pointDown ? destR - 1 : destR + 1;
    const c = Math.floor(Math.random() * COLS);
    const destSq = rcToSq(destR, c);
    const trigSq = rcToSq(trigR, c);
    if (used.has(destSq) || used.has(trigSq)) continue;
    if (destSq === 1 || destSq === TOTAL || trigSq === 1 || trigSq === TOTAL) continue;
    magnets[trigSq] = destSq;
    used.add(destSq);
    used.add(trigSq);
    magnetCount++;
  }

  // 10 bombs scattered randomly
  bombs = new Set();
  let bombCount = 0, bAttempts = 0;
  while (bombCount < 10 && bAttempts < 300) {
    bAttempts++;
    const sq = Math.floor(Math.random() * (TOTAL - 2)) + 2;
    if (used.has(sq)) continue;
    bombs.add(sq);
    used.add(sq);
    bombCount++;
  }

  // pre-compute bezier control points for each snake (used in drawing + animation)
  snakePaths = {};
  for (const [head, tail] of Object.entries(snakes)) {
    const a = sqToXY(+head);
    const b = sqToXY(tail);
    snakePaths[+head] = {
      midX: (a.x + b.x) / 2 + (Math.random() - 0.5) * 40,
      midY: (a.y + b.y) / 2,
    };
  }
}

/* ---- drawing ---- */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = COLS * CELL;     // intrinsic resolution; CSS scales it to fit the screen
canvas.height = ROWS * CELL_H;

// Offscreen cache for the static board — redrawn only once per game
const boardCache = document.createElement('canvas');
boardCache.width = COLS * CELL;
boardCache.height = ROWS * CELL_H;
const bctx = boardCache.getContext('2d');

// Tropical tile palette — golden sand / turquoise water
const BLOCK_COLORS = [
  { base: '#f0d070', shade: '#d4b050', hi: '#fae898' }, // golden sand
  { base: '#3ec8be', shade: '#28a89e', hi: '#60dcd4' }, // tropical water
];

// Renders the static board (tiles + ladders + snakes) to the offscreen cache.
// Call once after generating snakes/ladders; render() blits the result each frame.
function drawBoard() {
  bctx.clearRect(0, 0, boardCache.width, boardCache.height);

  // draw cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const sq = squareAt(r, c);
      const px = c * CELL;
      const py = (ROWS - 1 - r) * CELL_H;
      const pal = (r + c) % 2 === 0 ? BLOCK_COLORS[0] : BLOCK_COLORS[1];

      bctx.fillStyle = pal.base;
      bctx.fillRect(px, py, CELL, CELL_H);

      // subtle texture speckles
      for (let i = 0; i < 12; i++) {
        const nx = px + Math.random() * CELL;
        const ny = py + Math.random() * CELL_H;
        bctx.fillStyle = Math.random() > 0.5 ? pal.shade : pal.hi;
        bctx.fillRect(Math.floor(nx), Math.floor(ny), 2, 2);
      }

      bctx.strokeStyle = 'rgba(0,0,0,0.3)';
      bctx.strokeRect(px, py, CELL, CELL_H);

      bctx.fillStyle = 'rgba(0,0,0,0.35)';
      bctx.font = 'bold 9px "Nunito", sans-serif';
      bctx.fillText(sq, px + 3, py + 11);
    }
  }

  // draw ladders
  bctx.lineWidth = 6;
  for (const [from, to] of Object.entries(ladders)) {
    const a = sqToXY(+from);
    const b = sqToXY(+to);
    const dx = 6;
    bctx.strokeStyle = '#c8a030';
    bctx.shadowColor = 'rgba(0,0,0,0.4)';
    bctx.shadowBlur = 3;
    bctx.shadowOffsetX = 2;
    bctx.shadowOffsetY = 2;
    for (const off of [-dx, dx]) {
      bctx.beginPath();
      bctx.moveTo(a.x + off, a.y);
      bctx.lineTo(b.x + off, b.y);
      bctx.stroke();
    }
    bctx.lineWidth = 3;
    bctx.strokeStyle = '#a07820';
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const rungs = Math.floor(dist / 30);
    for (let i = 1; i <= rungs; i++) {
      const t = i / (rungs + 1);
      const mx = a.x + (b.x - a.x) * t;
      const my = a.y + (b.y - a.y) * t;
      bctx.beginPath();
      bctx.moveTo(mx - dx, my);
      bctx.lineTo(mx + dx, my);
      bctx.stroke();
    }
    bctx.lineWidth = 6;
    bctx.shadowBlur = 0;
    bctx.shadowOffsetX = 0;
    bctx.shadowOffsetY = 0;
  }

  // draw snakes
  bctx.lineWidth = 5;
  for (const [from, to] of Object.entries(snakes)) {
    const a = sqToXY(+from);
    const b = sqToXY(+to);
    bctx.strokeStyle = '#d83868';
    bctx.shadowColor = 'rgba(0,0,0,0.4)';
    bctx.shadowBlur = 3;
    bctx.shadowOffsetX = 2;
    bctx.shadowOffsetY = 2;
    const { midX, midY } = snakePaths[+from];
    bctx.beginPath();
    bctx.moveTo(a.x, a.y);
    bctx.quadraticCurveTo(midX, midY, b.x, b.y);
    bctx.stroke();
    bctx.shadowBlur = 0;
    bctx.shadowOffsetX = 0;
    bctx.shadowOffsetY = 0;
    bctx.fillStyle = '#a02050';
    bctx.beginPath();
    bctx.arc(a.x, a.y, 7, 0, Math.PI * 2);
    bctx.fill();
    bctx.fillStyle = '#ffe040';
    bctx.beginPath(); bctx.arc(a.x - 3, a.y - 2, 2, 0, Math.PI * 2); bctx.fill();
    bctx.beginPath(); bctx.arc(a.x + 3, a.y - 2, 2, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#000';
    bctx.beginPath(); bctx.arc(a.x - 3, a.y - 2, 1, 0, Math.PI * 2); bctx.fill();
    bctx.beginPath(); bctx.arc(a.x + 3, a.y - 2, 1, 0, Math.PI * 2); bctx.fill();
  }

  // draw cannons
  for (const fromSq of Object.keys(cannons)) {
    const { x, y } = sqToXY(+fromSq);
    const row = Math.floor((+fromSq - 1) / COLS);
    const dir = row % 2 === 0 ? 1 : -1; // +1 right, -1 left

    // wheels
    bctx.fillStyle = '#3a2008';
    bctx.beginPath(); bctx.arc(x - 5, y + 7, 4, 0, Math.PI * 2); bctx.fill();
    bctx.beginPath(); bctx.arc(x + 5, y + 7, 4, 0, Math.PI * 2); bctx.fill();

    // carriage
    bctx.fillStyle = '#7a4010';
    bctx.fillRect(x - 8, y + 2, 16, 6);

    // barrel (points in row direction)
    bctx.fillStyle = '#3a3a3a';
    const bx = dir > 0 ? x - 4 : x - 12;
    bctx.fillRect(bx, y - 5, 16, 7);

    // muzzle flash
    bctx.fillStyle = '#ffb020';
    const mx = dir > 0 ? x + 12 : x - 12;
    bctx.beginPath(); bctx.arc(mx, y - 1, 4, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#fff';
    bctx.beginPath(); bctx.arc(mx, y - 1, 2, 0, Math.PI * 2); bctx.fill();
  }

  // draw magnets
  for (const [trigSq, destSq] of Object.entries(magnets)) {
    const { x, y } = sqToXY(+destSq);
    const destRow = Math.floor((+destSq - 1) / COLS);
    const trigRow = Math.floor((+trigSq - 1) / COLS);
    const openDown = destRow > trigRow; // magnet is above trigger → poles face down

    const hw = 6, leg = 8, arc = 6; // half-width, leg length, arc radius
    bctx.lineWidth = 4;
    bctx.lineCap = 'round';

    if (openDown) {
      // ∩ shape — arc at top (clockwise π→0 = upward arc in canvas), legs hang down
      bctx.strokeStyle = '#dd2222';
      bctx.beginPath(); bctx.moveTo(x - hw, y - arc); bctx.lineTo(x - hw, y + leg); bctx.stroke();
      bctx.strokeStyle = '#2244dd';
      bctx.beginPath(); bctx.moveTo(x + hw, y - arc); bctx.lineTo(x + hw, y + leg); bctx.stroke();
      bctx.strokeStyle = '#bbb'; bctx.lineWidth = 4;
      bctx.beginPath(); bctx.arc(x, y - arc, hw, Math.PI, 0, false); bctx.stroke();
      bctx.fillStyle = '#dd2222'; bctx.beginPath(); bctx.arc(x - hw, y + leg, 3, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#2244dd'; bctx.beginPath(); bctx.arc(x + hw, y + leg, 3, 0, Math.PI * 2); bctx.fill();
    } else {
      // U shape — arc at bottom, legs point upward
      bctx.strokeStyle = '#dd2222';
      bctx.beginPath(); bctx.moveTo(x - hw, y + arc); bctx.lineTo(x - hw, y - leg); bctx.stroke();
      bctx.strokeStyle = '#2244dd';
      bctx.beginPath(); bctx.moveTo(x + hw, y + arc); bctx.lineTo(x + hw, y - leg); bctx.stroke();
      bctx.strokeStyle = '#bbb'; bctx.lineWidth = 4;
      bctx.beginPath(); bctx.arc(x, y + arc, hw, 0, Math.PI, false); bctx.stroke();
      bctx.fillStyle = '#dd2222'; bctx.beginPath(); bctx.arc(x - hw, y - leg, 3, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#2244dd'; bctx.beginPath(); bctx.arc(x + hw, y - leg, 3, 0, Math.PI * 2); bctx.fill();
    }

    bctx.lineCap = 'butt';
  }

  // draw bombs
  for (const sq of bombs) {
    const { x, y } = sqToXY(sq);
    // body
    bctx.fillStyle = '#1a1a1a';
    bctx.beginPath(); bctx.arc(x, y + 3, 8, 0, Math.PI * 2); bctx.fill();
    // shine
    bctx.fillStyle = 'rgba(255,255,255,0.25)';
    bctx.beginPath(); bctx.arc(x - 2.5, y, 3, 0, Math.PI * 2); bctx.fill();
    // fuse cord
    bctx.strokeStyle = '#888'; bctx.lineWidth = 2; bctx.lineCap = 'round';
    bctx.beginPath();
    bctx.moveTo(x + 5, y - 4);
    bctx.quadraticCurveTo(x + 11, y - 9, x + 9, y - 16);
    bctx.stroke();
    // spark
    bctx.fillStyle = '#ffcc00';
    bctx.beginPath(); bctx.arc(x + 9, y - 16, 3.5, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#ff6600';
    bctx.beginPath(); bctx.arc(x + 9, y - 16, 1.5, 0, Math.PI * 2); bctx.fill();
    bctx.lineCap = 'butt';
  }

  bctx.lineWidth = 1;
}

function squareAt(r, c) {
  const idx = r * COLS;
  return (r % 2 === 0) ? idx + c + 1 : idx + (COLS - 1 - c) + 1;
}

function drawToken(pi, px, py) {
  const col = PLAYER_COLORS[pi];

  // drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + 1, py + 9, 7, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // left ear
  ctx.fillStyle = col;
  ctx.save();
  ctx.translate(px - 5, py - 6);
  ctx.rotate(-0.35);
  ctx.beginPath();
  ctx.ellipse(0, -5, 3.5, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,220,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, -5, 1.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // right ear
  ctx.fillStyle = col;
  ctx.save();
  ctx.translate(px + 5, py - 6);
  ctx.rotate(0.35);
  ctx.beginPath();
  ctx.ellipse(0, -5, 3.5, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,220,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, -5, 1.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // head outline / shadow ring
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.arc(px, py, 9.5, 0, Math.PI * 2);
  ctx.fill();

  // head
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, Math.PI * 2);
  ctx.fill();

  // eye whites
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(px - 3, py - 2, 2.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(px + 3, py - 2, 2.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // pupils
  ctx.fillStyle = '#10103a';
  ctx.beginPath();
  ctx.arc(px - 3, py - 1.5, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px + 3, py - 1.5, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // nose dots
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.arc(px - 1.3, py + 2.5, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px + 1.3, py + 2.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // smile
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(px, py + 1.5, 4, 0.25, Math.PI - 0.25);
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.lineWidth = 1;
}

function drawPlayers() {
  // gather square-based positions, skipping players currently path-animating
  const groups = {};
  positions.forEach((sq, i) => {
    if (sq < 1 || playerAnimPos[i]) return;
    if (!groups[sq]) groups[sq] = [];
    groups[sq].push(i);
  });

  const offsets = [[-13,-10],[13,-10],[-13,10],[13,10]];
  for (const [sq, pList] of Object.entries(groups)) {
    const { x, y } = sqToXY(+sq);
    pList.forEach((pi, oi) => {
      const off = pList.length > 1 ? offsets[oi] : [0, 0];
      drawToken(pi, x + off[0], y + off[1]);
    });
  }

  // draw players following a snake/ladder path at their pixel position
  for (const [pi, pos] of Object.entries(playerAnimPos)) {
    drawToken(+pi, pos.x, pos.y);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(boardCache, 0, 0);
  drawPlayers();
}

/* ---- UI ---- */
function updateInfo() {
  const info = document.getElementById('info');
  info.innerHTML = '';
  for (let i = 0; i < numPlayers; i++) {
    const tag = document.createElement('span');
    tag.className = 'player-tag' + (i === currentPlayer ? ' active' : '');
    tag.style.background = PLAYER_COLORS[i];
    tag.style.boxShadow = `inset -2px -2px 0 rgba(0,0,0,.4), inset 2px 2px 0 rgba(255,255,255,.2), 2px 2px 0 #000`;
    tag.textContent = `${playerName(i, PLAYER_NAMES[i])}: ${positions[i]}`;
    info.appendChild(tag);
  }
}

function setMessage(msg) {
  document.getElementById('message').textContent = msg;
}

/* ---- game logic ---- */
function startGame(n) {
  numPlayers = n;
  positions = Array(n).fill(0);
  currentPlayer = Math.floor(Math.random() * n);
  animating = false;
  playerAnimPos = {};
  generateSnakesAndLadders();
  drawBoard(); // cache static board once
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  updateInfo();
  setMessage(`${playerName(currentPlayer, PLAYER_NAMES[currentPlayer])} goes first — roll the dice!`);
  render();
}

function rollDice() {
  if (animating) return;
  const roll = Math.floor(Math.random() * 6) + 1;
  document.getElementById('dice-display').textContent = DICE_FACES[roll - 1];
  const btn = document.getElementById('roll-btn');
  btn.disabled = true;
  animating = true;

  const name = playerName(currentPlayer, PLAYER_NAMES[currentPlayer]);
  let target = positions[currentPlayer] + roll;

  if (target > TOTAL) {
    setMessage(`${name} rolled ${roll} — can't move past 100!`);
    animating = false;
    btn.disabled = false;
    nextTurn();
    return;
  }

  setMessage(`${name} rolled ${roll}!`);

  // animate step by step
  animateMove(currentPlayer, positions[currentPlayer], target, () => {
    positions[currentPlayer] = target;

    // check snake or ladder
    if (ladders[target]) {
      setMessage(`${name} climbed a ladder from ${target} to ${ladders[target]}!`);
      const dest = ladders[target];
      setTimeout(() => {
        animateAlongLadder(currentPlayer, target, dest, () => {
          positions[currentPlayer] = dest;
          render();
          finishTurn();
        });
      }, 400);
    } else if (snakes[target]) {
      setMessage(`${name} got bitten! Slides from ${target} to ${snakes[target]}!`);
      const dest = snakes[target];
      setTimeout(() => {
        animateAlongSnake(currentPlayer, target, dest, () => {
          positions[currentPlayer] = dest;
          render();
          finishTurn();
        });
      }, 400);
    } else if (cannons[target]) {
      const dest = cannons[target];
      setMessage(`${name} was fired by a cannon to ${dest}! 💥`);
      setTimeout(() => {
        animateAlongCannon(currentPlayer, target, dest, () => {
          positions[currentPlayer] = dest;
          render();
          finishTurn();
        });
      }, 400);
    } else if (magnets[target]) {
      const dest = magnets[target];
      const destRow = Math.floor((dest - 1) / COLS);
      const trigRow = Math.floor((target - 1) / COLS);
      const dir = destRow > trigRow ? 'up' : 'down';
      setMessage(`${name} was pulled ${dir} by a magnet to ${dest}!`);
      setTimeout(() => {
        animateMagnetPull(currentPlayer, target, dest, () => {
          positions[currentPlayer] = dest;
          render();
          finishTurn();
        });
      }, 400);
    } else if (bombs.has(target)) {
      const dirs = ['N','S','E','W'];
      const dir = dirs[Math.floor(Math.random() * 4)];
      const dest = blastDest(target, dir);
      setMessage(`${name} hit a bomb! Blasted ${dirLabel(dir)} to ${dest}! 💥`);
      setTimeout(() => {
        animateBlast(currentPlayer, target, dest, () => {
          positions[currentPlayer] = dest;
          render();
          finishTurn();
        });
      }, 400);
    } else {
      const adj = adjacentBomb(target);
      if (adj) {
        const dest = blastDest(target, adj.dir);
        setMessage(`${name} was caught in a blast! Blown ${dirLabel(adj.dir)} to ${dest}! 💥`);
        setTimeout(() => {
          animateBlast(currentPlayer, target, dest, () => {
            positions[currentPlayer] = dest;
            render();
            finishTurn();
          });
        }, 400);
      } else {
        finishTurn();
      }
    }
  });
}

// Returns the blast direction (away from the bomb) if sq is adjacent to one, or null
function adjacentBomb(sq) {
  const { r, c } = sqToRC(sq);
  // dr/dc = offset to check for a bomb; dir = direction player is blown (away from bomb)
  const checks = [
    { dr: -1, dc:  0, dir: 'N' }, // bomb is below you  → blown up
    { dr:  1, dc:  0, dir: 'S' }, // bomb is above you  → blown down
    { dr:  0, dc: -1, dir: 'E' }, // bomb is to your left  → blown right
    { dr:  0, dc:  1, dir: 'W' }, // bomb is to your right → blown left
  ];
  for (const { dr, dc, dir } of checks) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
    if (bombs.has(rcToSq(nr, nc))) return { dir };
  }
  return null;
}

// Destination after blast: up/down = 5 rows, left/right = 20 cols
function blastDest(sq, dir) {
  const { r, c } = sqToRC(sq);
  let nr = r, nc = c;
  if      (dir === 'N') nr = Math.min(ROWS - 1, r + 5);
  else if (dir === 'S') nr = Math.max(0,         r - 5);
  else if (dir === 'E') nc = Math.min(COLS - 1,  c + 20);
  else if (dir === 'W') nc = Math.max(0,          c - 20);
  return Math.min(TOTAL, Math.max(1, rcToSq(nr, nc)));
}

function dirLabel(dir) {
  return { N: 'up', S: 'down', E: 'right', W: 'left' }[dir];
}

function animateMove(player, from, to, cb) {
  const step = from < to ? 1 : -1;
  let cur = from;
  function tick() {
    if (cur === to) { cb(); return; }
    cur += step;
    positions[player] = cur;
    render();
    setTimeout(tick, 100);
  }
  tick();
}

function animateBlast(player, fromSq, toSq, cb) {
  const a = sqToXY(fromSq);
  const b = sqToXY(toSq);
  const DURATION = 300;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    const ease = 1 - Math.pow(1 - t, 2); // ease-out: fast launch, settles
    playerAnimPos[player] = { x: a.x + (b.x - a.x) * ease, y: a.y + (b.y - a.y) * ease };
    render();
    if (t < 1) { requestAnimationFrame(tick); }
    else { delete playerAnimPos[player]; cb(); }
  }
  requestAnimationFrame(tick);
}

function animateMagnetPull(player, fromSq, toSq, cb) {
  const a = sqToXY(fromSq);
  const b = sqToXY(toSq);
  const DURATION = 450;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    const ease = t * t; // ease-in: slow start, accelerates as pulled in
    playerAnimPos[player] = { x: a.x + (b.x - a.x) * ease, y: a.y + (b.y - a.y) * ease };
    render();
    if (t < 1) { requestAnimationFrame(tick); }
    else { delete playerAnimPos[player]; cb(); }
  }
  requestAnimationFrame(tick);
}

function animateAlongCannon(player, fromSq, toSq, cb) {
  const a = sqToXY(fromSq);
  const b = sqToXY(toSq);
  const DURATION = 350;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    const ease = 1 - Math.pow(1 - t, 3); // ease-out cubic — fast launch
    const arc  = Math.sin(t * Math.PI) * 20; // small upward arc
    playerAnimPos[player] = { x: a.x + (b.x - a.x) * ease, y: a.y - arc };
    render();
    if (t < 1) { requestAnimationFrame(tick); }
    else { delete playerAnimPos[player]; cb(); }
  }
  requestAnimationFrame(tick);
}

function animateAlongLadder(player, fromSq, toSq, cb) {
  const a = sqToXY(fromSq);
  const b = sqToXY(toSq);
  const DURATION = 500;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    playerAnimPos[player] = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    render();
    if (t < 1) { requestAnimationFrame(tick); }
    else { delete playerAnimPos[player]; cb(); }
  }
  requestAnimationFrame(tick);
}

function animateAlongSnake(player, fromSq, toSq, cb) {
  const a = sqToXY(fromSq);
  const b = sqToXY(toSq);
  const { midX, midY } = snakePaths[fromSq];
  const DURATION = 500;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    const x = (1-t)*(1-t)*a.x + 2*(1-t)*t*midX + t*t*b.x;
    const y = (1-t)*(1-t)*a.y + 2*(1-t)*t*midY + t*t*b.y;
    playerAnimPos[player] = { x, y };
    render();
    if (t < 1) { requestAnimationFrame(tick); }
    else { delete playerAnimPos[player]; cb(); }
  }
  requestAnimationFrame(tick);
}

function finishTurn() {
  const btn = document.getElementById('roll-btn');
  if (positions[currentPlayer] === TOTAL) {
    // winner!
    render();
    document.getElementById('winner-text').textContent =
      `${playerName(currentPlayer, PLAYER_NAMES[currentPlayer])} WINS!`;
    document.getElementById('winner-overlay').classList.add('show');
    return;
  }
  animating = false;
  btn.disabled = false;
  nextTurn();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % numPlayers;
  updateInfo();
  setMessage(`${playerName(currentPlayer, PLAYER_NAMES[currentPlayer])}'s turn — roll the dice!`);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !document.getElementById('roll-btn').disabled) {
    e.preventDefault();
    rollDice();
  }
});

/* ---- Start dialog wiring ---- */
(function () {
  let chosenPlayers = 2;
  const playerChoices = document.getElementById('player-choices');
  function selectChoice(el) {
    playerChoices.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }
  playerChoices.addEventListener('click', e => {
    const btn = e.target.closest('.choice');
    if (!btn) return;
    chosenPlayers = parseInt(btn.dataset.players, 10);
    selectChoice(btn);
  });
  document.getElementById('start-btn').addEventListener('click', () => startGame(chosenPlayers));
  // default selection
  selectChoice(playerChoices.querySelector('[data-players="2"]'));
})();
</script>

  // On desktop the homepage loads this game in a pane; hide the redundant "‹ Games"
  // back link there. Standalone/mobile (top-level) pages keep it.
  if (window.self !== window.top) {
    var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
  }
</script>
