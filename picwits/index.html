<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PicWits</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../shared/game.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E&L Games">
  <link rel="icon" href="../icons/favicon.png">
  <script src="../pwa.js" defer></script>
  <style>
    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 16px;
      justify-content: flex-start; touch-action: auto; /* leak-reset: orig had neither; shared sets center/none */
      user-select: none; -webkit-user-select: none;
    }

    .topbar {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }

    /* ---------- scoreboard (3 players + roles) ---------- */
    .roles { width: 100%; max-width: 480px; display: flex; gap: 8px; margin: 6px 0 12px; }
    .pchip {
      flex: 1; background: #16213e; border: 2px solid #0f3460; border-radius: 14px;
      padding: 8px 6px; text-align: center; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .pchip .nm { color: #cfd6ea; font-size: 0.78rem; font-weight: 800; }
    .pchip .sc { color: #fff; font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
    .pchip .role { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; min-height: 0.8rem; color: #6f7799; }
    .pchip.judge { border-color: #ffd23f; box-shadow: 0 0 16px rgba(255,210,63,0.28); }
    .pchip.judge .role { color: #ffd23f; }
    .pchip.picker { border-color: #e94560; box-shadow: 0 0 16px rgba(233,69,96,0.28); }
    .pchip.picker .role { color: #ff8aa0; }

    .caption {
      width: 100%; max-width: 480px; background: #fff; color: #1a1a2e;
      border-radius: 18px; padding: 18px 20px; font-size: 1.2rem; font-weight: 800;
      line-height: 1.3; text-align: center; position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35); margin-bottom: 18px;
    }
    .caption::after {
      content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
      border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 14px solid #fff;
    }

    .turn-label { color: #ffe8b0; font-weight: 800; font-size: 0.95rem; margin-bottom: 12px; text-align: center; min-height: 1.2em; }

    /* ---------- card areas ---------- */
    .hand, .duel { width: 100%; max-width: 480px; display: grid; gap: 10px; }
    .hand { grid-template-columns: repeat(3, 1fr); }
    .duel { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 380px) { .hand { grid-template-columns: repeat(2, 1fr); } }

    .card {
      position: relative; background: #0f1830; border: 3px solid #0f3460; border-radius: 16px;
      overflow: hidden; cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .hand .card { aspect-ratio: 1 / 1; }
    .duel .card { aspect-ratio: 3 / 4; }
    .card:hover:not(.locked) { border-color: #e94560; transform: translateY(-2px); box-shadow: 0 0 22px rgba(233,69,96,0.25); }
    .card:active:not(.locked) { transform: scale(0.98); }
    .card.locked { cursor: default; }
    .card.correct { border-color: #46c46a; box-shadow: 0 0 26px rgba(70,196,106,0.55); }
    .card.dim { opacity: 0.4; }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.3s ease; }
    .card img.loaded { opacity: 1; }
    .card .spinner {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #3d4466;
      background: linear-gradient(100deg, #14203c 30%, #1b2a4a 50%, #14203c 70%);
      background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .feedback { min-height: 26px; margin-top: 16px; font-size: 1.15rem; font-weight: 800; text-align: center; color: #cfd6ea; }
    .feedback.good { color: #7be39a; }

    .next-btn, .start-btn {
      margin-top: 16px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.05rem;
      color: #fff; background: #e94560; border: none; border-radius: 16px; padding: 14px 30px;
      cursor: pointer; box-shadow: 0 6px 0 #b22a44; transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .next-btn:active, .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b22a44; }
    .next-btn[hidden] { display: none; }

    /* once-per-game hand reshuffle */
    .swapwrap { width: 100%; max-width: 480px; display: flex; justify-content: center; }
    .swapwrap:empty { display: none; }
    .swap-btn {
      margin-top: 14px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
      color: #ffd23f; background: rgba(255,210,63,0.1); border: 2px solid #ffd23f; border-radius: 14px;
      padding: 11px 22px; cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
    }
    .swap-btn:hover { background: rgba(255,210,63,0.2); }
    .swap-btn:active { transform: scale(0.96); }

    /* ---------- overlays (setup + pass-the-device) ---------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(10,14,28,0.92); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20;
    }
    .panel {
      width: 100%; max-width: 380px; background: #16213e; border: 2px solid #0f3460;
      border-radius: 24px; padding: 26px 22px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }
    .panel h2 { font-family: 'Pacifico', cursive; color: #fff; font-size: 1.8rem; font-weight: 400; margin-bottom: 8px; }
    .panel .sub { color: #a0a8c0; font-size: 0.95rem; line-height: 1.45; margin-bottom: 6px; }
    .pass-emoji { font-size: 3rem; margin-bottom: 6px; }
    .role-pill { display: inline-block; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.6px; padding: 4px 12px; border-radius: 20px; margin: 4px 0 10px; }
    .role-pill.picker { background: rgba(233,69,96,0.18); color: #ff8aa0; }
    .role-pill.judge { background: rgba(255,210,63,0.18); color: #ffd23f; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html" class="back">‹ Games</a>
    <span class="title">PicWits</span>
    <span style="width:56px"></span>
  </div>

  <div class="roles" id="scores"></div>
  <div class="caption" id="caption">…</div>
  <div class="turn-label" id="turn"></div>
  <div id="cards"></div>
  <div class="swapwrap" id="swapwrap"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next" hidden>Next round ›</button>

  <!-- Setup -->
  <div class="overlay" id="setup">
    <div class="panel">
      <h2>PicWits</h2>
      <div class="sub">A 3-player pass-&amp;-play game. Two players each pick the funniest picture for the caption — the third <b style="color:#ffd23f">judges</b> which wins. Roles rotate every round! 🤪</div>
      <button class="start-btn" id="start">Start · 3 Players</button>
    </div>
  </div>

  <!-- Pass the device -->
  <div class="overlay" id="pass" hidden>
    <div class="panel">
      <div class="pass-emoji">🙈</div>
      <h2 id="pass-name">Player 1</h2>
      <div class="role-pill" id="pass-role">PICKER</div>
      <div class="sub" id="pass-sub">…</div>
      <button class="start-btn" id="ready">I'm Ready</button>
    </div>
  </div>

  <script src="../shared/game.js"></script>
  <script>
  (function () {
    const playerName = EL.playerName;
    // Hand-picked silly pictures (chosen via picker.html). Each is a SPECIFIC LoremFlickr
    // image locked by [subject-query, lock]. These are the cards players choose from.
    const PICKS = [
      ['pug',48271],['alpaca',241355],['capybara',337897],['goose',434439],['parrot',675794],['monkey',724065],
      ['penguin',772336],['pig',917149],['cow',965420],['lemur',255046],['mascot',448130],['inflatable',544672],
      ['pug,costume',27382],['jester',737756],['chicken',703176],['frog',654905],['donkey',992802],['hedgehog',185886],
      ['owl',137615],['cow',89344],['turkey',330699],['chicken',827100],['donkey',116726],['pig',164997],
      ['owl',261539],['ferret',358081],['flamingo',406352],['mascot',695978],['costume',744249],['gnome',647707],
      ['clown',599436],['turkey',454623],['funny,dog',909951],['mascot',572054],['costume',620325],['silly,animal',6493],
      ['funny,cat',958222],['funny,face',54764],['jester',861680],['pinata',813409],['pug,costume',151306],['dog,hat',199577],
      ['cat,grumpy',247848],['alpaca',489203],['sloth',537474],['capybara',585745],['funny,dog',33875],['silly,animal',130417],
      ['funny,face',178688],['pug,costume',275230],['corgi',468314],['llama',564856],['hamster',999295],['chicken',951024],
      ['duck',854482],['donkey',240650],['goat',192379],['cow',337192],['corgi',592238],['costume',868173],
      ['clown',723360],['gnome',771631],['jester',109528],['pinata',61257],['pug,costume',399154],['dog,hat',447425],
      ['capybara',833593],['chicken',74948],['balloon',88639],['corgi',716162],['pug,costume',523078],['chicken',198872],
      ['pig',536769],['silly,animal',502189],['balloon',212563],['lemur',874666],['hedgehog',681582],['ferret',729853],
      ['owl',633311],['parrot',295414],['penguin',391956],['funny,face',550460],['derp',598731],['pug,costume',647002],
      ['funny,cat',577842],['silly,animal',626113],['dachshund',12281],['derp',722655],['pug,costume',770926],['capybara',205365],
      ['hedgehog',929430],['pug,costume',894850],['pug',39663],['corgi',87934],['dachshund',136205],['owl',5083],
      ['clown',342980],['funny,cat',825690],['corgi',211858],['dachshund',260129],['funny,face',922232],['inflatable',536064],
      ['lemur',246438],['ferret',101625],['goat',811999],['penguin',763728],['monkey',715457],['alpaca',356671],
      ['capybara',453213],['pig',32465],['corgi',335782],['dachshund',384053],['alpaca',480595],['llama',432324],
      ['raccoon',625408],['cat,grumpy',239240],['pug',287511],['derp',94427],['pug,costume',142698],['funny,face',46156],
      ['duck',721950],['frog',770221],['chicken',818492],['owl',252931],['dog,hat',314893],['pug,costume',266622],
      ['capybara',701061],['cat,grumpy',363164],['funny,dog',25267],['funny,cat',73538],['mascot',687370],['lemur',494286],
      ['turkey',446015],['meerkat',542557],['balloon',832183],['funny,face',170080],['scarecrow',880454],['raccoon',749332]
    ];

    // Caption prompts — the round's challenge. Players pick the funniest card for it.
    const CAPTIONS = [
      'When you wake up 5 minutes before the alarm',
      'Me pretending to listen',
      'The last slice of pizza, defended at all costs',
      'When the WiFi finally connects',
      'Trying to look busy',
      "When someone says “we need to talk”",
      'My energy at 3pm',
      "When the teacher says “group project”",
      'Sneaking a snack after bedtime',
      'When your favourite song comes on',
      'The main character of this story',
      'When you hear there’s a surprise',
      'Walking in like you own the place',
      'When you trip but play it cool',
      'Me after doing one chore',
      'The vibe on a Friday',
      'When you smell food cooking',
      'Staying calm in the group photo',
      "When the game says “YOU WIN”",
      'The face of pure mischief',
      'When you remember something embarrassing',
      'Ready for absolute chaos',
      'When someone eats your leftovers',
      'Living my best life',
      'When the weekend finally arrives',
      'Me the moment school ends',
      'When you nail it on the first try',
      'Plotting something sneaky',
      'When the snacks run out',
      'The boss of the whole playground'
    ];

    const HAND_SIZE = 6;
    function imgUrl(q, lock) {
      return 'https://loremflickr.com/500/500/' + q.split(',').map(encodeURIComponent).join(',') + '?lock=' + lock;
    }

    // ---- elements ----
    const scoresEl = document.getElementById('scores');
    const captionEl = document.getElementById('caption');
    const turnEl = document.getElementById('turn');
    const cardsEl = document.getElementById('cards');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next');
    const swapWrapEl = document.getElementById('swapwrap');
    const setupEl = document.getElementById('setup');
    const passEl = document.getElementById('pass');
    const passNameEl = document.getElementById('pass-name');
    const passRoleEl = document.getElementById('pass-role');
    const passSubEl = document.getElementById('pass-sub');

    // ---- state ----
    let players = [];
    let round = 0;
    let judge = 0, pickers = [1, 2];
    let phase = 'setup';     // setup | pass | pick | judge | reveal
    let caption = '';
    let playerHands = [[], [], []];  // a persistent hand per player — unplayed cards are kept
    let deck = [];           // draw pile (reshuffles from PICKS when empty)
    let picks = [];          // [{card, by}]
    let pickerTurn = 0;
    let capQueue = [];
    let pending = null;      // { player, phase } for the pass screen
    let swapsUsed = [false, false, false];  // once-per-game full-hand reshuffle per player

    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    }
    function nextCaption() {
      if (!capQueue.length) capQueue = shuffle(CAPTIONS.map(function (_, i) { return i; }));
      return CAPTIONS[capQueue.pop()];
    }

    function newDeck() { deck = shuffle(PICKS.slice()); }
    // Draw a card not already in `hand` (reshuffles the deck when it runs dry).
    function drawCard(hand) {
      for (var t = 0; t < 8; t++) {
        if (!deck.length) newDeck();
        var c = deck.pop();
        if (!hand.some(function (h) { return h[0] === c[0] && h[1] === c[1]; })) return c;
      }
      return deck.pop() || PICKS[Math.floor(Math.random() * PICKS.length)];
    }
    function dealHand() {
      var hand = [];
      for (var i = 0; i < HAND_SIZE; i++) hand.push(drawCard(hand));
      return hand;
    }

    function renderScores() {
      scoresEl.innerHTML = '';
      players.forEach(function (p, i) {
        const chip = document.createElement('div');
        let role = '', cls = 'pchip';
        if (i === judge) { role = 'Judge'; cls += ' judge'; }
        else { role = 'Picker'; if (phase === 'pick' && pickers[pickerTurn] === i) cls += ' picker'; }
        chip.className = cls;
        chip.innerHTML = '<div class="nm">' + playerName(i, 'Player ' + (i + 1)) + '</div><div class="sc">' + p.score + '</div><div class="role">' + role + '</div>';
        scoresEl.appendChild(chip);
      });
    }

    function makeCard(card) {
      const el = document.createElement('div');
      el.className = 'card';
      const spinner = document.createElement('div'); spinner.className = 'spinner'; spinner.textContent = '🤪';
      const img = document.createElement('img'); img.alt = ''; img.referrerPolicy = 'no-referrer';
      let tries = 0;
      function load() { img.src = imgUrl(card[0], card[1]) + (tries ? '&r=' + tries : ''); }
      img.addEventListener('load', function () { img.classList.add('loaded'); spinner.style.display = 'none'; });
      img.addEventListener('error', function () { tries++; if (tries < 4) load(); else spinner.textContent = '🖼️'; });
      load();
      el.appendChild(img); el.appendChild(spinner);
      return el;
    }

    // ---- flow ----
    function startGame() {
      players = [ { name: 'Player 1', score: 0 }, { name: 'Player 2', score: 0 }, { name: 'Player 3', score: 0 } ];
      round = 0; capQueue = [];
      swapsUsed = [false, false, false];
      newDeck();
      playerHands = [ dealHand(), dealHand(), dealHand() ];   // each player keeps their own hand
      setupEl.hidden = true;
      beginRound();
    }

    function beginRound() {
      caption = nextCaption();
      judge = round % 3;
      pickers = [(judge + 1) % 3, (judge + 2) % 3];
      picks = [];
      pickerTurn = 0;
      captionEl.textContent = caption;
      feedbackEl.textContent = ''; feedbackEl.className = 'feedback';
      nextBtn.hidden = true;
      renderScores();
      passTo(pickers[0], 'pick');
    }

    function passTo(playerIdx, nextPhase) {
      phase = 'pass';
      pending = { player: playerIdx, phase: nextPhase };
      renderScores();
      cardsEl.innerHTML = '';
      swapWrapEl.innerHTML = '';
      turnEl.textContent = '';
      const judging = nextPhase === 'judge';
      passNameEl.textContent = playerName(playerIdx, 'Player ' + (playerIdx + 1));
      passRoleEl.textContent = judging ? 'JUDGE' : 'PICKER';
      passRoleEl.className = 'role-pill ' + (judging ? 'judge' : 'picker');
      passSubEl.innerHTML = judging
        ? 'You’re the <b style="color:#ffd23f">judge</b>! Pick which picture fits the caption best.'
        : 'Pick the funniest picture for the caption — keep your choice secret! 🤫';
      passEl.hidden = false;
    }

    function onReady() {
      if (!pending) return;
      passEl.hidden = true;
      const p = pending; pending = null;
      if (p.phase === 'pick') showPick(p.player);
      else showJudge();
    }

    function showPick(playerIdx) {
      phase = 'pick';
      renderScores();
      captionEl.textContent = caption;
      turnEl.textContent = playerName(playerIdx, 'Player ' + (playerIdx + 1)) + ', tap the funniest card 👇';
      cardsEl.className = 'hand';
      cardsEl.innerHTML = '';
      renderHand(playerIdx);
    }

    function renderHand(playerIdx) {
      cardsEl.innerHTML = '';
      playerHands[playerIdx].forEach(function (card) {
        const el = makeCard(card);
        el.addEventListener('click', function () { choose(card, playerIdx); });
        cardsEl.appendChild(el);
      });
      renderSwap(playerIdx);
    }

    function renderSwap(playerIdx) {
      swapWrapEl.innerHTML = '';
      if (swapsUsed[playerIdx]) return;
      const btn = document.createElement('button');
      btn.className = 'swap-btn';
      btn.textContent = '🔄 New cards (once per game)';
      btn.addEventListener('click', function () {
        if (phase !== 'pick' || swapsUsed[playerIdx]) return;
        swapsUsed[playerIdx] = true;
        playerHands[playerIdx] = dealHand();
        renderHand(playerIdx);
      });
      swapWrapEl.appendChild(btn);
    }

    function choose(card, playerIdx) {
      if (phase !== 'pick') return;
      picks.push({ card: card, by: playerIdx });
      // remove the played card; the player keeps the rest and draws one new card
      const hand = playerHands[playerIdx];
      const ci = hand.indexOf(card);
      if (ci !== -1) hand.splice(ci, 1);
      hand.push(drawCard(hand));
      pickerTurn++;
      if (pickerTurn < pickers.length) passTo(pickers[pickerTurn], 'pick');
      else passTo(judge, 'judge');
    }

    function showJudge() {
      phase = 'judge';
      renderScores();
      captionEl.textContent = caption;
      turnEl.textContent = playerName(judge, 'Player ' + (judge + 1)) + ' (Judge): which one fits best?';
      cardsEl.className = 'duel';
      cardsEl.innerHTML = '';
      // show the two picks in random order so the judge can't tell who chose which
      shuffle([0, 1]).forEach(function (pi) {
        const el = makeCard(picks[pi].card);
        el.addEventListener('click', function () { judgePick(pi, el); });
        cardsEl.appendChild(el);
      });
    }

    function judgePick(pi, el) {
      if (phase !== 'judge') return;
      phase = 'reveal';
      const winner = picks[pi].by;
      players[winner].score++;
      cardsEl.querySelectorAll('.card').forEach(function (c) { c.classList.add('locked'); if (c !== el) c.classList.add('dim'); });
      el.classList.add('correct');
      renderScores();
      turnEl.textContent = '';
      feedbackEl.className = 'feedback good';
      feedbackEl.textContent = '🏆 ' + playerName(winner, 'Player ' + (winner + 1)) + ' wins the round!';
      nextBtn.hidden = false;
    }

    // ---- wiring ----
    document.getElementById('start').addEventListener('click', startGame);
    document.getElementById('ready').addEventListener('click', onReady);
    nextBtn.addEventListener('click', function () { round++; beginRound(); });
  })();
  </script>

  <script>
    // On desktop the homepage loads this game in a pane. Hide only the "‹ Games" back link
    // (it would reload the homepage inside the pane) while keeping the Pacifico game title
    // visible. Standalone/mobile (top-level) pages keep the full topbar.
    if (window.self !== window.top) {
      var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
    }
  </script>
</body>
</html>
