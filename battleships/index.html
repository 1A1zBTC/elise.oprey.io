<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battleship</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/shared/game.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16213e">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E&L Games">
<link rel="icon" href="/icons/favicon.png">
<script src="/pwa.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* leak-reset: neutralize shared body's justify-content/touch-action/user-select (orig had none) */
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%); color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; justify-content: flex-start; touch-action: auto; user-select: auto; -webkit-user-select: auto; }
  @media (min-width: 768px) { body { justify-content: center; } }
  h1 { font-family: 'Pacifico', cursive; font-size: 2.2rem; margin-bottom: 10px; color: #fff; font-weight: 400; }
  #status { font-size: 1.1rem; margin-bottom: 16px; min-height: 1.4em; color: #ffd54f; }
  .boards { display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .board-container { text-align: center; padding: 12px; border-radius: 8px; border: 3px solid transparent; transition: border-color 0.3s, box-shadow 0.3s; }
  .board-row { display: flex; gap: 18px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .board-container.active { border-color: #ffd54f; box-shadow: 0 0 20px rgba(255,213,79,0.3); }
  .board-container h2 { margin-bottom: 8px; font-size: 1rem; color: #90caf9; transition: color 0.3s; }
  .board-container.active h2 { color: #ffd54f; }
  table { border-collapse: collapse; }
  td { width: 36px; height: 36px; border: 1px solid #1e3a5f; text-align: center; font-size: 1.1rem; cursor: default; transition: background 0.15s; }
  .header { background: #0d2137; color: #4fc3f7; font-weight: bold; cursor: default; font-size: 0.8rem; }
  .water { background: #0d2a4a; }
  .ship { background: #37474f; }
  .hit { background: #c62828; color: #fff; }
  .miss { background: #1a3a5c; color: #64b5f6; }
  .miss.near { background: #234a6b; color: #ffd54f; }   /* discovery: a ship sits next door */
  .sunk { background: #8b0000; color: #fff; }
  .revealed { background: #0e6b5e; color: #aef5e8; }     /* sonar-revealed ship (not yet hit) */
  .preview-valid { background: #2e7d32; }
  .preview-invalid { background: #b71c1c; }
  .clickable { cursor: crosshair; }
  .surviving { background: #1b5e20; }

  /* weapon-aim previews (hover) */
  .wp-bomb { background: #e65100; opacity: 0.7; }
  .wp-missile { background: #7b1fa2; opacity: 0.7; }
  .wp-sonar { background: #00897b; opacity: 0.7; }
  .wp-triple { background: #e64a19; opacity: 0.7; }

  .controls { margin: 16px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { padding: 8px 18px; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; background: #1565c0; color: #fff; transition: background 0.2s; }
  button:hover { background: #1e88e5; }
  button:disabled { background: #333; cursor: default; }

  /* weapon bar (rendered above AND below the boards during battle) */
  .weapons { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .weapon-btn { padding: 8px 14px; font-size: 0.9rem; border-radius: 6px; }
  .weapon-btn.selected { outline: 2px solid #fff; box-shadow: 0 0 12px rgba(255,255,255,0.5); }
  .weapon-btn:disabled { background: #555; color: #999; box-shadow: none; outline: none; cursor: default; }
  .w-bomb { background: #e65100; }       .w-bomb:hover:not(:disabled) { background: #f57c00; }
  .w-missile { background: #6a1b9a; }     .w-missile:hover:not(:disabled) { background: #8e24aa; }
  .w-sonar { background: #00695c; }       .w-sonar:hover:not(:disabled) { background: #00897b; }
  .w-triple { background: #bf360c; }      .w-triple:hover:not(:disabled) { background: #e64a19; }
  .w-discovery { background: #1565c0; }   .w-discovery:hover:not(:disabled) { background: #1e88e5; }
  .w-dir { background: #37474f; font-size: 0.82rem; padding: 8px 12px; } .w-dir:hover { background: #455a64; }

  .ship-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .ship-btn { padding: 6px 12px; font-size: 0.85rem; }
  .ship-btn.selected { background: #e65100; }
  .ship-btn.placed { background: #2e7d32; cursor: default; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .msg { background: #1a2a44; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; }
  #overlay .msg h2 { color: #ffd54f; margin-bottom: 12px; }
  #overlay .msg button { margin-top: 16px; font-size: 1.1rem; padding: 10px 30px; }
  .hidden { display: none !important; }
  .fleet { text-align: left; font-size: 0.85rem; min-width: 150px; padding-top: 26px; }
  .fleet-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .fleet-row.sunk-ship { opacity: 0.5; text-decoration: line-through; color: #c62828; }
  .fleet-name { width: 85px; }
  .fleet-cell { width: 16px; height: 16px; border: 1px solid #1e3a5f; display: inline-block; background: #37474f; }
  .fleet-row.sunk-ship .fleet-cell { background: #8b0000; }
  .topbar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="back">‹ Games</a>
  <span style="width:56px"></span>
</div>

<h1>Battleships</h1>
<div id="status">Player 1: Place your ships</div>

<div class="controls">
  <div id="ship-select" class="ship-list"></div>
  <button id="rotate-btn" onclick="toggleOrientation()">Horizontal</button>
  <button id="random-btn" onclick="randomPlace()">🎲 Random</button>
  <button id="ready-btn" class="hidden" onclick="finishPlacement()">Ready</button>
</div>

<div id="weapons-top" class="weapons hidden"></div>

<div class="boards">
  <div class="board-container" id="p1-container">
    <h2 id="left-label">Player 1</h2>
    <div class="board-row">
      <table id="board-0"></table>
      <div class="fleet" id="fleet-0"></div>
    </div>
  </div>
  <div class="board-container" id="p2-container">
    <h2 id="right-label">Player 2</h2>
    <div class="board-row">
      <table id="board-1"></table>
      <div class="fleet" id="fleet-1"></div>
    </div>
  </div>
</div>

<div id="weapons-bottom" class="weapons hidden"></div>

<div id="overlay" class="hidden">
  <div class="msg">
    <h2 id="overlay-title">Battleship</h2>
    <p id="overlay-text">Two players take turns placing ships and firing shots. Sink all enemy ships to win!</p>
    <button id="overlay-btn" onclick="startGame()">Start Game</button>
  </div>
</div>

<script src="/shared/game.js"></script>
<script>
const playerName=EL.playerName;
const SHIPS = [
  { name: 'Carrier', size: 5 },
  { name: 'Battleship', size: 4 },
  { name: 'Cruiser', size: 3 },
  { name: 'Submarine', size: 3 },
  { name: 'Destroyer', size: 2 },
];

// Each player gets one of each weapon per game. Order here is the order shown in the bar.
const WEAPONS = [
  { id: 'bomb',      icon: '💣', name: 'Special Bomb', cls: 'w-bomb' },
  { id: 'missile',   icon: '🚀', name: 'Missile',      cls: 'w-missile' },
  { id: 'sonar',     icon: '📡', name: 'Sonar',        cls: 'w-sonar' },
  { id: 'triple',    icon: '🎯', name: 'Triple Bomb',  cls: 'w-triple' },
  { id: 'discovery', icon: '🔍', name: 'Discovery',    cls: 'w-discovery' },
];
function freshAmmo() { return { bomb: 1, missile: 1, sonar: 1, triple: 1, discovery: 1 }; }

const SIZE = 10;
const COLS = 'ABCDEFGHIJ';
let players = [null, null];
let currentPlayer = 0;
let phase = 'init'; // init, placing, battle, gameover
let selectedShip = null;
let orientation = 'h';
let waiting = false; // lock clicks during turn-switch delay

// --- weapon state ---
let ammo = [freshAmmo(), freshAmmo()];
let activeWeapon = null;     // weapon id currently aimed, or null for a normal shot
let missileDir = 'row';      // 'row' or 'col' for the missile
let tripleTriesLeft = 0;     // misses remaining in the current triple-bomb run (0 = no run)

function makeEmptyGrid() {
  const g = [];
  for (let r = 0; r < SIZE; r++) {
    g[r] = [];
    for (let c = 0; c < SIZE; c++) {
      g[r][c] = { ship: null, hit: false, revealed: false, near: false };
    }
  }
  return g;
}

function newPlayer() {
  return {
    grid: makeEmptyGrid(),
    ships: SHIPS.map(s => ({ ...s, placed: false, cells: [], sunk: false })),
  };
}

function startGame() {
  players = [newPlayer(), newPlayer()];
  currentPlayer = 0;
  phase = 'placing';
  selectedShip = null;
  orientation = 'h';
  waiting = false;
  ammo = [freshAmmo(), freshAmmo()];
  activeWeapon = null;
  missileDir = 'row';
  tripleTriesLeft = 0;
  hideOverlay();
  renderShipSelect();
  renderBoards();
  setStatus(playerName(0, 'Player 1') + ": Place your ships");
  document.getElementById('rotate-btn').classList.remove('hidden');
  document.getElementById('random-btn').classList.remove('hidden');
}

/* ---- Rendering ---- */

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Base appearance of a cell (no preview / no click class). Used by both the full
// render and the hover-preview cleanup so sonar reveals & discovery marks survive.
function baseCellClass(cell, showShips) {
  if (cell.hit && cell.ship) return cell.ship.sunk ? 'sunk' : 'hit';
  if (cell.hit) return cell.near ? 'miss near' : 'miss';
  if (cell.revealed && cell.ship) return 'revealed';
  if (showShips && cell.ship) return phase === 'gameover' ? 'surviving' : 'ship';
  return 'water';
}
function baseCellText(cell) {
  if (cell.hit && cell.ship) return cell.ship.sunk ? 'X' : '💥';
  if (cell.hit) return cell.near ? '🔍' : '•';
  if (cell.revealed && cell.ship) return '📡';
  return '';
}

function renderFleet(playerIdx) {
  const container = document.getElementById(`fleet-${playerIdx}`);
  const ships = players[playerIdx].ships;
  container.innerHTML = '';
  ships.forEach(ship => {
    const row = document.createElement('div');
    row.className = 'fleet-row' + (ship.sunk ? ' sunk-ship' : '');
    const name = document.createElement('span');
    name.className = 'fleet-name';
    name.textContent = ship.name;
    row.appendChild(name);
    for (let i = 0; i < ship.size; i++) {
      const cell = document.createElement('span');
      cell.className = 'fleet-cell';
      row.appendChild(cell);
    }
    container.appendChild(row);
  });
}

function getPreviewCells(r, c) {
  if (phase !== 'placing' || selectedShip === null) return [];
  const p = players[currentPlayer];
  const ship = p.ships[selectedShip];
  if (ship.placed) return [];
  const cells = [];
  for (let i = 0; i < ship.size; i++) {
    const nr = orientation === 'v' ? r + i : r;
    const nc = orientation === 'h' ? c + i : c;
    cells.push([nr, nc]);
  }
  return cells;
}

function isValidPreview(grid, cells) {
  return cells.every(([r, c]) => r < SIZE && c < SIZE && !grid[r][c].ship);
}

function renderBoard(tableId, grid, clickHandler, showShips, hoverHandler) {
  const table = document.getElementById(tableId);
  table.innerHTML = '';
  const hr = document.createElement('tr');
  hr.innerHTML = '<td class="header"></td>';
  for (let c = 0; c < SIZE; c++) hr.innerHTML += `<td class="header">${COLS[c]}</td>`;
  table.appendChild(hr);

  for (let r = 0; r < SIZE; r++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="header">${r + 1}</td>`;
    for (let c = 0; c < SIZE; c++) {
      const cell = grid[r][c];
      const td = document.createElement('td');
      td.dataset.r = r;
      td.dataset.c = c;
      td.className = baseCellClass(cell, showShips);
      td.textContent = baseCellText(cell);
      if (clickHandler) {
        td.classList.add('clickable');
        td.addEventListener('click', () => clickHandler(r, c));
      }
      if (hoverHandler) {
        td.addEventListener('mouseenter', () => hoverHandler(tableId, grid, r, c));
        td.addEventListener('mouseleave', () => {
          clearPreview(tableId, grid);
          clearWeaponPreview(tableId, grid);
        });
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

function showPreview(tableId, grid, r, c) {
  const cells = getPreviewCells(r, c);
  if (cells.length === 0) return;
  const valid = isValidPreview(grid, cells);
  const table = document.getElementById(tableId);
  cells.forEach(([pr, pc]) => {
    if (pr >= SIZE || pc >= SIZE) return;
    const td = table.rows[pr + 1]?.cells[pc + 1];
    if (td && !grid[pr][pc].ship) {
      td.className = valid ? 'preview-valid clickable' : 'preview-invalid clickable';
    }
  });
}

function clearPreview(tableId, grid) {
  const table = document.getElementById(tableId);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const td = table.rows[r + 1]?.cells[c + 1];
      if (!td) continue;
      const cell = grid[r][c];
      if (td.classList.contains('preview-valid') || td.classList.contains('preview-invalid')) {
        td.className = cell.ship ? 'ship clickable' : 'water clickable';
      }
    }
  }
}

function updateHighlight() {
  const p1 = document.getElementById('p1-container');
  const p2 = document.getElementById('p2-container');
  p1.classList.remove('active');
  p2.classList.remove('active');

  if (phase === 'placing') {
    document.getElementById(currentPlayer === 0 ? 'p1-container' : 'p2-container').classList.add('active');
  } else if (phase === 'battle') {
    document.getElementById(currentPlayer === 0 ? 'p2-container' : 'p1-container').classList.add('active');
  }
}

function renderBoards() {
  if (phase === 'placing') {
    const placingBoard = `board-${currentPlayer}`;
    const otherBoard = `board-${1 - currentPlayer}`;
    renderBoard(placingBoard, players[currentPlayer].grid, placementClick, true, showPreview);
    renderBoard(otherBoard, players[1 - currentPlayer].grid, null, false, null);
  } else if (phase === 'battle') {
    const hover = activeWeapon ? showWeaponPreview : null;
    renderBoard('board-0', players[0].grid, currentPlayer === 1 ? fireShot : null, false, currentPlayer === 1 ? hover : null);
    renderBoard('board-1', players[1].grid, currentPlayer === 0 ? fireShot : null, false, currentPlayer === 0 ? hover : null);
  } else if (phase === 'gameover') {
    const winnerIdx = currentPlayer;
    const loserIdx = 1 - currentPlayer;
    renderBoard(`board-${winnerIdx}`, players[winnerIdx].grid, null, true, null);
    renderBoard(`board-${loserIdx}`, players[loserIdx].grid, null, false, null);
  }
  document.getElementById('left-label').textContent = playerName(0, 'Player 1');
  document.getElementById('right-label').textContent = playerName(1, 'Player 2');
  renderFleet(0);
  renderFleet(1);
  updateHighlight();
  renderWeapons();
}

/* ---- Weapons UI ---- */

// Rebuild both weapon bars (above + below the boards) from the current player's ammo.
function renderWeapons() {
  ['weapons-top', 'weapons-bottom'].forEach(barId => {
    const bar = document.getElementById(barId);
    bar.innerHTML = '';
    if (phase !== 'battle') { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');

    WEAPONS.forEach(w => {
      const left = ammo[currentPlayer][w.id];
      const btn = document.createElement('button');
      btn.className = 'weapon-btn ' + w.cls + (activeWeapon === w.id ? ' selected' : '');
      // mid triple-bomb run: lock everything except the triple button
      btn.disabled = left <= 0 || (tripleTriesLeft > 0 && activeWeapon !== w.id);
      if (left <= 0) {
        btn.textContent = w.icon + ' Used';
      } else if (w.id === 'triple' && activeWeapon === 'triple' && tripleTriesLeft > 0) {
        btn.textContent = w.icon + ' ' + tripleTriesLeft + ' tr' + (tripleTriesLeft === 1 ? 'y' : 'ies') + ' left';
      } else {
        btn.textContent = w.icon + ' ' + w.name;
      }
      btn.addEventListener('click', () => selectWeapon(w.id));
      bar.appendChild(btn);

      // missile direction toggle sits right after the missile button while it's aimed
      if (w.id === 'missile' && activeWeapon === 'missile') {
        const dir = document.createElement('button');
        dir.className = 'weapon-btn w-dir';
        dir.textContent = missileDir === 'row' ? '↔ Row' : '↕ Column';
        dir.addEventListener('click', toggleMissileDir);
        bar.appendChild(dir);
      }
    });
  });
}

function selectWeapon(id) {
  if (phase !== 'battle' || waiting) return;
  if (tripleTriesLeft > 0) return;             // can't switch mid triple-bomb run
  if (ammo[currentPlayer][id] <= 0) return;
  activeWeapon = (activeWeapon === id) ? null : id;
  renderBoards();
}

function toggleMissileDir() {
  missileDir = missileDir === 'row' ? 'col' : 'row';
  renderBoards();
}

/* ---- Weapon footprints + hover preview ---- */

function getBombCells(r, c) {
  const cells = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) cells.push([nr, nc]);
    }
  }
  return cells;
}

function getMissileCells(r, c) {
  const cells = [];
  if (missileDir === 'row') {
    for (let i = 0; i < SIZE; i++) cells.push([r, i]);
  } else {
    for (let i = 0; i < SIZE; i++) cells.push([i, c]);
  }
  return cells;
}

function getColumnCells(c) {
  const cells = [];
  for (let i = 0; i < SIZE; i++) cells.push([i, c]);
  return cells;
}

function weaponFootprint(r, c) {
  switch (activeWeapon) {
    case 'bomb':
    case 'discovery': return getBombCells(r, c);
    case 'missile':   return getMissileCells(r, c);
    case 'sonar':     return getColumnCells(c);
    case 'triple':    return [[r, c]];
    default:          return [];
  }
}

function showWeaponPreview(tableId, grid, r, c) {
  if (!activeWeapon) return;
  const type = (activeWeapon === 'discovery') ? 'bomb' : activeWeapon;  // reuse bomb tint
  const cls = 'wp-' + type;
  const table = document.getElementById(tableId);
  weaponFootprint(r, c).forEach(([pr, pc]) => {
    if (pr < 0 || pr >= SIZE || pc < 0 || pc >= SIZE) return;
    const td = table.rows[pr + 1]?.cells[pc + 1];
    if (td && !grid[pr][pc].hit) td.className = cls + ' clickable';
  });
}

function clearWeaponPreview(tableId, grid) {
  const table = document.getElementById(tableId);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const td = table.rows[r + 1]?.cells[c + 1];
      if (!td) continue;
      if (td.className.indexOf('wp-') !== -1) {
        td.className = baseCellClass(grid[r][c], false) + ' clickable';
        td.textContent = baseCellText(grid[r][c]);
      }
    }
  }
}

function renderShipSelect() {
  const container = document.getElementById('ship-select');
  container.innerHTML = '';
  const p = players[currentPlayer];
  p.ships.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'ship-btn' + (s.placed ? ' placed' : '') + (selectedShip === i ? ' selected' : '');
    btn.textContent = `${s.name} (${s.size})`;
    if (!s.placed) btn.addEventListener('click', () => { selectedShip = i; renderShipSelect(); });
    container.appendChild(btn);
  });

  const readyBtn = document.getElementById('ready-btn');
  if (p.ships.every(s => s.placed)) {
    readyBtn.classList.remove('hidden');
  } else {
    readyBtn.classList.add('hidden');
  }
}

/* ---- Placement ---- */

function toggleOrientation() {
  orientation = orientation === 'h' ? 'v' : 'h';
  document.getElementById('rotate-btn').textContent = orientation === 'h' ? 'Horizontal' : 'Vertical';
}

function canPlace(grid, r, c, size, dir) {
  for (let i = 0; i < size; i++) {
    const nr = dir === 'v' ? r + i : r;
    const nc = dir === 'h' ? c + i : c;
    if (nr >= SIZE || nc >= SIZE) return false;
    if (grid[nr][nc].ship) return false;
  }
  return true;
}

function placementClick(r, c) {
  if (phase !== 'placing' || selectedShip === null) return;
  const p = players[currentPlayer];
  const ship = p.ships[selectedShip];
  if (ship.placed) return;
  if (!canPlace(p.grid, r, c, ship.size, orientation)) return;

  ship.cells = [];
  for (let i = 0; i < ship.size; i++) {
    const nr = orientation === 'v' ? r + i : r;
    const nc = orientation === 'h' ? c + i : c;
    p.grid[nr][nc].ship = ship;
    ship.cells.push([nr, nc]);
  }
  ship.placed = true;
  selectedShip = null;
  renderShipSelect();
  renderBoards();
}

function randomPlace() {
  if (phase !== 'placing') return;
  const p = players[currentPlayer];
  // Clear any current placement so every press is a fresh, full re-roll (not a one-shot
  // "fill the rest"). Lets the player keep randomizing until they like the layout.
  p.grid = makeEmptyGrid();
  p.ships.forEach(s => { s.placed = false; s.cells = []; });
  p.ships.forEach(ship => {
    let attempts = 0;
    while (attempts < 1000) {
      attempts++;
      const dir = Math.random() < 0.5 ? 'h' : 'v';
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      if (!canPlace(p.grid, r, c, ship.size, dir)) continue;
      ship.cells = [];
      for (let i = 0; i < ship.size; i++) {
        const nr = dir === 'v' ? r + i : r;
        const nc = dir === 'h' ? c + i : c;
        p.grid[nr][nc].ship = ship;
        ship.cells.push([nr, nc]);
      }
      ship.placed = true;
      break;
    }
  });
  selectedShip = null;
  renderShipSelect();
  renderBoards();
}

function finishPlacement() {
  if (currentPlayer === 0) {
    currentPlayer = 1;
    selectedShip = null;
    orientation = 'h';
    document.getElementById('rotate-btn').textContent = 'Horizontal';
    showOverlay('Pass the device', "It's " + playerName(1, 'Player 2') + "'s turn to place ships.", 'OK');
  } else {
    currentPlayer = 0;
    phase = 'battle';
    activeWeapon = null;
    tripleTriesLeft = 0;
    document.getElementById('ship-select').innerHTML = '';
    document.getElementById('ready-btn').classList.add('hidden');
    document.getElementById('rotate-btn').classList.add('hidden');
    document.getElementById('random-btn').classList.add('hidden');
    renderBoards();
    setStatus(playerName(0, 'Player 1') + ": Fire a shot!");
  }
}

/* ---- Battle ---- */

// Pass the turn after a short pause so the player sees the result first.
function switchTurnDelayed(delay) {
  waiting = true;
  setTimeout(() => {
    waiting = false;
    currentPlayer = 1 - currentPlayer;
    activeWeapon = null;
    tripleTriesLeft = 0;
    renderBoards();
    setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: Fire a shot!`);
  }, delay || 900);
}

// Returns true (and ends the game) if every enemy ship is sunk.
function checkWin(enemyIdx) {
  if (players[enemyIdx].ships.every(s => s.sunk)) {
    phase = 'gameover';
    renderBoards();
    showOverlay('Game Over!', `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))} wins!`, 'Play Again');
    return true;
  }
  return false;
}

// Mark a ship sunk if all of its cells are now hit.
function maybeSink(grid, ship) {
  if (ship.cells.every(([sr, sc]) => grid[sr][sc].hit)) ship.sunk = true;
}

function fireShot(r, c) {
  if (phase !== 'battle' || waiting) return;
  if (activeWeapon === 'bomb')      return fireSpecialBomb(r, c);
  if (activeWeapon === 'missile')   return fireSpecialMissile(r, c);
  if (activeWeapon === 'sonar')     return fireSonar(r, c);
  if (activeWeapon === 'triple')    return fireTriple(r, c);
  if (activeWeapon === 'discovery') return fireDiscovery(r, c);

  // normal single shot: hit = go again, miss = pass the turn
  const enemyIdx = 1 - currentPlayer;
  const cell = players[enemyIdx].grid[r][c];
  if (cell.hit) return;
  cell.hit = true;

  if (cell.ship) {
    maybeSink(players[enemyIdx].grid, cell.ship);
    if (checkWin(enemyIdx)) return;
    setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: Hit!${cell.ship.sunk ? ' ' + cell.ship.name + ' sunk!' : ''}`);
    renderBoards();
  } else {
    setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: Miss!`);
    renderBoards();
    switchTurnDelayed(800);
  }
}

// Special Bomb: the clicked cell + all 8 around it. Any ship touched is destroyed outright.
function fireSpecialBomb(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  ammo[currentPlayer].bomb = 0;
  activeWeapon = null;

  const shipsHit = new Set();
  getBombCells(r, c).forEach(([br, bc]) => {
    const cell = grid[br][bc];
    cell.hit = true;
    if (cell.ship) shipsHit.add(cell.ship);
  });
  shipsHit.forEach(ship => {
    ship.sunk = true;
    ship.cells.forEach(([sr, sc]) => { grid[sr][sc].hit = true; });
  });

  if (checkWin(enemyIdx)) return;
  const names = [...shipsHit].map(s => s.name).join(', ');
  setStatus(shipsHit.size > 0
    ? `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 💣 BOOM! Sunk: ${names}!`
    : `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 💣 BOOM! No ships hit.`);
  renderBoards();
  switchTurnDelayed(1200);
}

// Missile: every cell in the chosen row or column. Ships sink only if fully hit.
function fireSpecialMissile(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  ammo[currentPlayer].missile = 0;
  activeWeapon = null;

  const shipsHit = new Set();
  getMissileCells(r, c).forEach(([mr, mc]) => {
    const cell = grid[mr][mc];
    cell.hit = true;
    if (cell.ship) shipsHit.add(cell.ship);
  });
  shipsHit.forEach(ship => maybeSink(grid, ship));

  if (checkWin(enemyIdx)) return;
  const hitCount = shipsHit.size;
  const sunkShips = [...shipsHit].filter(s => s.sunk);
  const label = missileDir === 'row' ? `row ${r + 1}` : `column ${COLS[c]}`;
  let msg = `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🚀 Missile across ${label}! `;
  if (hitCount > 0) {
    msg += `Hit ${hitCount} ship${hitCount > 1 ? 's' : ''}!`;
    if (sunkShips.length > 0) msg += ` Sunk: ${sunkShips.map(s => s.name).join(', ')}!`;
  } else {
    msg += 'No ships hit.';
  }
  setStatus(msg);
  renderBoards();
  switchTurnDelayed(1200);
}

// Sonar: reveals (without hitting) every ship in the clicked column — on BOTH boards.
function fireSonar(r, c) {
  ammo[currentPlayer].sonar = 0;
  activeWeapon = null;

  let found = 0;
  for (let i = 0; i < SIZE; i++) {
    [0, 1].forEach(pi => {
      const cell = players[pi].grid[i][c];
      if (cell.ship && !cell.revealed) { cell.revealed = true; found++; }
    });
  }
  setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 📡 Sonar on column ${COLS[c]} — ${found} ship cell${found === 1 ? '' : 's'} revealed (both fleets)!`);
  renderBoards();
  switchTurnDelayed(1300);
}

// Triple Bomb: single-cell shots, but you get THREE misses before your turn ends.
// Hits are free (they don't burn a try), same as a normal hit you keep firing.
function fireTriple(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  if (tripleTriesLeft === 0) {           // first shot of the run — consume the weapon
    ammo[currentPlayer].triple = 0;
    tripleTriesLeft = 3;
  }
  const cell = grid[r][c];
  if (cell.hit) return;                   // ignore already-shot cells (no try lost)
  cell.hit = true;

  if (cell.ship) {
    maybeSink(grid, cell.ship);
    if (checkWin(enemyIdx)) return;
    setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🎯 Hit!${cell.ship.sunk ? ' ' + cell.ship.name + ' sunk!' : ''} (${tripleTriesLeft} ${tripleTriesLeft === 1 ? 'try' : 'tries'} left)`);
    renderBoards();                        // free hit — keep firing, tries unchanged
  } else {
    tripleTriesLeft--;
    if (tripleTriesLeft > 0) {
      setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🎯 Miss! ${tripleTriesLeft} ${tripleTriesLeft === 1 ? 'try' : 'tries'} left.`);
      renderBoards();
    } else {
      setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🎯 Miss! Triple bomb spent.`);
      renderBoards();
      switchTurnDelayed(900);
    }
  }
}

// Discovery: shoot one cell. Land on a ship → it's just a normal hit and the weapon is
// handed back (use it again). Miss → it's spent, but it tells you whether any of the 8
// neighbours hides a ship.
function fireDiscovery(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  const cell = grid[r][c];
  if (cell.hit) return;

  if (cell.ship) {
    // Direct hit — discovery wasted, so don't consume it. Normal hit = fire again.
    cell.hit = true;
    activeWeapon = null;
    maybeSink(grid, cell.ship);
    if (checkWin(enemyIdx)) return;
    setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🔍 Hit!${cell.ship.sunk ? ' ' + cell.ship.name + ' sunk!' : ''} (Discovery saved — still yours)`);
    renderBoards();
    return;
  }

  // Miss — spend the discovery and report adjacency, then pass the turn.
  ammo[currentPlayer].discovery = 0;
  activeWeapon = null;
  cell.hit = true;
  const near = getBombCells(r, c).some(([nr, nc]) => grid[nr][nc].ship);
  cell.near = near;
  setStatus(near
    ? `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🔍 Miss — but a ship is hiding right next to it!`
    : `${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: 🔍 Miss — all clear nearby.`);
  renderBoards();
  switchTurnDelayed(1100);
}

/* ---- Overlay ---- */

function showOverlay(title, text, btnText) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-text').textContent = text;
  document.getElementById('overlay-btn').textContent = btnText;
  document.getElementById('overlay-btn').onclick = () => {
    if (phase === 'gameover') { startGame(); return; }
    hideOverlay();
    if (phase === 'placing') {
      renderShipSelect();
      renderBoards();
      setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: Place your ships`);
    } else {
      renderBoards();
      setStatus(`${playerName(currentPlayer, 'Player ' + (currentPlayer + 1))}: Fire a shot!`);
    }
  };
  document.getElementById('overlay').classList.remove('hidden');
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// Skip the intro splash — drop straight into ship placement on load.
startGame();
</script>
<script>
  // On desktop the homepage loads this game in a pane; hide the redundant "‹ Games"
  // back link there. Standalone/mobile (top-level) pages keep it.
  if (window.self !== window.top) {
    var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
  }
</script>
