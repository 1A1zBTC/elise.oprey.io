<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battleship</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a1628; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { font-size: 2rem; margin-bottom: 10px; color: #4fc3f7; letter-spacing: 2px; }
  #status { font-size: 1.1rem; margin-bottom: 16px; min-height: 1.4em; color: #ffd54f; }
  .boards { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .board-container { text-align: center; padding: 12px; border-radius: 8px; border: 3px solid transparent; transition: border-color 0.3s, box-shadow 0.3s; }
  .board-container.active { border-color: #ffd54f; box-shadow: 0 0 20px rgba(255,213,79,0.3); }
  .board-container h2 { margin-bottom: 8px; font-size: 1rem; color: #90caf9; transition: color 0.3s; }
  .board-container.active h2 { color: #ffd54f; }
  table { border-collapse: collapse; }
  td { width: 36px; height: 36px; border: 1px solid #1e3a5f; text-align: center; font-size: 1.1rem; cursor: default; transition: background 0.15s; }
  .header { background: #0d2137; color: #4fc3f7; font-weight: bold; cursor: default; font-size: 0.8rem; }
  .water { background: #0d2a4a; }
  .ship { background: #37474f; }
  .hit { background: #c62828; color: #fff; }
  .miss { background: #1a3a5c; color: #64b5f6; }
  .sunk { background: #8b0000; color: #fff; }
  .preview-valid { background: #2e7d32; }
  .preview-invalid { background: #b71c1c; }
  .bomb-preview { background: #e65100; opacity: 0.7; }
  .clickable { cursor: crosshair; }
  .bomb-btn { background: #e65100; }
  .bomb-btn:hover { background: #f57c00; }
  .bomb-btn.selected { background: #ff3d00; box-shadow: 0 0 12px rgba(255,61,0,0.6); }
  .bomb-btn:disabled { background: #555; color: #888; cursor: default; box-shadow: none; }
  .missile-btn { background: #6a1b9a; }
  .missile-btn:hover { background: #8e24aa; }
  .missile-btn.selected { background: #aa00ff; box-shadow: 0 0 12px rgba(170,0,255,0.6); }
  .missile-btn:disabled { background: #555; color: #888; cursor: default; box-shadow: none; }
  .missile-preview { background: #7b1fa2; opacity: 0.7; }
  .missile-toggle { background: #4a148c; font-size: 0.8rem; padding: 6px 12px; }
  .missile-toggle:hover { background: #6a1b9a; }
  .surviving { background: #1b5e20; }
  .controls { margin: 16px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { padding: 8px 18px; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; background: #1565c0; color: #fff; transition: background 0.2s; }
  button:hover { background: #1e88e5; }
  button:disabled { background: #333; cursor: default; }
  .ship-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .ship-btn { padding: 6px 12px; font-size: 0.85rem; }
  .ship-btn.selected { background: #e65100; }
  .ship-btn.placed { background: #2e7d32; cursor: default; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .msg { background: #1a2a44; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; }
  #overlay .msg h2 { color: #ffd54f; margin-bottom: 12px; }
  #overlay .msg button { margin-top: 16px; font-size: 1.1rem; padding: 10px 30px; }
  .hidden { display: none !important; }
  .fleet { margin-top: 10px; text-align: left; font-size: 0.85rem; }
  .fleet-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .fleet-row.sunk-ship { opacity: 0.5; text-decoration: line-through; color: #c62828; }
  .fleet-name { width: 85px; }
  .fleet-cell { width: 16px; height: 16px; border: 1px solid #1e3a5f; display: inline-block; background: #37474f; }
  .fleet-row.sunk-ship .fleet-cell { background: #8b0000; }
</style>
</head>
<body>

<h1>BATTLESHIP</h1>
<div id="status">Player 1: Place your ships</div>

<div class="controls">
  <div id="ship-select" class="ship-list"></div>
  <button id="rotate-btn" onclick="toggleOrientation()">Horizontal</button>
  <button id="ready-btn" class="hidden" onclick="finishPlacement()">Ready</button>
  <button id="bomb-btn" class="bomb-btn hidden" onclick="toggleBomb()">💣 Special Bomb</button>
  <button id="missile-btn" class="missile-btn hidden" onclick="toggleMissile()">🚀 Missile</button>
  <button id="missile-dir-btn" class="missile-toggle hidden" onclick="toggleMissileDir()">Row</button>
</div>

<div class="boards">
  <div class="board-container" id="p1-container">
    <h2 id="left-label">Player 1</h2>
    <table id="board-0"></table>
    <div class="fleet" id="fleet-0"></div>
  </div>
  <div class="board-container" id="p2-container">
    <h2 id="right-label">Player 2</h2>
    <table id="board-1"></table>
    <div class="fleet" id="fleet-1"></div>
  </div>
</div>

<div id="overlay">
  <div class="msg">
    <h2 id="overlay-title">Battleship</h2>
    <p id="overlay-text">Two players take turns placing ships and firing shots. Sink all enemy ships to win!</p>
    <button id="overlay-btn" onclick="startGame()">Start Game</button>
  </div>
</div>

<script>
const SHIPS = [
  { name: 'Carrier', size: 5 },
  { name: 'Battleship', size: 4 },
  { name: 'Cruiser', size: 3 },
  { name: 'Submarine', size: 3 },
  { name: 'Destroyer', size: 2 },
];

const SIZE = 10;
let players = [null, null];
let currentPlayer = 0;
let phase = 'init'; // init, placing, battle, gameover
let selectedShip = null;
let orientation = 'h';
let bombMode = false;
let specialBombs = [1, 1]; // one per player
let missileMode = false;
let missileDir = 'row'; // 'row' or 'col'
let specialMissiles = [1, 1]; // one per player
let waiting = false; // lock clicks during turn-switch delay

function makeEmptyGrid() {
  const g = [];
  for (let r = 0; r < SIZE; r++) {
    g[r] = [];
    for (let c = 0; c < SIZE; c++) {
      g[r][c] = { ship: null, hit: false };
    }
  }
  return g;
}

function newPlayer() {
  return {
    grid: makeEmptyGrid(),
    ships: SHIPS.map(s => ({ ...s, placed: false, cells: [], sunk: false })),
  };
}

function startGame() {
  players = [newPlayer(), newPlayer()];
  currentPlayer = 0;
  phase = 'placing';
  selectedShip = null;
  orientation = 'h';
  bombMode = false;
  missileMode = false;
  missileDir = 'row';
  specialBombs = [1, 1];
  specialMissiles = [1, 1];
  waiting = false;
  hideOverlay();
  renderShipSelect();
  renderBoards();
  updateSpecialButtons();
  setStatus("Player 1: Place your ships");
  document.getElementById('rotate-btn').classList.remove('hidden');
  document.getElementById('bomb-btn').classList.add('hidden');
  document.getElementById('missile-btn').classList.add('hidden');
  document.getElementById('missile-dir-btn').classList.add('hidden');
}

/* ---- Rendering ---- */

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function renderFleet(playerIdx) {
  const container = document.getElementById(`fleet-${playerIdx}`);
  const ships = players[playerIdx].ships;
  container.innerHTML = '';
  ships.forEach(ship => {
    const row = document.createElement('div');
    row.className = 'fleet-row' + (ship.sunk ? ' sunk-ship' : '');
    const name = document.createElement('span');
    name.className = 'fleet-name';
    name.textContent = ship.name;
    row.appendChild(name);
    for (let i = 0; i < ship.size; i++) {
      const cell = document.createElement('span');
      cell.className = 'fleet-cell';
      row.appendChild(cell);
    }
    container.appendChild(row);
  });
}

function getPreviewCells(r, c) {
  if (phase !== 'placing' || selectedShip === null) return [];
  const p = players[currentPlayer];
  const ship = p.ships[selectedShip];
  if (ship.placed) return [];
  const cells = [];
  for (let i = 0; i < ship.size; i++) {
    const nr = orientation === 'v' ? r + i : r;
    const nc = orientation === 'h' ? c + i : c;
    cells.push([nr, nc]);
  }
  return cells;
}

function isValidPreview(grid, cells) {
  return cells.every(([r, c]) => r < SIZE && c < SIZE && !grid[r][c].ship);
}

function renderBoard(tableId, grid, clickHandler, showShips, hoverHandler) {
  const table = document.getElementById(tableId);
  table.innerHTML = '';
  const cols = 'ABCDEFGHIJ';
  const hr = document.createElement('tr');
  hr.innerHTML = '<td class="header"></td>';
  for (let c = 0; c < SIZE; c++) hr.innerHTML += `<td class="header">${cols[c]}</td>`;
  table.appendChild(hr);

  for (let r = 0; r < SIZE; r++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="header">${r + 1}</td>`;
    for (let c = 0; c < SIZE; c++) {
      const cell = grid[r][c];
      const td = document.createElement('td');
      td.dataset.r = r;
      td.dataset.c = c;
      if (cell.hit && cell.ship) {
        const ship = cell.ship;
        td.className = ship.sunk ? 'sunk' : 'hit';
        td.textContent = ship.sunk ? 'X' : '💥';
      } else if (cell.hit) {
        td.className = 'miss';
        td.textContent = '•';
      } else if (showShips && cell.ship) {
        td.className = phase === 'gameover' ? 'surviving' : 'ship';
      } else {
        td.className = 'water';
      }
      if (clickHandler) {
        td.classList.add('clickable');
        td.addEventListener('click', () => clickHandler(r, c));
      }
      if (hoverHandler) {
        td.addEventListener('mouseenter', () => hoverHandler(tableId, grid, r, c));
        td.addEventListener('mouseleave', () => {
          clearPreview(tableId, grid);
          clearBombPreview(tableId, grid);
        });
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

function showPreview(tableId, grid, r, c) {
  const cells = getPreviewCells(r, c);
  if (cells.length === 0) return;
  const valid = isValidPreview(grid, cells);
  const table = document.getElementById(tableId);
  cells.forEach(([pr, pc]) => {
    if (pr >= SIZE || pc >= SIZE) return;
    const td = table.rows[pr + 1]?.cells[pc + 1];
    if (td && !grid[pr][pc].ship) {
      td.className = valid ? 'preview-valid clickable' : 'preview-invalid clickable';
    }
  });
}

function clearPreview(tableId, grid) {
  const table = document.getElementById(tableId);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const td = table.rows[r + 1]?.cells[c + 1];
      if (!td) continue;
      const cell = grid[r][c];
      if (td.classList.contains('preview-valid') || td.classList.contains('preview-invalid')) {
        td.className = cell.ship ? 'ship clickable' : 'water clickable';
      }
    }
  }
}

function updateHighlight() {
  const p1 = document.getElementById('p1-container');
  const p2 = document.getElementById('p2-container');
  p1.classList.remove('active');
  p2.classList.remove('active');

  if (phase === 'placing') {
    // Highlight the board being placed on
    document.getElementById(currentPlayer === 0 ? 'p1-container' : 'p2-container').classList.add('active');
  } else if (phase === 'battle') {
    // Highlight the enemy board (the one to bomb)
    document.getElementById(currentPlayer === 0 ? 'p2-container' : 'p1-container').classList.add('active');
  }
}

function getSpecialHover() {
  if (bombMode) return showBombPreview;
  if (missileMode) return showMissilePreview;
  return null;
}

function renderBoards() {
  if (phase === 'placing') {
    const placingBoard = `board-${currentPlayer}`;
    const otherBoard = `board-${1 - currentPlayer}`;
    renderBoard(placingBoard, players[currentPlayer].grid, placementClick, true, showPreview);
    renderBoard(otherBoard, players[1 - currentPlayer].grid, null, false, null);
  } else if (phase === 'battle') {
    const hover = getSpecialHover();
    renderBoard('board-0', players[0].grid, currentPlayer === 1 ? fireShot : null, false, currentPlayer === 1 ? hover : null);
    renderBoard('board-1', players[1].grid, currentPlayer === 0 ? fireShot : null, false, currentPlayer === 0 ? hover : null);
  } else if (phase === 'gameover') {
    // Show winner's remaining ships on their board
    const winnerIdx = currentPlayer;
    const loserIdx = 1 - currentPlayer;
    renderBoard(`board-${winnerIdx}`, players[winnerIdx].grid, null, true, null);
    renderBoard(`board-${loserIdx}`, players[loserIdx].grid, null, false, null);
  }
  document.getElementById('left-label').textContent = 'Player 1';
  document.getElementById('right-label').textContent = 'Player 2';
  renderFleet(0);
  renderFleet(1);
  updateHighlight();
  updateSpecialButtons();
}

function toggleBomb() {
  if (specialBombs[currentPlayer] <= 0) return;
  bombMode = !bombMode;
  if (bombMode) missileMode = false;
  updateSpecialButtons();
  renderBoards();
}

function toggleMissile() {
  if (specialMissiles[currentPlayer] <= 0) return;
  missileMode = !missileMode;
  if (missileMode) bombMode = false;
  updateSpecialButtons();
  renderBoards();
}

function toggleMissileDir() {
  missileDir = missileDir === 'row' ? 'col' : 'row';
  document.getElementById('missile-dir-btn').textContent = missileDir === 'row' ? 'Row' : 'Column';
  renderBoards();
}

function updateSpecialButtons() {
  const bombBtn = document.getElementById('bomb-btn');
  const missileBtn = document.getElementById('missile-btn');
  const missileDirBtn = document.getElementById('missile-dir-btn');
  if (phase === 'battle') {
    bombBtn.classList.remove('hidden');
    bombBtn.disabled = specialBombs[currentPlayer] <= 0;
    bombBtn.classList.toggle('selected', bombMode);
    bombBtn.textContent = specialBombs[currentPlayer] > 0 ? '💣 Special Bomb' : '💣 Used';

    missileBtn.classList.remove('hidden');
    missileBtn.disabled = specialMissiles[currentPlayer] <= 0;
    missileBtn.classList.toggle('selected', missileMode);
    missileBtn.textContent = specialMissiles[currentPlayer] > 0 ? '🚀 Missile' : '🚀 Used';

    if (missileMode) {
      missileDirBtn.classList.remove('hidden');
    } else {
      missileDirBtn.classList.add('hidden');
    }
  } else {
    bombBtn.classList.add('hidden');
    missileBtn.classList.add('hidden');
    missileDirBtn.classList.add('hidden');
  }
}

function getBombCells(r, c) {
  const cells = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) cells.push([nr, nc]);
    }
  }
  return cells;
}

function showBombPreview(tableId, grid, r, c) {
  if (!bombMode) return;
  const cells = getBombCells(r, c);
  const table = document.getElementById(tableId);
  cells.forEach(([pr, pc]) => {
    const td = table.rows[pr + 1]?.cells[pc + 1];
    if (td && !grid[pr][pc].hit) {
      td.className = 'bomb-preview clickable';
    }
  });
}

function clearBombPreview(tableId, grid) {
  const table = document.getElementById(tableId);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const td = table.rows[r + 1]?.cells[c + 1];
      if (!td) continue;
      if (td.classList.contains('bomb-preview') || td.classList.contains('missile-preview')) {
        td.className = 'water clickable';
      }
    }
  }
}

function getMissileCells(r, c) {
  const cells = [];
  if (missileDir === 'row') {
    for (let i = 0; i < SIZE; i++) cells.push([r, i]);
  } else {
    for (let i = 0; i < SIZE; i++) cells.push([i, c]);
  }
  return cells;
}

function showMissilePreview(tableId, grid, r, c) {
  if (!missileMode) return;
  const cells = getMissileCells(r, c);
  const table = document.getElementById(tableId);
  cells.forEach(([pr, pc]) => {
    const td = table.rows[pr + 1]?.cells[pc + 1];
    if (td && !grid[pr][pc].hit) {
      td.className = 'missile-preview clickable';
    }
  });
}

function renderShipSelect() {
  const container = document.getElementById('ship-select');
  container.innerHTML = '';
  const p = players[currentPlayer];
  p.ships.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'ship-btn' + (s.placed ? ' placed' : '') + (selectedShip === i ? ' selected' : '');
    btn.textContent = `${s.name} (${s.size})`;
    if (!s.placed) btn.addEventListener('click', () => { selectedShip = i; renderShipSelect(); });
    container.appendChild(btn);
  });

  const readyBtn = document.getElementById('ready-btn');
  if (p.ships.every(s => s.placed)) {
    readyBtn.classList.remove('hidden');
  } else {
    readyBtn.classList.add('hidden');
  }
}

/* ---- Placement ---- */

function toggleOrientation() {
  orientation = orientation === 'h' ? 'v' : 'h';
  document.getElementById('rotate-btn').textContent = orientation === 'h' ? 'Horizontal' : 'Vertical';
}

function canPlace(grid, r, c, size, dir) {
  for (let i = 0; i < size; i++) {
    const nr = dir === 'v' ? r + i : r;
    const nc = dir === 'h' ? c + i : c;
    if (nr >= SIZE || nc >= SIZE) return false;
    if (grid[nr][nc].ship) return false;
  }
  return true;
}

function placementClick(r, c) {
  if (phase !== 'placing' || selectedShip === null) return;
  const p = players[currentPlayer];
  const ship = p.ships[selectedShip];
  if (ship.placed) return;
  if (!canPlace(p.grid, r, c, ship.size, orientation)) return;

  ship.cells = [];
  for (let i = 0; i < ship.size; i++) {
    const nr = orientation === 'v' ? r + i : r;
    const nc = orientation === 'h' ? c + i : c;
    p.grid[nr][nc].ship = ship;
    ship.cells.push([nr, nc]);
  }
  ship.placed = true;
  selectedShip = null;
  renderShipSelect();
  renderBoards();
}

function finishPlacement() {
  if (currentPlayer === 0) {
    currentPlayer = 1;
    selectedShip = null;
    orientation = 'h';
    document.getElementById('rotate-btn').textContent = 'Horizontal';
    showOverlay('Pass the device', "It's Player 2's turn to place ships.", 'OK');
  } else {
    currentPlayer = 0;
    phase = 'battle';
    bombMode = false;
    missileMode = false;
    document.getElementById('ship-select').innerHTML = '';
    document.getElementById('ready-btn').classList.add('hidden');
    document.getElementById('rotate-btn').classList.add('hidden');
    updateSpecialButtons();
    renderBoards();
    setStatus("Player 1: Fire a shot!");
  }
}

/* ---- Battle ---- */

function fireShot(r, c) {
  if (phase !== 'battle' || waiting) return;
  const enemyIdx = 1 - currentPlayer;

  if (bombMode) {
    fireSpecialBomb(r, c);
    return;
  }
  if (missileMode) {
    fireSpecialMissile(r, c);
    return;
  }

  const cell = players[enemyIdx].grid[r][c];
  if (cell.hit) return;

  cell.hit = true;

  if (cell.ship) {
    const ship = cell.ship;
    if (ship.cells.every(([sr, sc]) => players[enemyIdx].grid[sr][sc].hit)) {
      ship.sunk = true;
    }
    if (players[enemyIdx].ships.every(s => s.sunk)) {
      phase = 'gameover';
      renderBoards();
      showOverlay('Game Over!', `Player ${currentPlayer + 1} wins!`, 'Play Again');
      return;
    }
    setStatus(`Player ${currentPlayer + 1}: Hit!${ship.sunk ? ' ' + ship.name + ' sunk!' : ''}`);
    renderBoards();
  } else {
    setStatus(`Player ${currentPlayer + 1}: Miss!`);
    renderBoards();
    waiting = true;
    setTimeout(() => {
      waiting = false;
      currentPlayer = 1 - currentPlayer;
      bombMode = false;
      missileMode = false;
      updateSpecialButtons();
      renderBoards();
      setStatus(`Player ${currentPlayer + 1}: Fire a shot!`);
    }, 800);
  }
}

function fireSpecialBomb(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  specialBombs[currentPlayer] = 0;
  bombMode = false;

  const cells = getBombCells(r, c);
  const shipsHit = new Set();

  // Mark all cells in blast radius as hit
  cells.forEach(([br, bc]) => {
    const cell = grid[br][bc];
    cell.hit = true;
    if (cell.ship) shipsHit.add(cell.ship);
  });

  // Any ship touched by the blast sinks entirely
  shipsHit.forEach(ship => {
    ship.sunk = true;
    ship.cells.forEach(([sr, sc]) => { grid[sr][sc].hit = true; });
  });

  updateSpecialButtons();

  if (players[enemyIdx].ships.every(s => s.sunk)) {
    phase = 'gameover';
    renderBoards();
    showOverlay('Game Over!', `Player ${currentPlayer + 1} wins!`, 'Play Again');
    return;
  }

  const sunkNames = [...shipsHit].map(s => s.name).join(', ');
  if (shipsHit.size > 0) {
    setStatus(`Player ${currentPlayer + 1}: 💣 BOOM! Sunk: ${sunkNames}!`);
  } else {
    setStatus(`Player ${currentPlayer + 1}: 💣 BOOM! No ships hit.`);
  }
  renderBoards();

  // Always switch turns after bomb
  waiting = true;
  setTimeout(() => {
    waiting = false;
    currentPlayer = 1 - currentPlayer;
    bombMode = false;
    missileMode = false;
    updateSpecialButtons();
    renderBoards();
    setStatus(`Player ${currentPlayer + 1}: Fire a shot!`);
  }, 1200);
}

function fireSpecialMissile(r, c) {
  const enemyIdx = 1 - currentPlayer;
  const grid = players[enemyIdx].grid;
  specialMissiles[currentPlayer] = 0;
  missileMode = false;

  const cells = getMissileCells(r, c);
  const shipsHit = new Set();

  cells.forEach(([mr, mc]) => {
    const cell = grid[mr][mc];
    cell.hit = true;
    if (cell.ship) shipsHit.add(cell.ship);
  });

  // Check normal sinking (not auto-sink like bomb — missile just hits the row/col)
  shipsHit.forEach(ship => {
    if (ship.cells.every(([sr, sc]) => grid[sr][sc].hit)) {
      ship.sunk = true;
    }
  });

  updateSpecialButtons();

  if (players[enemyIdx].ships.every(s => s.sunk)) {
    phase = 'gameover';
    renderBoards();
    showOverlay('Game Over!', `Player ${currentPlayer + 1} wins!`, 'Play Again');
    return;
  }

  const hitCount = [...shipsHit].length;
  const sunkShips = [...shipsHit].filter(s => s.sunk);
  const label = missileDir === 'row' ? `row ${r + 1}` : `column ${'ABCDEFGHIJ'[c]}`;
  let msg = `Player ${currentPlayer + 1}: 🚀 Missile across ${label}! `;
  if (hitCount > 0) {
    msg += `Hit ${hitCount} ship${hitCount > 1 ? 's' : ''}!`;
    if (sunkShips.length > 0) msg += ` Sunk: ${sunkShips.map(s => s.name).join(', ')}!`;
  } else {
    msg += 'No ships hit.';
  }
  setStatus(msg);
  renderBoards();

  waiting = true;
  setTimeout(() => {
    waiting = false;
    currentPlayer = 1 - currentPlayer;
    bombMode = false;
    missileMode = false;
    updateSpecialButtons();
    renderBoards();
    setStatus(`Player ${currentPlayer + 1}: Fire a shot!`);
  }, 1200);
}

/* ---- Overlay ---- */

function showOverlay(title, text, btnText) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-text').textContent = text;
  document.getElementById('overlay-btn').textContent = btnText;
  document.getElementById('overlay-btn').onclick = () => {
    if (phase === 'gameover') { startGame(); return; }
    hideOverlay();
    if (phase === 'placing') {
      renderShipSelect();
      renderBoards();
      setStatus(`Player ${currentPlayer + 1}: Place your ships`);
    } else {
      renderBoards();
      setStatus(`Player ${currentPlayer + 1}: Fire a shot!`);
    }
  };
  document.getElementById('overlay').classList.remove('hidden');
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}
</script>
