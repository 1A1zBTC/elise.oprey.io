<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pet Vet</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#16213e">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E&L Games">
  <link rel="icon" href="../icons/favicon.png">
  <script src="../pwa.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: #76b65a;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Full-bleed canvas fills the whole pane / viewport. */
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: grab;                  /* drag the background to pan the view */
    }
    body.placing #game { cursor: crosshair; }   /* placing an item overrides the grab cursor */

    /* Overlay topbar floats above the canvas. */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(10,14,28,0.45) 0%, rgba(10,14,28,0) 100%);
    }
    .back {
      pointer-events: auto;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 7px 12px;
      border-radius: 12px;
      background: rgba(10,14,28,0.35);
      transition: background 0.15s ease;
    }
    .back:hover { background: rgba(10,14,28,0.6); }

    /* Coin / money counter (top-right). */
    .coin {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px 6px 8px;
      border-radius: 999px;
      background: rgba(10,14,28,0.4);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .coin .disc {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe88a, #f4b740 60%, #d9962a);
      box-shadow: inset 0 0 0 2px #e7a72d;
      display: flex; align-items: center; justify-content: center;
      color: #9a6713; font-size: 0.78rem; font-weight: 900;
    }

    /* Rating + money chips. */
    .rating-chip {
      position: relative;            /* anchor for the floating +/- delta */
      pointer-events: auto;
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px 6px 8px;
      border-radius: 999px;
      background: rgba(10,14,28,0.4);
      color: #fff; font-weight: 800; font-size: 1.05rem;
    }
    .rating-chip .star { color: #ffd24a; font-size: 1.15rem; line-height: 1; }
    .rating-chip .rv { color: #ffe88a; }
    /* Floating +/- value that drifts up and fades when the rating changes. */
    .rating-delta {
      position: absolute;
      left: 50%; top: 0;
      transform: translateX(-50%);
      font-weight: 900; font-size: 0.95rem;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      animation: ratingFloat 1s ease-out forwards;
    }
    .rating-delta.pos { color: #6fe39a; }
    .rating-delta.neg { color: #ff7b7b; }
    @keyframes ratingFloat {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
      20%  { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
    }
    /* Skill cards reuse the shop-item layout; .vl shows the current level. */
    .shop-item .vl { color: #7fe0a0; font-weight: 900; font-size: 0.95rem; margin-top: 1px; }

    /* Shop bar (bottom). */
    .shopbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      background: rgba(14,21,38,0.92);
      border-top: 2px solid #0f3460;
      backdrop-filter: blur(4px);
      padding: 0 10px 8px;
    }
    .rating-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0 2px; }
    .rating-bar .rating-chip { margin-left: auto; }  /* name stays left; stars + money pushed right */
    .shop-tabs { display: flex; gap: 6px; padding: 7px 0 9px; }
    .shop-tab {
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      color: #a0a8c0;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px 12px 0 0;
      padding: 7px 16px;
      cursor: pointer;
    }
    .shop-tab.active { color: #fff; background: #0f3460; border-color: #2f6fd0; }
    .shop-items { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .shop-item {
      flex: 0 0 auto;
      width: 96px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 8px 6px 9px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.12s ease, transform 0.1s ease;
    }
    .shop-item:hover { border-color: #2f6fd0; transform: translateY(-2px); }
    .shop-item.selected { border-color: #4cc46a; box-shadow: 0 0 14px rgba(76,196,106,0.4); }
    .shop-item.disabled { opacity: 0.4; filter: grayscale(0.8); cursor: not-allowed; transform: none; border-color: #0f3460; }
    .shop-item .ic { font-size: 2.1rem; line-height: 1; height: 42px; display: flex; align-items: center; justify-content: center; }
    .shop-item .nm { color: #fff; font-weight: 800; font-size: 0.72rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shop-item .pr { color: #ffd86b; font-weight: 900; font-size: 0.78rem; margin-top: 1px; }
    body.placing { cursor: crosshair; }

    /* Hospital name (under the title) + Saves button in the topbar. */
    .hosp { pointer-events: auto; font-family: 'Nunito', sans-serif; font-weight: 800;
      color: #fff; opacity: 0.95; font-size: 0.82rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35); }
    .savesbtn { pointer-events: auto; font-family: inherit; font-weight: 800; font-size: 0.9rem;
      color: #fff; background: rgba(10,14,28,0.4); border: none; border-radius: 999px;
      padding: 7px 14px; cursor: pointer; transition: background 0.15s ease; }
    .savesbtn:hover { background: rgba(10,14,28,0.65); }

    /* Save / Load modal. */
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center; background: rgba(8,10,20,0.62);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(440px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
      background: #16213e; border: 2px solid #0f3460; border-radius: 18px;
      padding: 14px 14px 16px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .modal-title { font-family: 'Pacifico', cursive; color: #fff; font-size: 1.3rem; }
    .modal-x { background: none; border: none; color: #a0a8c0; font-size: 1.2rem; cursor: pointer; padding: 2px 6px; }
    .modal-x:hover { color: #fff; }
    .modal-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .modal-input { flex: 1; min-width: 0; font-family: inherit; font-size: 0.95rem; font-weight: 700;
      color: #fff; background: #0f3460; border: 2px solid #0f3460; border-radius: 12px; padding: 9px 12px; }
    .modal-input::placeholder { color: #8e9ab8; font-weight: 600; }
    .modal-input:focus { outline: none; border-color: #2f6fd0; }
    .modal-save { font-family: inherit; font-weight: 800; font-size: 0.9rem; color: #0b2018;
      background: #4cc46a; border: none; border-radius: 12px; padding: 9px 16px; cursor: pointer; }
    .modal-save:hover { background: #5fd47c; }
    .modal-new { font-family: inherit; font-weight: 800; font-size: 0.85rem; color: #cfe0ff;
      background: transparent; border: 2px solid #2f6fd0; border-radius: 12px; padding: 8px 14px;
      cursor: pointer; margin-bottom: 12px; align-self: flex-start; }
    .modal-new:hover { background: rgba(47,111,208,0.18); }
    /* Difficulty picker (New Game). */
    .diff-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .diff-opt { text-align: left; font-family: inherit; cursor: pointer; color: #eaf0ff;
      background: #0f3460; border: 2px solid #163a6b; border-radius: 12px; padding: 11px 13px;
      display: flex; flex-direction: column; gap: 3px; transition: border-color .12s, transform .12s; }
    .diff-opt:hover { border-color: #2f6fd0; transform: translateY(-1px); }
    .diff-opt b { font-size: 1rem; font-weight: 900; }
    .diff-opt span { font-size: 0.78rem; color: #a8b4d4; font-weight: 600; }
    .modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .save-row { display: flex; align-items: center; gap: 10px; background: #0f3460;
      border: 2px solid #0f3460; border-radius: 12px; padding: 8px 10px; }
    .save-row.current { border-color: #37b3a3; }
    .save-meta { flex: 1; min-width: 0; }
    .save-meta .nm { color: #fff; font-weight: 800; font-size: 0.9rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .save-meta .sub { color: #ffd86b; font-weight: 700; font-size: 0.7rem; margin-top: 2px; }
    .save-load, .save-del { font-family: inherit; font-weight: 800; font-size: 0.76rem;
      border: none; border-radius: 10px; padding: 7px 11px; cursor: pointer; flex: 0 0 auto; }
    .save-load { background: #2f6fd0; color: #fff; }
    .save-load:hover { background: #3f7fe0; }
    .save-del { background: transparent; color: #d94f6e; border: 2px solid #d94f6e; }
    .save-del:hover { background: rgba(217,79,110,0.16); }
    .modal-empty { color: #a0a8c0; font-size: 0.85rem; text-align: center; padding: 14px 6px; }
    /* Staff overlay: gender toggle + fire button. */
    .modal-toggle { flex: 1; font-family: inherit; font-weight: 800; font-size: 0.92rem;
      color: #cfe0ff; background: transparent; border: 2px solid #2f6fd0; border-radius: 12px;
      padding: 10px 0; cursor: pointer; transition: background 0.12s ease, color 0.12s ease; }
    .modal-toggle:hover { background: rgba(47,111,208,0.18); }
    .modal-toggle.active { background: #2f6fd0; color: #fff; }
    .modal-fire { width: 100%; font-family: inherit; font-weight: 800; font-size: 0.9rem;
      color: #fff; background: #d94f6e; border: none; border-radius: 12px; padding: 11px 16px;
      cursor: pointer; margin-top: 4px; }
    .modal-fire:hover { background: #e3637f; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html" class="back">‹ Games</a>
    <button class="savesbtn" id="savesBtn">Saves</button>
  </div>


  <canvas id="game"></canvas>

  <div class="shopbar" id="shopbar">
    <div class="rating-bar">
      <span class="hosp" id="hospName" style="display:none"></span>
      <span class="rating-chip" id="skillRating"><span class="star">★</span><span class="rv">1.0</span></span>
      <span class="coin"><span class="disc">$</span><span id="moneyCount">0</span></span>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab" data-tab="rooms">Rooms</button>
      <button class="shop-tab active" data-tab="reception">Items</button>
      <button class="shop-tab" data-tab="staff">Staff</button>
      <button class="shop-tab" data-tab="park">Park</button>
      <button class="shop-tab" data-tab="skills">Skills</button>
    </div>
    <div class="shop-items" id="shopItems"></div>
  </div>

  <div class="modal-backdrop" id="saveModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="modal-title">Your Hospitals</span>
        <button class="modal-x" id="saveClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-row">
        <input id="saveName" class="modal-input" type="text" maxlength="40" placeholder="Name your hospital…" />
        <button class="modal-save" id="saveBtn">Save</button>
      </div>
      <button class="modal-new" id="newGameBtn">+ New Game</button>
      <div class="modal-list" id="saveList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="difficultyModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="modal-title">New Game</span>
        <button class="modal-x" id="diffClose" aria-label="Close">✕</button>
      </div>
      <div class="diff-list">
        <button class="diff-opt" data-diff="easy"><b>Easy</b><span>$1000 to start, forgiving rating. A relaxed build.</span></button>
        <button class="diff-opt" data-diff="medium"><b>Medium</b><span>$600 to start, lower rating, unhappy clients sting more.</span></button>
        <button class="diff-opt" data-diff="hard"><b>Hard</b><span>$300 to start, low rating, harsh penalties. Build it up from scratch.</span></button>
      </div>
      <div class="modal-empty">Starting a new game ends your current unsaved hospital.</div>
    </div>
  </div>

  <div class="modal-backdrop" id="staffModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="modal-title" id="staffTitle">Staff</span>
        <button class="modal-x" id="staffClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-row">
        <input id="staffName" class="modal-input" type="text" maxlength="20" placeholder="Name this staff member…" />
      </div>
      <div class="modal-row" id="staffGender">
        <button class="modal-toggle" data-g="male">♂ Male</button>
        <button class="modal-toggle" data-g="female">♀ Female</button>
      </div>
      <button class="modal-fire" id="staffFire">Fire (+$0)</button>
    </div>
  </div>

  <!-- Classic (non-module) script so the game runs when opened via file://;
       browsers block ES-module loading over the file:// protocol. -->
  <script src="js/main.js" defer></script>

  <script>
    // On desktop the homepage loads this game in a pane. Hide the "‹ Games" back link
    // (it would reload the homepage inside the pane) while keeping the title visible.
    if (window.self !== window.top) {
      var b = document.querySelector('.back'); if (b) b.style.visibility = 'hidden';
    }
  </script>
</body>
</html>
